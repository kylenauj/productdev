<!DOCTYPE html>
<html lang="en">
<head>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Adult Rec — Product Launch Dashboard 2026 · v1.14</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
/* ═══════════════════════════════════════════
   MERA DESIGN SYSTEM — tokens.css integration
   Dark canvas, Syne body, DM Mono numerics,
   single warm-orange accent, status triad
   ═══════════════════════════════════════════ */

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

/* ── Design system tokens (dark default) ── */
:root{
  /* Surfaces */
  --bg:#ffffff;
  --surface:#f0ede9;
  --surface-warm:#e8e4e0;
  --fg:#111111;
  --fg-2:#444444;
  --muted:#888888;
  --border:#e0dbd5;
  --border-soft:#ede9e4;

  /* Accent */
  --accent:#e8622a;
  --accent-on:#ffffff;
  --accent-hover:color-mix(in oklab,#e8622a,black 8%);
  --accent-active:color-mix(in oklab,#e8622a,black 14%);

  /* Status */
  --success:#1a7a4a;
  --warn:#b87000;
  --danger:#c0392b;

  /* Fonts */
  --font-display:"Syne",-apple-system,system-ui,sans-serif;
  --font-body:"Syne",-apple-system,system-ui,sans-serif;
  --font-mono:"DM Mono",ui-monospace,Menlo,monospace;

  /* Type scale */
  --text-xs:10px;
  --text-sm:12px;
  --text-base:13px;
  --text-lg:16px;
  --text-xl:21px;
  --text-2xl:26.5px;
  --text-4xl:40px;
  --leading-body:1.55;
  --tracking-display:-0.01em;

  /* Spacing */
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px;
  --space-5:20px; --space-6:24px; --space-8:32px; --space-12:48px;

  /* Radius */
  --radius-sm:8px;
  --radius-md:14px;
  --radius-lg:16px;
  --radius-pill:9999px;

  /* Elevation */
  --elev-flat:none;
  --elev-ring:0 0 0 1px var(--border);
  --elev-raised:inset 0 1px 0 rgba(255,255,255,.6),0 4px 14px rgba(15,23,42,.07);
  --elev-raised-hover:inset 0 1px 0 rgba(255,255,255,.7),0 8px 24px rgba(15,23,42,.12);
  --focus-ring:0 0 0 3px rgba(232,98,42,.28);

  /* Motion */
  --motion-fast:150ms;
  --motion-base:240ms;
  --ease-standard:cubic-bezier(.4,0,.2,1);

  /* Brand extensions */
  --x-inset:#e8e3dd;
  --x-ctrl-bg:#e0dcd7;
  --x-accent-soft:#f5e8e2;
  --x-success-bright:#15824f;
  --x-violet:#7c3aed;
  --x-elev-raised-hover:inset 0 1px 0 rgba(255,255,255,.7),0 14px 30px rgba(15,23,42,.15);

  /* Categorical (product lines) */
  --cat-pre:#1a5fa8;
  --cat-infused:#0e8a99;
  --cat-vape:#b87000;
  --cat-extract:#638f1c;
  --cat-flower:#b83280;

  /* KPI tints */
  --kpi-units-bg:#fdf0eb;
  --kpi-rev-bg:#eef7f1;
  --kpi-cash-bg:#f3f0fd;

  /* Chart */
  --chart-grid:rgba(15,23,42,.07);
  --chart-axis:#c9d1db;
  --chart-tick:#6b7280;

  /* ── Legacy aliases (used throughout app JS) ── */
  --bg2:var(--surface);
  --bg3:var(--surface-warm);
  --bg4:#ddd8d2;
  --sidebar-bg:#1a1410;
  --text:var(--fg);
  --text2:var(--fg-2);
  --text3:var(--muted);
  --text4:#bbbbbb;
  --text-inv:#ffffff;
  --bdr:var(--border);
  --bdr2:#ccc7c0;
  --bdr3:#b0a89e;
  --accent2:#c94f1a;
  --accent3:#ff8455;
  --accent-bg:var(--x-accent-soft);
  --accent-border:#f5c4b0;
  --ok:var(--success);   --ok-bg:#eef7f1;    --ok-dim:#c8ecd6;
  --info:var(--cat-pre); --info-bg:#eef4fc;  --info-dim:#c4daf5;
  --err:var(--danger);   --err-bg:#fdf0ee;   --err-dim:#f5c4be;
  --warn-bg:#fffaed;     --warn-dim:#f5e4aa;
  --rd-col:var(--cat-pre);  --rd-light:#eef4fc;
  --pr-col:var(--cat-vape); --pr-light:#fffaed;
  --op-col:var(--success);  --op-light:#eef7f1;
  --mk-col:var(--x-violet); --mk-light:#f4f0fd;

  /* Radius aliases */
  --r:var(--radius-md);
  --rl:var(--radius-lg);
  --rs:var(--radius-sm);
  --pill:var(--radius-pill);

  /* Gradients */
  --grad-accent:linear-gradient(135deg,#ff9a5a 0%,#e8622a 60%,#c94f1a 100%);
  --grad-accent-soft:linear-gradient(135deg,#ffd9c4 0%,#ffb088 100%);
  --grad-ok:linear-gradient(135deg,#6ee7b7 0%,#1a7a4a 100%);
  --grad-info:linear-gradient(135deg,#93c5fd 0%,#1a5fa8 100%);
  --grad-warn:linear-gradient(135deg,#fde68a 0%,#b87000 100%);
  --grad-err:linear-gradient(135deg,#fca5a5 0%,#c0392b 100%);
  --shadow-accent:0 4px 16px rgba(232,98,42,.28);
  --shadow-card:var(--elev-raised);

  /* Type scale aliases */
  --fs-xs:var(--text-xs);
  --fs-sm:var(--text-sm);
  --fs-base:var(--text-base);
  --fs-md:var(--text-lg);
  --fs-lg:var(--text-xl);
  --fs-xl:var(--text-2xl);
  --sidebar-w:220px;
}

/* ── Dark theme (design system canonical) ── */
[data-theme="dark"]{
  --bg:#161a23;
  --surface:#1e2330;
  --surface-warm:#191e29;
  --fg:#f2f3f5;
  --fg-2:#c4c8d4;
  --muted:#878ea0;
  --border:#2c3347;
  --border-soft:#232a3a;
  --accent:#ff7a3d;
  --accent-on:#ffffff;
  --accent-hover:color-mix(in oklab,#ff7a3d,white 10%);
  --success:#3ddc8a;
  --warn:#f0b73d;
  --danger:#ff6b5c;
  --x-inset:#12161f;
  --x-ctrl-bg:#313c58;
  --x-accent-soft:#3a2316;
  --x-success-bright:#5ee3a0;
  --x-violet:#a78bfa;
  --elev-raised:inset 0 1px 0 rgba(255,255,255,.05),0 8px 24px rgba(0,0,0,.30);
  --elev-raised-hover:inset 0 1px 0 rgba(255,255,255,.08),0 18px 40px rgba(0,0,0,.42);
  --focus-ring:0 0 0 3px rgba(255,122,61,.30);
  --chart-grid:rgba(255,255,255,.05);
  --chart-axis:#2c3347;
  --chart-tick:#878ea0;
  --cat-pre:#5b9bf0;
  --cat-infused:#29c3d4;
  --cat-vape:#f0b73d;
  --cat-extract:#97cf3f;
  --cat-flower:#e879b9;
  --kpi-units-bg:#2a1d15;
  --kpi-rev-bg:#16271f;
  --kpi-cash-bg:#201c2e;
  /* Legacy aliases */
  --bg2:#1e2330; --bg3:#282f42; --bg4:#333c54;
  --sidebar-bg:#0d0f16;
  --text:#f2f3f5; --text2:#c4c8d4; --text3:#878ea0; --text4:#565d72;
  --bdr:#2c3347; --bdr2:#3d4660; --bdr3:#535e7d;
  --accent2:#e8622a; --accent3:#ffab85;
  --accent-bg:#3a2316; --accent-border:#6b3a1f;
  --ok:#3ddc8a;   --ok-bg:#15301f;  --ok-dim:#1f4a30;
  --info:#5b9bf0; --info-bg:#16263f; --info-dim:#1f3a5c;
  --warn-bg:#3a2e10; --warn-dim:#5c4818;
  --err:#ff6b5c;  --err-bg:#3a1815; --err-dim:#5c2620;
  --rd-col:#5b9bf0; --rd-light:#16263f;
  --pr-col:#f0b73d; --pr-light:#3a2e10;
  --op-col:#3ddc8a; --op-light:#15301f;
  --mk-col:#a78bfa; --mk-light:#251e42;
  --shadow-card:0 1px 3px rgba(0,0,0,.3),0 1px 2px rgba(0,0,0,.2);
  --grad-accent:linear-gradient(135deg,#ffab85 0%,#ff7a3d 55%,#e8622a 100%);
  --grad-accent-soft:linear-gradient(135deg,#5c3520 0%,#3a2316 100%);
  --shadow-accent:0 4px 20px rgba(255,122,61,.35);
}

[data-theme="dark"] body{ background:var(--bg); }
[data-theme="dark"] .ei{ background:var(--bg2); border-color:var(--bdr2); color:var(--text); }
[data-theme="dark"] .btn{ background:var(--bg2); border-color:var(--bdr2); color:var(--text2); }
[data-theme="dark"] .btn:hover{ background:var(--bg3); }
[data-theme="dark"] .task-tbl tr.overdue-row td{ background:var(--err-bg); }

/* Card elevation */
.shell,[style*="background:var(--bg)"],[style*="background: var(--bg)"]{box-shadow:var(--shadow-card)}
[data-theme="dark"] [style*="background:var(--bg)"]{ box-shadow:var(--shadow-card); }


/* ── Base ── */
*{color-scheme:light}
html,body{
  background:var(--bg);color:var(--fg);
  font-family:var(--font-body);
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  font-size:var(--text-base);line-height:var(--leading-body);
  font-variant-numeric:tabular-nums;
}
#root{position:relative}
.mono{font-family:var(--mono)!important;}
.pos{color:var(--success);} .neg{color:var(--danger);} .muted{color:var(--muted);}

/* Numbers & mono labels — DM Mono everywhere it counts */
.kpi .big,.kpi .sub,.kpi-foot,.kpi-name,
.chip,.tb,.badge,
.stat .k,.stat .v,.stat .s,
.prod-chip-brand,.prod-chip-meta,
.task-tbl th,.task-tbl td:not(:first-child),
.topbar2-meta,.sidebar-badge,.sidebar-pc-badge,
.spec-key,.gantt-cat-hd,.cat-header,
.save-ind,.eyebrow{
  font-family:var(--mono);
}

/* ── Topbar ── */
.topbar2{
  height:46px;background:var(--bg);border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 20px;gap:12px;
  position:sticky;top:0;z-index:50;
  box-shadow:0 1px 0 var(--border-soft);
}
.topbar2-title{font-family:var(--font-body);font-size:14px;font-weight:600;letter-spacing:-0.01em;color:var(--fg)}
.topbar2-sep{width:1px;height:16px;background:var(--border)}
.topbar2-meta{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;}
.topbar2-actions{margin-left:auto;display:flex;align-items:center;gap:8px}

/* ── Sidebar ── */
.sidebar{
  width:var(--sidebar-w);background:var(--sidebar-bg);
  display:flex;flex-direction:column;
  position:fixed;top:0;left:0;bottom:0;z-index:100;overflow:hidden;
}
.sidebar-logo{padding:20px 16px 14px;border-bottom:1px solid rgba(255,255,255,.08);}
.sidebar-logo-mark{display:flex;align-items:center;gap:10px;margin-bottom:2px}
.sidebar-logo-dot{
  width:30px;height:30px;background:var(--accent);border-radius:var(--rs);
  display:flex;align-items:center;justify-content:center;
  font-size:15px;font-weight:900;color:#fff;flex-shrink:0;
}
.sidebar-title{font-family:var(--font-body);font-size:13px;font-weight:600;color:#fff;letter-spacing:-0.01em}
.sidebar-sub{font-family:var(--mono);font-size:10px;color:rgba(255,255,255,.4);margin-top:2px;text-transform:uppercase;letter-spacing:.1em}
.sidebar-nav{flex:1;overflow-y:auto;padding:8px}
.sidebar-section-label{
  font-family:var(--mono);font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.14em;
  color:rgba(255,255,255,.3);padding:14px 8px 5px;
}
.sidebar-item{
  display:flex;align-items:center;gap:9px;padding:9px 11px;
  border-radius:9px;cursor:pointer;border:none;background:transparent;
  font-family:var(--font-body);font-size:var(--text-sm);font-weight:500;
  color:rgba(255,255,255,.5);width:100%;text-align:left;
  transition:background 150ms,color 150ms;position:relative;
}
.sidebar-item:hover{background:rgba(255,255,255,.07);color:rgba(255,255,255,.8)}
.sidebar-item.active{
  background:var(--accent-soft);color:var(--accent);font-weight:700;
}
[data-theme="dark"] .sidebar-item.active{
  background:var(--grad-accent);color:#fff;
  box-shadow:0 2px 10px rgba(255,122,61,.25);
}
.sidebar-item i{font-size:15px;width:18px;text-align:center;flex-shrink:0}
.sidebar-badge{
  margin-left:auto;background:var(--danger);color:#fff;
  border-radius:var(--pill);padding:2px 8px;
  font-family:var(--mono);font-size:10px;font-weight:700;
}
[data-theme="dark"] .sidebar-badge{background:var(--grad-err);}
.sidebar-pc-badge{margin-left:auto;font-family:var(--mono);font-size:10px;color:rgba(255,255,255,.25)}
.sidebar-footer{padding:10px 8px;border-top:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;gap:2px;}
.sidebar-footer-btn{
  display:flex;align-items:center;gap:8px;padding:9px 11px;border-radius:9px;
  cursor:pointer;border:none;background:transparent;
  font-family:var(--font-body);font-size:var(--text-sm);
  color:rgba(255,255,255,.4);width:100%;text-align:left;transition:all 150ms;
}
.sidebar-footer-btn:hover{background:rgba(255,255,255,.07);color:rgba(255,255,255,.75)}
.sidebar-footer-btn i{font-size:14px;width:18px;text-align:center}

/* ── Main ── */
.main-content{margin-left:var(--sidebar-w);flex:1;min-width:0;display:flex;flex-direction:column;min-height:100vh;}

/* ── Eyebrow ── */
.eyebrow{
  font-family:var(--mono);font-size:10px;color:var(--fg-2);font-weight:700;
  letter-spacing:.14em;text-transform:uppercase;
  display:flex;align-items:center;gap:9px;margin-bottom:14px;
  background:var(--surface-warm);border:1px solid var(--border);
  border-left:3px solid var(--accent);border-radius:8px;padding:9px 13px;
}

/* ── KPI tiles ── */
.kpi{
  background:var(--surface);border:1px solid transparent;
  border-radius:var(--radius-md);padding:18px 20px;
  position:relative;overflow:hidden;box-shadow:var(--elev-raised);
}
.kpi.ku{background:var(--kpi-units-bg);}
.kpi.kr{background:var(--kpi-rev-bg);}
.kpi.kc{background:var(--kpi-cash-bg);}
.kpi .big{
  font-family:var(--mono);font-size:40px;font-weight:700;
  line-height:.95;letter-spacing:-0.01em;color:var(--fg);
}
.kpi .big .unit{font-size:15px;color:var(--muted);font-weight:400;margin-left:5px;}
.kpi .sub{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:10px;}
.kpi-name{
  font-family:var(--mono);font-size:11px;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;color:var(--fg-2);
  margin-bottom:12px;
}
.kpi-name.tu{color:var(--accent);}
.kpi-name.tr{color:var(--success);}
.kpi-name.tc{color:var(--x-violet);}

/* ── Product cards ── */
.prod{
  background:var(--surface);border:1px solid transparent;
  border-radius:var(--radius-md);padding:16px 18px;
  box-shadow:var(--elev-raised);
}
.prod-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:15px;}
.prod-name{display:flex;align-items:center;gap:8px;font-size:var(--text-base);font-weight:600;color:var(--fg);}
.dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.chip{
  font-family:var(--mono);font-size:10px;
  padding:3px 8px;border-radius:5px;letter-spacing:.02em;white-space:nowrap;
}
.chip.over{background:rgba(61,220,138,.14);color:var(--success);}
.chip.near{background:rgba(240,183,61,.14);color:var(--warn);}
.chip.under{background:rgba(255,107,92,.14);color:var(--danger);}
.chip.nu{background:rgba(135,142,160,.12);color:var(--muted);}

/* ── Badges / tb ── */
.badge{
  font-family:var(--mono);font-size:10px;
  display:inline-flex;align-items:center;
  padding:3px 8px;border-radius:5px;white-space:nowrap;font-weight:500;
}
.tb{font-family:var(--mono);font-size:10px;padding:4px 9px;border-radius:6px;letter-spacing:.02em;}
.tb-vol{background:rgba(167,139,250,.14);color:var(--x-violet);}
.tb-up{background:rgba(61,220,138,.14);color:var(--success);}
.tb-dn{background:rgba(255,107,92,.14);color:var(--danger);}
.tb-nu{background:rgba(135,142,160,.12);color:var(--muted);}

/* ── Data tables (mrow / mtable style) ── */
.mtable{border-top:1px solid var(--border);}
.mrow{
  display:grid;gap:12px;padding:13px 20px;
  border-top:1px solid var(--border-soft);align-items:center;
}
.mrow:first-child{border-top:none;}
.mrow.head{padding:11px 20px;}
.mrow.head>div{
  font-family:var(--mono);font-size:9px;color:var(--fg-2);
  letter-spacing:.06em;text-transform:uppercase;
}
.mrow.head>div:not(:first-child){text-align:right;}
.mc-cell{font-family:var(--mono);font-size:14px;font-weight:500;text-align:right;color:var(--fg-2);}
.mc-cell.teal{color:var(--success);}
.skf-tot{
  border-top:2px solid var(--accent);
  background:color-mix(in srgb,var(--accent) 10%,var(--surface-warm));
}
.skf-tot .mc-cell{font-weight:700;color:var(--fg);}

/* ── Cards / shell ── */
.card,.shell,.month-card,.summary-card{
  background:var(--surface);border:1px solid transparent;
  border-radius:var(--radius-md);overflow:hidden;
  box-shadow:var(--elev-raised);
}
.shell{background:var(--bg);border-radius:var(--radius-lg);}
.summary-card{
  border-radius:var(--radius-md);padding:16px;cursor:pointer;
  transition:box-shadow 150ms,transform 150ms;
}
.summary-card:hover{box-shadow:var(--elev-raised-hover);transform:translateY(-2px);}
[style*="background:var(--bg)"],[style*="background: var(--bg)"]{ box-shadow:var(--elev-raised); }

/* Product strip */
.prod-strip{display:flex;gap:8px;padding:14px 20px;overflow-x:auto;border-bottom:1px solid var(--border);background:var(--bg);}
.prod-chip{
  flex-shrink:0;width:174px;background:var(--surface);border:1px solid transparent;
  border-radius:var(--radius-md);padding:11px 13px;cursor:pointer;
  transition:box-shadow 150ms,transform 150ms;
  position:relative;overflow:hidden;box-shadow:var(--elev-raised);
}
.prod-chip::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--chip-accent,var(--border));}
.prod-chip:hover{transform:translateY(-2px);box-shadow:var(--elev-raised-hover);}
.prod-chip.active{border-color:var(--accent);background:var(--accent-bg);}
.prod-chip.active::before{background:var(--accent);}
.prod-chip-brand{font-family:var(--mono);font-size:9px;font-weight:500;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin-bottom:4px}
.prod-chip-name{font-family:var(--font-body);font-size:12px;font-weight:600;color:var(--fg);line-height:1.3;margin-bottom:7px}
.prod-chip-meta{font-family:var(--mono);font-size:10px;color:var(--muted);display:flex;gap:8px;align-items:center}
.prod-chip-pct{height:5px;background:var(--border);margin-top:8px;overflow:hidden;border-radius:var(--pill);}
.prod-chip-pct-fill{height:100%;background:var(--chip-accent,var(--grad-accent));border-radius:var(--pill);}

/* ── Buttons ── */
.btn{
  background:var(--surface);border:1px solid var(--border);border-radius:9px;
  cursor:pointer;padding:6px 14px;
  font-family:var(--font-body);font-size:var(--text-sm);font-weight:500;
  color:var(--fg-2);
  display:inline-flex;align-items:center;gap:5px;
  transition:background 150ms,border-color 150ms,color 150ms,transform 150ms,box-shadow 150ms;
  box-shadow:var(--elev-raised);
}
.btn:hover{border-color:var(--accent);color:var(--accent);background:var(--surface-warm);transform:translateY(-1px);box-shadow:var(--elev-raised-hover);}
[data-theme="dark"] .btn{background:var(--bg2);border-color:var(--bdr2);color:var(--text2);}
[data-theme="dark"] .btn:hover{background:var(--bg3);}
.btn-primary{
  background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;
  box-shadow:var(--shadow-accent);border-radius:var(--pill);
}
.btn-primary:hover{filter:brightness(1.08);}
.icon-btn{
  background:transparent;border:none;cursor:pointer;color:var(--muted);
  padding:4px 6px;border-radius:var(--rs);display:inline-flex;align-items:center;
  transition:all 150ms;
}
.icon-btn:hover{color:var(--fg);background:var(--surface-warm);}

/* ── Section tabs ── */
.sectabs{display:flex;border-bottom:1px solid var(--border);padding:0 20px;background:var(--bg);}
.stab{
  background:transparent;border:none;border-bottom:2px solid transparent;
  cursor:pointer;padding:9px 14px;
  font-family:var(--font-body);font-size:var(--text-sm);font-weight:500;
  color:var(--muted);transition:color 150ms;
}
.stab:hover{color:var(--fg-2);}
.stab.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600;}

/* ── Task table ── */
.task-tbl{width:100%;border-collapse:collapse;}
.task-tbl th{
  padding:7px 12px;text-align:left;
  font-family:var(--mono);font-size:9px;font-weight:600;
  color:var(--muted);letter-spacing:.09em;text-transform:uppercase;
  background:var(--surface-warm);border-bottom:1px solid var(--border);
}
.task-tbl td{
  padding:7px 12px;font-size:var(--text-sm);
  border-bottom:0.5px solid var(--border-soft);vertical-align:middle;
}
.task-tbl td:not(:first-child){font-family:var(--mono);}
.task-tbl tr:last-child td{border-bottom:none;}
.task-tbl tr:hover td{background:var(--surface);}
.task-tbl tr.overdue-row td{background:var(--err-bg);}
[data-theme="dark"] .task-tbl tr.overdue-row td{background:var(--err-bg);}

/* ── Stat panels ── */
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--border);border-bottom:1px solid var(--border);}
.stat{background:var(--surface);padding:15px 20px;}
.stat .k{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px;}
.stat .v{font-family:var(--mono);font-size:25px;font-weight:600;line-height:1;letter-spacing:-0.01em;}
.stat .s{font-family:var(--mono);font-size:11px;margin-top:7px;color:var(--muted);}

/* ── Inputs ── */
*{color-scheme:light;}
input,textarea,select{color:var(--fg);background:var(--bg);font-family:inherit;}
select option{background:var(--bg);color:var(--fg);}
input.ei,textarea.ei,select.ei{
  background:var(--surface-warm);border:1px solid var(--border);border-radius:var(--rs);
  color:var(--fg);font-family:inherit;font-size:inherit;
  padding:6px 10px;outline:none;width:100%;
  transition:border-color 150ms;
}
.ei:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,122,61,.2);}
textarea.ei{resize:vertical;min-height:52px;border-radius:var(--rs);}

/* Password modal */
.pw-modal,.pw-overlay .pw-modal{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-lg);padding:22px;
  box-shadow:0 24px 64px rgba(0,0,0,.5);
}
.pw-input{
  width:100%;background:var(--x-inset);border:1px solid var(--border);
  border-radius:10px;padding:11px 13px;color:var(--fg);
  font-family:var(--mono);font-size:14px;letter-spacing:.06em;outline:none;
  transition:border-color 150ms;
}
.pw-input:focus{border-color:var(--accent);}

/* ── Category / gate headers ── */
.cat-header{
  display:flex;align-items:center;gap:9px;padding:9px 16px;
  font-family:var(--mono);font-size:10px;font-weight:700;cursor:pointer;user-select:none;
  border-bottom:1px solid var(--border);text-transform:uppercase;letter-spacing:.09em;
  background:var(--surface-warm);
}
.add-row{
  background:transparent;border:none;cursor:pointer;color:var(--muted);
  font-family:var(--font-body);font-size:var(--text-sm);
  padding:7px 16px;display:flex;align-items:center;gap:6px;width:100%;
  border-top:1px solid var(--border);transition:all 150ms;
}
.add-row:hover{color:var(--accent);background:var(--accent-bg);}

/* Owner pills */
.owner-pills{display:flex;gap:6px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--border);background:var(--bg);}
.owner-pill{
  background:var(--surface);border:1px solid var(--border);border-radius:5px;
  padding:3px 10px;cursor:pointer;
  font-family:var(--mono);font-size:var(--text-sm);
  color:var(--muted);transition:all 150ms;
}
.owner-pill.active{background:var(--accent-bg);border-color:var(--accent);color:var(--accent);font-weight:600;}

/* ── Specs ── */
.specs-wrap{padding:20px 24px;}
.spec-section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);margin-bottom:10px;overflow:hidden;box-shadow:var(--elev-raised);}
.spec-sec-hd{
  padding:9px 14px;font-family:var(--mono);font-size:9px;font-weight:700;
  letter-spacing:.09em;background:var(--surface-warm);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:7px;cursor:pointer;user-select:none;text-transform:uppercase;
}
.spec-grid{display:grid;grid-template-columns:1fr 1fr;}
.spec-field{display:flex;padding:8px 14px;border-bottom:1px solid var(--border-soft);gap:12px;}
.spec-field:nth-child(odd){border-right:1px solid var(--border-soft);}
.spec-field.full{grid-column:1/-1;border-right:none;}
.spec-key{font-family:var(--mono);font-size:9.5px;color:var(--muted);width:160px;flex-shrink:0;padding-top:2px;text-transform:uppercase;letter-spacing:.07em;}
.spec-val{font-size:var(--text-base);flex:1;min-width:0;}
.editable{cursor:pointer;border-radius:3px;padding:1px 4px;display:inline-block;min-width:10px;}
.editable:hover{background:var(--surface-warm);outline:1px dashed var(--border);}

/* ── Gantt ── */
.gantt-wrap{padding:20px 24px;}
.gantt-toolbar{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.gantt-btn{
  background:var(--surface);border:1px solid var(--border);border-radius:8px;
  cursor:pointer;padding:5px 11px;
  font-family:var(--font-body);font-size:var(--text-sm);
  color:var(--fg-2);display:inline-flex;align-items:center;gap:4px;
  transition:all 150ms;box-shadow:var(--elev-raised);
}
.gantt-btn:hover{background:var(--surface-warm);color:var(--accent);border-color:var(--accent);}
.gantt-cat-hd{font-family:var(--mono);font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;}
.gantt-bar{position:absolute;border-radius:6px;overflow:hidden;display:flex;align-items:center;padding:0 7px;min-width:4px;transition:filter 150ms;}
.gantt-bar:hover{opacity:.82;}

/* ── Misc page elements ── */
.page-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px;}
.page-hd h1{font-family:var(--font-body);font-size:var(--text-xl);font-weight:600;letter-spacing:-0.01em;color:var(--fg);}
.save-ind{font-family:var(--mono);font-size:var(--text-sm);color:var(--success);display:flex;align-items:center;gap:4px;}
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
div:hover > .rm-btn{display:flex!important;}
.fullscreen-shell{border-radius:0;}

/* ── Leaflet ── */
.leaflet-container{font-family:var(--font-body);font-size:12px;}
.leaflet-tooltip{background:var(--surface);color:var(--fg);border:1px solid var(--border);border-radius:var(--rs);padding:6px 10px;box-shadow:0 2px 10px rgba(0,0,0,.12);font-family:inherit;}
.leaflet-tooltip-top::before{border-top-color:var(--border);}
.leaflet-control-attribution{font-size:9px;opacity:.5;}

/* ── Animations ── */
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn .18s ease;}

/* ── Scrollbar ── */
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
::-webkit-scrollbar-thumb:hover{background:var(--muted);}
.leaflet-tile{filter:none;}
</style>

// One-time migration: apply default owners to all existing products
// Only fills in EMPTY owners — never overwrites a name someone already set
const MIGRATION_KEY='au_owner_migration_v1';
const applyDefaultOwners=data=>{
  let changed=false;
  Object.keys(data).forEach(pcKey=>{
    if(!Array.isArray(data[pcKey]))return;
    data[pcKey].forEach(prod=>{
      if(!Array.isArray(prod.tasks))return;
      prod.tasks.forEach(task=>{
        if(!task.owner&&DEFAULT_TASK_OWNERS[task.name]!==undefined){
          task.owner=DEFAULT_TASK_OWNERS[task.name];
          changed=true;
        }
      });
      // Also ensure marketing tasks exist
      const hasMkt=prod.tasks.some(t=>t.name==='Pre-Sell Communications');
      if(!hasMkt){
        ['Pre-Sell Communications','Launch Eblast & Comms','Digital Selling Assets','Printed Marketing Materials']
          .forEach(name=>{
            prod.tasks.push({id:'mkt_'+Math.random().toString(36).slice(2,8),name,owner:DEFAULT_TASK_OWNERS[name]||'Kyle',status:'Not Started',start:'',end:'',notes:'',atRisk:false,cat:'marketing'});
          });
        changed=true;
      }
    });
  });
  return changed;
};

function Editable({value,onChange,multiline=false,style={},placeholder='',className=''}){
  const [editing,setEditing]=useState(false);const [val,setVal]=useState(value||'');const ref=useRef();
  useEffect(()=>{setVal(value||'');},[value]);
  useEffect(()=>{if(editing&&ref.current)ref.current.focus();},[editing]);
  const commit=()=>{setEditing(false);if(val!==(value||''))onChange(val);};
  if(editing)return multiline
    ?el('textarea',{ref,className:'ei '+className,style:{...style,width:'100%'},value:val,onChange:ev=>setVal(ev.target.value),onBlur:commit,onKeyDown:ev=>ev.key==='Escape'&&(setVal(value||''),setEditing(false))})
    :el('input',{ref,type:'text',className:'ei '+className,style,value:val,onChange:ev=>setVal(ev.target.value),onBlur:commit,onKeyDown:ev=>{if(ev.key==='Enter')commit();if(ev.key==='Escape'){setVal(value||'');setEditing(false);}}});
  return el('span',{className:'editable '+className,style,onClick:()=>setEditing(true),title:'Click to edit'},val||el('span',{style:{color:'var(--text3)',fontStyle:'italic'}},placeholder));
}
function ESelect({value,options,onChange,style={}}){
  return el('select',{className:'ei',style,value:value||options[0],onChange:ev=>onChange(ev.target.value)},options.map(o=>el('option',{key:o,value:o},o)));
}

/* ── Ring (donut progress) ── */
function Ring({rd,pr,op,size=48}){
  const r=size/2-4,circ=2*Math.PI*r,total=rd+pr+op||1;
  const segs=[{v:rd,c:CAT.rd.col},{v:pr,c:CAT.procurement.col},{v:op,c:CAT.operations.col}];
  let off=0;
  return el('svg',{width:size,height:size,viewBox:`0 0 ${size} ${size}`,style:{transform:'rotate(-90deg)',flexShrink:0}},
    el('circle',{cx:size/2,cy:size/2,r,fill:'none',stroke:'var(--bg3)',strokeWidth:4}),
    segs.map((s,i)=>{const dash=circ*s.v/total,gap=circ-dash,o=off;off+=dash;return s.v>0&&el('circle',{key:i,cx:size/2,cy:size/2,r,fill:'none',stroke:s.c,strokeWidth:4,strokeDasharray:`${dash} ${gap}`,strokeDashoffset:-o,strokeLinecap:'butt'});})
  );
}

/* ══════════════════════════════════════════
   PM FRAMEWORK
   Gate-based launch planning with T-minus
══════════════════════════════════════════ */

// Gate definitions — each gate = one task category
const GATES=[
  {id:'g1',label:'G1',name:'R&D',      cat:'rd',        col:'var(--rd-col)',  bg:'var(--rd-light)'},
  {id:'g2',label:'G2',name:'Procurement',cat:'procurement',col:'var(--pr-col)',bg:'var(--pr-light)'},
  {id:'g3',label:'G3',name:'Operations', cat:'operations', col:'var(--op-col)',  bg:'var(--op-light)'},
  {id:'g4',label:'G4',name:'Marketing',  cat:'marketing',  col:'var(--mk-col)',  bg:'var(--mk-light)'},
];

// Calculate gate status from tasks
const getGateStatus=tasks=>{
  return GATES.map(g=>{
    const catTasks=tasks.filter(t=>t.cat===g.cat);
    if(!catTasks.length) return {...g,status:'empty',done:0,total:0};
    const done=catTasks.filter(t=>t.status==='Done').length;
    const overdue=catTasks.filter(t=>isOverdue(t)).length;
    const status=done===catTasks.length?'cleared':overdue>0?'blocked':'in-progress';
    return {...g,status,done,total:catTasks.length,overdue};
  });
};

// Current gate = first non-cleared gate
const getCurrentGate=gates=>{
  const first=gates.find(g=>g.status!=='cleared'&&g.status!=='empty');
  return first||gates[gates.length-1];
};

// RAG status from gate health
const getRAG=gates=>{
  if(gates.some(g=>g.status==='blocked')) return 'red';
  const cur=getCurrentGate(gates);
  if(cur&&cur.overdue>0) return 'amber';
  return 'green';
};

// T-minus from launch date
const getTMinus=launchDate=>{
  if(!launchDate) return null;
  const launch=new Date(launchDate+'T00:00:00');
  const days=Math.round((launch-TODAY_D)/86400000);
  return days; // negative = overdue, 0 = today, positive = future
};

const fmtTMinus=days=>{
  if(days===null) return null;
  if(days===0) return 'T-0 · Launch Day';
  if(days<0) return 'T+'+(Math.abs(days))+'d post-launch';
  if(days<=14) return 'T-'+days+'d';
  const weeks=Math.round(days/7);
  return 'T-'+weeks+'w';
};

/* ── Gate Badge strip ── */
function GateBadges({gates,compact=false}){
  return el('div',{style:{display:'flex',gap:compact?3:5,alignItems:'center'}},
    gates.map(g=>{
      const icon=g.status==='cleared'?'ti-check':g.status==='blocked'?'ti-alert-triangle':g.status==='in-progress'?'ti-progress':'ti-circle';
      const isCleared=g.status==='cleared';
      const col=isCleared?'#fff':g.status==='blocked'?'var(--err)':g.status==='in-progress'?g.col:'var(--text4)';
      const bg=isCleared?'var(--grad-ok)':g.status==='blocked'?'var(--err-bg)':g.status==='in-progress'?g.bg:'var(--bg3)';
      return el('div',{key:g.id,title:g.name+': '+g.status+(g.total?' ('+g.done+'/'+g.total+')':''),style:{
        display:'flex',alignItems:'center',gap:3,
        background:bg,
        border:isCleared?'none':'1px solid '+col,
        borderRadius:'var(--pill)',padding:compact?'2px 7px':'3px 9px',
        fontSize:compact?9:10,fontWeight:700,color:col,
        boxShadow:isCleared?'0 1px 4px rgba(26,122,74,.25)':'none',
      }},
        el('i',{className:'ti '+icon,style:{fontSize:compact?9:10}}),
        !compact&&' '+g.label
      );
    })
  );
}

/* ── RAG dot ── */
function RAGDot({rag,size=8}){
  const grad=rag==='red'?'var(--grad-err)':rag==='amber'?'var(--grad-warn)':'var(--grad-ok)';
  const col=rag==='red'?'var(--err)':rag==='amber'?'var(--warn)':'var(--ok)';
  return el('div',{title:'RAG: '+rag,style:{
    width:size,height:size,borderRadius:'50%',background:grad,flexShrink:0,
    boxShadow:'0 0 0 3px '+col+'22, 0 1px 3px '+col+'55'
  }});
}

/* ── T-Minus Hero ── */
function TMinusHero({launchDate,compact=false}){
  const days=getTMinus(launchDate);
  if(days===null) return null;
  const label=fmtTMinus(days);
  const isPost=days<=0;
  const isUrgent=days>0&&days<=14;
  const col=isPost?'var(--ok)':isUrgent?'var(--err)':'var(--text2)';
  const bg=isPost?'var(--ok-bg)':isUrgent?'var(--err-bg)':'var(--bg3)';
  const bdr=isPost?'var(--ok-dim)':isUrgent?'var(--err-dim)':'var(--bdr)';
  if(compact) return el('span',{style:{fontSize:11,fontWeight:700,color:col}},label);
  const grad=isPost?'var(--grad-ok)':isUrgent?'var(--grad-err)':null;
  return el('div',{style:{
    display:'inline-flex',alignItems:'center',gap:8,
    background:grad||bg,
    border:grad?'none':'1px solid '+bdr,
    borderRadius:'var(--pill)',
    padding:'7px 14px',
    boxShadow:grad?'0 2px 10px '+(isPost?'rgba(26,122,74,.25)':'rgba(192,57,43,.25)'):'none',
  }},
    el('i',{className:'ti ti-rocket',style:{fontSize:13,color:grad?'#fff':col}}),
    el('div',null,
      el('div',{style:{fontSize:11,fontWeight:800,color:grad?'#fff':col,letterSpacing:'.02em'}},label),
      el('div',{style:{fontSize:9,color:grad?'rgba(255,255,255,.85)':'var(--text3)',marginTop:1}},
        isPost?'post-launch':isUrgent?'URGENT — under 2 weeks':'to launch'
      )
    )
  );
}

/* ══════════════════════════════════════════
   EXCEL IMPORT MODAL v2
   Parses Mera Product Development Tracker
   ══════════════════════════════════════════ */

const IMPORT_FIELD_MAP = {
  'categroy':'Category','inital case offering (ft)':'Initial Case Offering (FT)',
  'prouduct primary/hardware':'Product Primary/Hardware',
  'product package/outter':'Product Package/Outer',
  'accesory':'Accessory','label thc range ':'Label THC Range',
  'biomass input ':'Biomass Input','master case dimensions ':'Master Case Dimensions',
  'manufactured by: lp name ':'Manufactured by: LP Name',
};
const importNormField = k=>{
  if(!k) return null;
  const lk=String(k).toLowerCase().trim();
  return IMPORT_FIELD_MAP[lk]||String(k).trim()||null;
};
const IMPORT_SKIP=new Set(['product specifics','packaging requirements','status','notes','key update','key updates','blocker','blockers','','status ']);
const importNormTag=v=>{
  if(!v) return 'In Progress';
  const lv=String(v).toLowerCase();
  if(lv.includes('accept')) return 'Accepted';
  if(lv.includes('reject')) return 'Rejected';
  if(lv.includes('cancel')) return 'Cancelled';
  if(lv.includes('launch')) return 'Launched';
  if(lv.includes('risk')) return 'At Risk';
  if(lv.includes('progress')) return 'In Progress';
  return 'In Progress';
};
const IMPORT_SHEET_PC={'PC#1 2026':'pc1','PC#2 2026':'pc2','PC#3 2026':'pc3','PC#4 2026':'pc4','In Development':'in_dev'};

function parseTrackerWorkbook(wb){
  const XLSX=window.XLSX;
  const results={};
  const targets=['PC#1 2026','PC#2 2026','PC#3 2026','PC#4 2026','In Development'];

  for(const shName of targets){
    if(!wb.SheetNames.includes(shName)) continue;
    const ws=wb.Sheets[shName];
    if(!ws) continue;

    // Convert to row arrays — raw:true keeps numbers as numbers
    const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:null,raw:true});
    if(!rows.length) continue;

    // Find "Product Name Internal" row
    let prodRow=-1;
    for(let i=0;i<rows.length;i++){
      const v=rows[i][0];
      if(v&&String(v).trim().toLowerCase().startsWith('product name internal')){
        prodRow=i; break;
      }
    }
    if(prodRow<0) continue;

    // Product columns = any column > 0 with a non-empty string in that row
    const prodCols=[];
    const prow=rows[prodRow];
    for(let j=1;j<(prow.length||30);j++){
      const v=prow[j];
      if(v&&String(v).trim().length>1) prodCols.push(j);
    }
    if(!prodCols.length) continue;

    // Find brand row
    let brandRow=-1;
    for(let i=0;i<rows.length;i++){
      if(rows[i][0]&&String(rows[i][0]).trim().toLowerCase().startsWith('brand name internal')){
        brandRow=i; break;
      }
    }

    // Find status — look for row where product cols have status-like values
    // or row 0/1 where col 0 is "Status" or "Planned Launch Time" with status values
    let statusRow=-1;
    for(let i=0;i<Math.min(prodRow,5);i++){
      const hasStat=prodCols.some(j=>{
        const v=rows[i][j]?String(rows[i][j]).toLowerCase():'';
        return v.includes('accept')||v.includes('reject')||v.includes('cancel')||v.includes('progress');
      });
      if(hasStat){statusRow=i;break;}
    }
    // Also check a row with col[0]='Status'
    if(statusRow<0){
      for(let i=0;i<prodRow;i++){
        if(rows[i][0]&&String(rows[i][0]).toLowerCase().trim()==='status'){statusRow=i;break;}
      }
    }

    // Find updates / blockers rows
    let updRow=-1,blkRow=-1;
    for(let i=0;i<rows.length;i++){
      const v=rows[i][0]?String(rows[i][0]).toLowerCase().trim():'';
      if(v.includes('key update')&&updRow<0) updRow=i;
      if(v.includes('blocker')&&blkRow<0) blkRow=i;
    }

    // Build field→rowIndex map (spec rows only)
    const fieldRows={};
    for(let i=0;i<rows.length;i++){
      if(i===prodRow||i===brandRow) continue;
      const raw=rows[i][0];
      if(!raw) continue;
      const sk=String(raw).trim().toLowerCase();
      if(IMPORT_SKIP.has(sk)) continue;
      const norm=importNormField(raw);
      if(norm) fieldRows[norm]=i;
    }

    const pcId=IMPORT_SHEET_PC[shName]||'in_dev';
    results[shName]={pcId,products:[]};

    for(const j of prodCols){
      const nameRaw=rows[prodRow][j];
      if(!nameRaw) continue;
      const name=String(nameRaw).split('\n')[0].trim();
      if(!name||name.length<2) continue;

      const brand=brandRow>=0&&rows[brandRow][j]?String(rows[brandRow][j]).trim():'';
      const status=statusRow>=0&&rows[statusRow][j]?importNormTag(rows[statusRow][j]):'In Progress';
      const updates=updRow>=0&&rows[updRow][j]?String(rows[updRow][j]).trim():'';
      const blockers=blkRow>=0&&rows[blkRow][j]?String(rows[blkRow][j]).trim():'';

      const specs={};
      for(const [field,ri] of Object.entries(fieldRows)){
        const raw=rows[ri][j];
        if(raw===null||raw===undefined) continue;
        const sv=String(raw).trim();
        if(!sv) continue;
        if(['Landed Cost','Wholesale Cost','MSRP'].includes(field)&&!isNaN(parseFloat(sv))){
          specs[field]='$'+parseFloat(sv).toFixed(2);
        } else {
          specs[field]=sv;
        }
      }

      results[shName].products.push({name,shortName:name.split(' ').slice(0,5).join(' '),brand,status,specs,notes:{updates,blockers}});
    }
  }
  return results;
}

function ImportExcelModal({onImport,onClose,existingData}){
  const [stage,setStage]=React.useState('upload');
  const [parsed,setParsed]=React.useState(null);
  const [selected,setSelected]=React.useState({});
  const [busy,setBusy]=React.useState(false);
  const [err,setErr]=React.useState('');
  const [dragging,setDragging]=React.useState(false);
  const fileRef=React.useRef();

  const processFile=async file=>{
    if(!file) return;
    if(!file.name.match(/\.xlsx?$/i)){setErr('Please upload an Excel file (.xlsx)');return;}
    setBusy(true); setErr('');
    try{
      const buf=await file.arrayBuffer();
      const XLSX=window.XLSX;
      if(!XLSX){setErr('SheetJS not loaded — check internet connection');setBusy(false);return;}
      const wb=XLSX.read(new Uint8Array(buf),{type:'array'});
      console.log('Sheets found:',wb.SheetNames);
      const result=parseTrackerWorkbook(wb);
      console.log('Parse result:',result);
      const total=Object.values(result).reduce((s,sh)=>s+sh.products.length,0);
      if(!total){
        setErr('No products found. Check the file is the Product Development Tracker and has PC#1/PC#2/PC#3/PC#4/In Development sheets.');
        setBusy(false); return;
      }
      const sel={};
      Object.keys(result).forEach(sh=>{sel[sh]=true;});
      setParsed(result);
      setSelected(sel);
      setStage('preview');
    }catch(e){
      console.error('Import error:',e);
      setErr('Error: '+e.message);
    }
    setBusy(false);
  };

  const onDrop=e=>{
    e.preventDefault(); setDragging(false);
    const file=e.dataTransfer?.files?.[0];
    if(file) processFile(file);
  };

  const totalSelected=parsed
    ?Object.entries(selected).filter(([,v])=>v).reduce((s,[sh])=>s+(parsed[sh]?.products?.length||0),0)
    :0;

  const doImport=()=>{
    if(!parsed) return;
    const updates={};
    let pcTabs=[...(existingData.pcTabs||[])];
    if(!pcTabs.find(t=>t.id==='pc4')) pcTabs=[...pcTabs,{id:'pc4',label:'PC#4 2026'}];

    let added=0;
    for(const [shName,sheet] of Object.entries(parsed)){
      if(!selected[shName]) continue;
      const pcId=sheet.pcId;
      const existing=updates[pcId]||(existingData[pcId]||[]);
      const existingNames=new Set(existing.map(p=>p.name.toLowerCase().trim()));
      const toAdd=sheet.products
        .filter(p=>!existingNames.has(p.name.toLowerCase().trim()))
        .map(p=>({
          id:uid(),name:p.name,shortName:p.shortName,brand:p.brand,
          skuCode:'',launchDate:'',tags:[p.status],
          notes:p.notes,specs:p.specs,
          tasks:[...BLANK_PROD('').tasks]
        }));
      updates[pcId]=[...existing,...toAdd];
      added+=toAdd.length;
    }
    onImport({...updates,pcTabs});
    alert(`✓ Imported ${added} new product${added===1?'':'s'}. Products already in the dashboard were skipped.`);
    onClose();
  };

  return el('div',{
    style:{position:'fixed',inset:0,background:'rgba(0,0,0,.65)',backdropFilter:'blur(4px)',
      zIndex:700,display:'flex',alignItems:'center',justifyContent:'center',padding:20},
    onClick:e=>e.target===e.currentTarget&&onClose()
  },
    el('div',{style:{
      background:'var(--surface)',border:'1px solid var(--border)',borderRadius:'var(--radius-lg)',
      width:'100%',maxWidth:560,maxHeight:'88vh',display:'flex',flexDirection:'column',
      boxShadow:'0 24px 64px rgba(0,0,0,.5)'
    }},
      /* Header */
      el('div',{style:{
        padding:'16px 20px',borderBottom:'1px solid var(--border)',
        background:'var(--surface-warm)',borderRadius:'var(--radius-lg) var(--radius-lg) 0 0',
        display:'flex',alignItems:'center',justifyContent:'space-between'
      }},
        el('div',null,
          el('div',{style:{fontSize:15,fontWeight:700,color:'var(--fg)',display:'flex',alignItems:'center',gap:8}},
            el('i',{className:'ti ti-file-import',style:{color:'var(--accent)',fontSize:17}}),
            'Import from Excel Tracker'

function CopyDatesModal({sourceProd, allProds, onCopy, onClose}){
  const [selected, setSelected] = React.useState([]);
  const [matchBy, setMatchBy] = React.useState('name'); // 'name' | 'order'
  const [preview, setPreview] = React.useState(false);

  // Count source tasks that have dates
  const datedTasks = (sourceProd.tasks||[]).filter(t=>t.start&&t.end);

  const toggle = id => setSelected(s => s.includes(id) ? s.filter(x=>x!==id) : [...s, id]);
  const toggleAll = () => setSelected(s => s.length===allProds.length ? [] : allProds.map(p=>p.id));

  // Preview: show how many tasks would be matched per destination
  const getMatchCount = (destProd) => {
    if(matchBy==='order') return Math.min(datedTasks.length, destProd.tasks.length);
    return destProd.tasks.filter(dt=>
      datedTasks.some(st=>st.name.toLowerCase().trim()===dt.name.toLowerCase().trim())
    ).length;
  };

  const handleCopy = () => {
    const targets = allProds.filter(p=>selected.includes(p.id));
    const updates = targets.map(destProd => {
      const newTasks = destProd.tasks.map((dt, di) => {
        let match = null;
        if(matchBy==='name'){
          match = datedTasks.find(st=>
            st.name.toLowerCase().trim()===dt.name.toLowerCase().trim()
          );
        } else {
          match = datedTasks[di] || null;
        }
        return match ? {...dt, start:match.start, end:match.end} : dt;
      });
      return {prod:{...destProd, tasks:newTasks}};
    });
    onCopy(updates);
    onClose();
  };

  return el('div',{
    style:{position:'fixed',inset:0,background:'rgba(0,0,0,.62)',backdropFilter:'blur(3px)',
      zIndex:600,display:'flex',alignItems:'center',justifyContent:'center',padding:20},
    onClick:e=>e.target===e.currentTarget&&onClose()

      boxShadow:'0 24px 64px rgba(0,0,0,.5)'
    }},
      /* Header */
      el('div',{style:{padding:'16px 20px',borderBottom:'1px solid var(--border)',display:'flex',alignItems:'center',justifyContent:'space-between',background:'var(--surface-warm)',borderRadius:'var(--radius-lg) var(--radius-lg) 0 0'}},
        el('div',null,
          el('div',{style:{fontSize:15,fontWeight:600,color:'var(--fg)',display:'flex',alignItems:'center',gap:8}},
            el('i',{className:'ti ti-copy',style:{color:'var(--accent)',fontSize:17}}),
            'Copy Task Dates'
          ),
          el('div',{style:{fontFamily:'var(--mono)',fontSize:10,color:'var(--muted)',marginTop:3,textTransform:'uppercase',letterSpacing:'.07em'}},
            'From: '+sourceProd.shortName+' · '+datedTasks.length+' dated tasks'
          )
        ),
        el('button',{onClick:onClose,style:{background:'none',border:'none',cursor:'pointer',color:'var(--muted)',fontSize:18}},
          el('i',{className:'ti ti-x'})
        )
      ),

      el('div',{style:{padding:'16px 20px',overflowY:'auto',flex:1}},
        /* Match method */
        el('div',{style:{marginBottom:16}},
          el('div',{style:{fontFamily:'var(--mono)',fontSize:9,fontWeight:700,textTransform:'uppercase',letterSpacing:'.1em',color:'var(--muted)',marginBottom:8}},
            'Match tasks by'
          ),
          el('div',{style:{display:'flex',gap:8}},
            ['name','order'].map(opt=>
              el('button',{key:opt,onClick:()=>setMatchBy(opt),style:{
                flex:1,padding:'8px',borderRadius:8,cursor:'pointer',fontFamily:'var(--font-body)',
                border:'1px solid '+(matchBy===opt?'var(--accent)':'var(--border)'),
                background:matchBy===opt?'var(--accent-bg)':'var(--surface-warm)',
                color:matchBy===opt?'var(--accent)':'var(--fg-2)',

              }},
                el('i',{className:'ti '+(opt==='name'?'ti-text-size':'ti-list-numbers'),style:{fontSize:16}}),
                el('span',null,opt==='name'?'Task Name':'Task Order'),
                el('span',{style:{fontFamily:'var(--mono)',fontSize:9,opacity:.7}},
                  opt==='name'?'Matches by exact name':'Copies by position (1st→1st, 2nd→2nd…)'
                )
              )
            )
          )
        ),

        /* Destination list */
        el('div',{style:{marginBottom:12}},
          el('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:8}},
            el('div',{style:{fontFamily:'var(--mono)',fontSize:9,fontWeight:700,textTransform:'uppercase',letterSpacing:'.1em',color:'var(--muted)'}},'Copy to'),
            el('button',{onClick:toggleAll,style:{fontFamily:'var(--mono)',fontSize:10,color:'var(--accent)',background:'none',border:'none',cursor:'pointer',fontWeight:600}},
              selected.length===allProds.length?'Deselect all':'Select all'
            )
          ),
          el('div',{style:{display:'flex',flexDirection:'column',gap:6}},
            allProds.map(p=>{
              const isOn = selected.includes(p.id);
              const matchCount = getMatchCount(p);
              return el('div',{key:p.id,
                onClick:()=>toggle(p.id),
                style:{
                  display:'flex',alignItems:'center',gap:10,padding:'10px 12px',
                  borderRadius:8,cursor:'pointer',
                  border:'1px solid '+(isOn?'var(--accent)':'var(--border)'),
                  background:isOn?'var(--accent-bg)':'var(--surface-warm)',
                  transition:'all 150ms'
                }
              },
                el('div',{style:{
                  width:18,height:18,borderRadius:5,border:'2px solid '+(isOn?'var(--accent)':'var(--border)'),
                  background:isOn?'var(--accent)':'transparent',
                  display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,
                  transition:'all 150ms'
                }},
                  isOn&&el('i',{className:'ti ti-check',style:{fontSize:10,color:'#fff'}})
                ),
                el('div',{style:{flex:1,minWidth:0}},
                  el('div',{style:{fontSize:12,fontWeight:600,color:isOn?'var(--fg)':'var(--fg-2)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},p.shortName||p.name),
                  el('div',{style:{fontFamily:'var(--mono)',fontSize:9,color:'var(--muted)',marginTop:2}},
                    p.pcLabel||'',
                    matchCount>0?el('span',{style:{color:'var(--success)',marginLeft:6}},
                      '· '+matchCount+' task'+(matchCount===1?'':'s')+' will match'
                    ):el('span',{style:{color:'var(--danger)',marginLeft:6}},'· no matching tasks')
                  )
                ),
                el('i',{className:'ti ti-'+(isOn?'check':'plus'),
                  style:{fontSize:12,color:isOn?'var(--accent)':'var(--muted)',flexShrink:0}})
              );
            })
          )
        )
      ),

      /* Footer */
      el('div',{style:{padding:'14px 20px',borderTop:'1px solid var(--border)',display:'flex',gap:10,justifyContent:'flex-end'}},
        el('button',{onClick:onClose,style:{
          background:'var(--surface-warm)',border:'1px solid var(--border)',borderRadius:8,
          padding:'9px 18px',fontSize:13,fontFamily:'var(--font-body)',
          color:'var(--fg-2)',cursor:'pointer'
        }},'Cancel'),
        el('button',{
          onClick:handleCopy,
          disabled:selected.length===0,
          style:{
            background:selected.length?'var(--accent)':'var(--surface-warm)',
            border:'none',borderRadius:8,padding:'9px 18px',fontSize:13,
            fontFamily:'var(--font-body)',color:selected.length?'#fff':'var(--muted)',
            fontWeight:600,cursor:selected.length?'pointer':'not-allowed',
            display:'flex',alignItems:'center',gap:7
          }
        },
          el('i',{className:'ti ti-copy'}),
          'Copy to '+selected.length+' product'+(selected.length===1?'':'s')
        )
      )
    )
  );
}


function GanttChart({tasks,launchDate,onChange}){
  const [zoom,setZoom]=useState(1);
  const [drag,setDrag]=useState(null);
  const [containerWidth,setContainerWidth]=useState(0);
  const [showAddTask,setShowAddTask]=useState(false);
  const [addTaskCat,setAddTaskCat]=useState('rd');
  const containerRef=React.useRef();

  // Re-measure on resize so chart fills available space
  React.useEffect(()=>{
    if(!containerRef.current) return;
    const ro=new ResizeObserver(entries=>{
      setContainerWidth(entries[0]?.contentRect?.width||0);
    });
    ro.observe(containerRef.current);
    setContainerWidth(containerRef.current.offsetWidth);
    return()=>ro.disconnect();
  },[]);

  // Drag effect — ALL hooks before early return
  React.useEffect(()=>{
    if(!drag) return;
    const dateAddDays=(dateStr,days)=>{
      const d=new Date(dateStr+'T00:00:00');
      d.setDate(d.getDate()+Math.round(days));
      return d.toISOString().slice(0,10);
    };
    const onMove=e=>{
      const dx=e.clientX-drag.startX;
      const days=dx/drag.pxPerDay;
      const t=tasks.find(t=>t.id===drag.taskId);
      if(!t) return;
      let ns=drag.origStart, ne=drag.origEnd;
      if(drag.type==='move'){ ns=dateAddDays(drag.origStart,days); ne=dateAddDays(drag.origEnd,days); }
      else if(drag.type==='left'){ ns=dateAddDays(drag.origStart,days); if(ns>=ne) ns=drag.origStart; }
      else if(drag.type==='right'){ ne=dateAddDays(drag.origEnd,days); if(ne<=ns) ne=drag.origEnd; }
      if(onChange) onChange({...t,start:ns,end:ne});
    };
    const onUp=()=>setDrag(null);
    window.addEventListener('mousemove',onMove);
    window.addEventListener('mouseup',onUp);
    return()=>{ window.removeEventListener('mousemove',onMove); window.removeEventListener('mouseup',onUp); };
  },[drag,tasks,onChange]);

  const LW=148, dated=tasks.filter(t=>t.start&&t.end);
  if(!dated.length) return el('div',{style:{padding:'28px 20px',color:'var(--text2)',fontSize:13,textAlign:'center'}},
    el('i',{className:'ti ti-calendar-off',style:{fontSize:28,display:'block',marginBottom:8,opacity:.4}}),
    'Add start and end dates to tasks to see the Gantt chart.');

  const ds=dated.flatMap(t=>[parseD(t.start),parseD(t.end)]);
  if(launchDate&&parseD(launchDate)) ds.push(parseD(launchDate));
  let mn=new Date(Math.min(...ds)); mn.setDate(1);
  let mx=new Date(Math.max(...ds)); mx.setMonth(mx.getMonth()+1); mx.setDate(0);
  const tot=mx-mn;
  const pL=d=>Math.max(0,Math.min(100,(parseD(d)-mn)/tot*100));
  const pW=(s,e)=>Math.max(0.2,(parseD(e)-parseD(s))/tot*100);
  const tdP=(TODAY_D-mn)/tot*100, showTd=tdP>=0&&tdP<=100;
  const lP=launchDate&&parseD(launchDate)?pL(launchDate):null;

  const BW=Math.round((containerWidth||containerRef.current?.offsetWidth||900)*zoom);
  const pxPerDay=BW/(tot/86400000);
  const totalDays=Math.round(tot/86400000);

  // Build week markers (every Monday)
  const weeks=[];
  const cur=new Date(mn);
  // advance to first Monday
  while(cur.getDay()!==1) cur.setDate(cur.getDate()+1);
  while(cur<=mx){
    const p=(cur-mn)/tot*100;
    const label='W'+String(Math.ceil((cur-new Date(cur.getFullYear(),0,1))/86400000/7)+1).padStart(2,'0');
    weeks.push({date:new Date(cur),p,label,x:p/100*BW});
    cur.setDate(cur.getDate()+7);
  }

  // Month labels
  const months=[];
  const dd=new Date(mn);
  while(dd<=mx){
    months.push({
      l:dd.toLocaleString('en-CA',{month:'short'}),
      y:String(dd.getFullYear()).slice(2),
      p:(dd-mn)/tot*100
    });
    dd.setMonth(dd.getMonth()+1);
  }

  // Alternating week bands (even/odd)
  const weekBands=weeks.map((wk,i)=>{
    const nextX = i+1<weeks.length ? weeks[i+1].x : BW;
    return {x:wk.x, w:nextX-wk.x, even:i%2===0};
  });

  const dateAddDays=(dateStr,days)=>{
    const d=new Date(dateStr+'T00:00:00');
    d.setDate(d.getDate()+Math.round(days));
    return d.toISOString().slice(0,10);
  };

  const handleMouseDown=(e,taskId,type)=>{
    e.preventDefault(); e.stopPropagation();
    const t=tasks.find(t=>t.id===taskId);
    if(!t) return;
    setDrag({taskId,type,startX:e.clientX,origStart:t.start,origEnd:t.end,pxPerDay});
  };

  const groups=CAT_ORDER.map(cid=>({...CAT[cid],items:dated.filter(t=>t.cat===cid)})).filter(g=>g.items.length);

  const handleStyle={
    position:'absolute',top:0,bottom:0,width:8,cursor:'ew-resize',
    zIndex:10,display:'flex',alignItems:'center',justifyContent:'center',
    background:'rgba(255,255,255,.25)',borderRadius:2,
  };

  // Row height
  const ROW_H=30;

  return el('div',{className:'gantt-wrap'},
    /* Toolbar */
    el('div',{className:'gantt-toolbar'},
      el('button',{className:'gantt-btn',onClick:()=>setZoom(z=>Math.min(z+0.4,4))},el('i',{className:'ti ti-zoom-in'}),' In'),
      el('button',{className:'gantt-btn',onClick:()=>setZoom(z=>Math.max(z-0.4,0.5))},el('i',{className:'ti ti-zoom-out'}),' Out'),
      el('button',{className:'gantt-btn',onClick:()=>setZoom(1)},el('i',{className:'ti ti-refresh'}),' Reset'),
      el('span',{style:{fontSize:10,color:'var(--text3)',marginLeft:8}},totalDays+' days · '+weeks.length+' weeks'),
      drag&&el('span',{style:{fontSize:11,color:'var(--accent)',fontWeight:600,marginLeft:8}},
        el('i',{className:'ti ti-drag-drop',style:{marginRight:4}}),'Dragging…'
      ),
      el('button',{
        className:'btn',
        onClick:()=>setShowAddTask(t=>!t),
        style:{marginLeft:'auto',background:showAddTask?'var(--accent)':'',
          color:showAddTask?'#fff':'',border:showAddTask?'none':'',fontSize:11}
      },el('i',{className:'ti ti-plus'}),' Add Task'),
      el('span',{style:{marginLeft:'auto',display:'flex',alignItems:'center',gap:10,fontSize:10,color:'var(--text3)'}},
        showTd&&el('span',null,el('span',{style:{color:'var(--err)',fontWeight:700,marginRight:3}},'━'),'Today'),
        lP!==null&&el('span',null,el('span',{style:{color:'var(--ok)',fontWeight:700,marginRight:3}},'━'),'Launch')
      )
    ),

    el('div',{ref:containerRef,style:{overflowX:'auto',cursor:drag?'grabbing':'default'}},
      el('div',{style:{minWidth:LW+BW}},

        /* ── Add Task inline form ── */
        showAddTask&&el('div',{style:{
          display:'flex',alignItems:'center',gap:8,padding:'10px 16px',
          background:'var(--accent-bg)',borderBottom:'1px solid var(--accent-border)',
          flexWrap:'wrap'
        }},
          el('span',{style:{fontFamily:'var(--mono)',fontSize:10,fontWeight:700,color:'var(--accent)',textTransform:'uppercase',letterSpacing:'.07em'}},
            '+ New Task'
          ),
          el('input',{
            id:'gantt-task-name',
            className:'ei',placeholder:'Task name…',
            style:{flex:2,minWidth:160,fontSize:12},
            onKeyDown:e=>{
              if(e.key==='Enter'){
                const nm=e.target.value.trim();
                if(nm&&onChange){
                  const start=new Date().toISOString().slice(0,10);
                  const end=new Date(Date.now()+14*86400000).toISOString().slice(0,10);
                  const nt={id:uid(),name:nm,cat:addTaskCat,status:'Not Started',owner:'',start,end};
                  onChange&&onChange(nt,'add');
                  e.target.value='';
                }
              }
            }
          }),
          el('select',{
            className:'ei',value:addTaskCat,
            onChange:e=>setAddTaskCat(e.target.value),
            style:{flex:1,minWidth:120,fontSize:11}
          },
            CAT_ORDER.map(c=>el('option',{key:c,value:c},CAT[c].label))
          ),
          el('input',{
            type:'date',className:'ei',
            style:{flex:'0 0 130px',fontSize:11},
            placeholder:'Start date',
            onChange:e=>document.getElementById('gantt-start-tmp')&&(document.getElementById('gantt-start-tmp').value=e.target.value)
          }),
          el('span',{style:{color:'var(--muted)',fontSize:11}},'→'),
          el('input',{
            type:'date',className:'ei',
            style:{flex:'0 0 130px',fontSize:11},
            placeholder:'End date',
            onChange:e=>document.getElementById('gantt-end-tmp')&&(document.getElementById('gantt-end-tmp').value=e.target.value)
          }),
          el('button',{
            className:'btn',
            style:{background:'var(--accent)',color:'#fff',border:'none',fontSize:11},
            onClick:()=>{
              const nm=document.getElementById('gantt-task-name')?.value?.trim();
              if(nm&&onChange){
                const dateInputs=document.querySelectorAll('[placeholder="Start date"],[placeholder="End date"]');
                const start=dateInputs[0]?.value||new Date().toISOString().slice(0,10);
                const end=dateInputs[1]?.value||new Date(Date.now()+14*86400000).toISOString().slice(0,10);
                const nt={id:uid(),name:nm,cat:addTaskCat,status:'Not Started',owner:'',start,end};
                onChange&&onChange(nt,'add');
                if(document.getElementById('gantt-task-name')) document.getElementById('gantt-task-name').value='';
              }
            }
          },el('i',{className:'ti ti-plus'}),' Add'),
          el('button',{className:'btn',style:{fontSize:11},onClick:()=>setShowAddTask(false)},'✕')
        ),

        /* ── HEADER ROW ── */
        el('div',{style:{display:'flex',borderBottom:'1px solid var(--bdr)',marginBottom:0,position:'sticky',top:0,background:'var(--bg)',zIndex:20}},
          /* Label column header */
          el('div',{style:{width:LW,flexShrink:0,padding:'4px 8px',fontSize:10,fontWeight:700,color:'var(--text3)',textTransform:'uppercase',letterSpacing:'.06em',borderRight:'1px solid var(--bdr)'}},'Task'),
          /* Timeline header */
          el('div',{style:{width:BW,flex:'none',position:'relative'}},
            /* Month row */
            el('div',{style:{height:18,position:'relative',borderBottom:'0.5px solid var(--bdr)',background:'var(--bg2)'}},
              months.map((mo,i)=>el('div',{key:i,style:{
                position:'absolute',left:(mo.p/100*BW)+'px',top:0,bottom:0,
                display:'flex',alignItems:'center',paddingLeft:6,
                borderLeft:'1px solid var(--bdr)',
                fontSize:10,fontWeight:700,color:'var(--text2)',
                whiteSpace:'nowrap',userSelect:'none'
              }},mo.l+' \''+mo.y))
            ),
            /* Week row */
            el('div',{style:{height:16,position:'relative',borderBottom:'1px solid var(--bdr)',background:'var(--bg2)'}},
              weeks.map((wk,i)=>el('div',{key:i,style:{
                position:'absolute',left:wk.x+'px',top:0,bottom:0,
                borderLeft:'1px solid var(--bdr2)',
                display:'flex',alignItems:'center',paddingLeft:3,
                fontSize:8,color:'var(--text3)',whiteSpace:'nowrap',userSelect:'none',
                fontWeight:600,letterSpacing:'.03em'
              }},i%2===0?wk.label:''))
            )
          )
        ),

        /* ── TASK ROWS ── */
        groups.map(g=>el('div',{key:g.id},
          /* Gate header */
          el('div',{className:'gantt-cat-hd',style:{
            background:g.light,color:g.text,
            display:'flex',alignItems:'center',gap:6,
            padding:'4px 8px',fontSize:10,fontWeight:700,
            textTransform:'uppercase',letterSpacing:'.06em',
            position:'sticky',left:0
          }},
            el('i',{className:'ti ti-circle-filled',style:{fontSize:8}}),g.label
          ),

          g.items.map(t=>{
            const l=pL(t.start), w=pW(t.start,t.end);
            const col=barC(t.cat,t.status), od=isOverdue(t);
            const isDragging=drag&&drag.taskId===t.id;
            const barPx=Math.max(8,w/100*BW);

            return el('div',{key:t.id,style:{display:'flex',alignItems:'center',height:ROW_H,borderBottom:'0.5px solid var(--bdr)'}},
              /* Task label */
              el('div',{style:{
                width:LW,flexShrink:0,fontSize:11,paddingRight:8,paddingLeft:8,
                overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',
                color:od?'var(--err)':'var(--text2)',fontWeight:od?600:'normal',
                borderRight:'1px solid var(--bdr)',height:'100%',
                display:'flex',alignItems:'center',gap:4
              }},
                od&&el('i',{className:'ti ti-alert-triangle',style:{fontSize:10,color:'var(--err)',flexShrink:0}}),
                el('span',{style:{overflow:'hidden',textOverflow:'ellipsis'}},t.name)
              ),

              /* Bar area */
              el('div',{style:{width:BW,flex:'none',position:'relative',height:'100%'}},

                /* Alternating week bands */
                weekBands.map((wb,i)=>el('div',{key:i,style:{
                  position:'absolute',left:wb.x+'px',top:0,bottom:0,width:wb.w+'px',
                  background:wb.even?'transparent':'rgba(0,0,0,.018)',
                  pointerEvents:'none'
                }})),

                /* Week separator lines */
                weeks.map((wk,i)=>el('div',{key:i,style:{
                  position:'absolute',left:wk.x+'px',top:0,bottom:0,
                  width:1,background:'var(--bdr)',opacity:.5,pointerEvents:'none'
                }})),

                /* Today line */
                showTd&&el('div',{style:{position:'absolute',left:(tdP/100*BW)+'px',top:0,bottom:0,width:2,background:'var(--err)',zIndex:3,opacity:.85}}),

                /* Launch line */
                lP!==null&&el('div',{style:{position:'absolute',left:(lP/100*BW)+'px',top:0,bottom:0,width:2,background:'var(--ok)',zIndex:3}}),

                /* Task bar */
                el('div',{
                  title:t.name+'\n'+fmtD(t.start)+' → '+fmtD(t.end)+' ('+Math.round((parseD(t.end)-parseD(t.start))/86400000)+' days)'+(od?'\n⚠ OVERDUE':'')+(t.owner?'\n@'+t.owner:''),
                  className:'gantt-bar',
                  style:{
                    left:(l/100*BW)+'px',
                    width:barPx+'px',
                    top:'50%',transform:'translateY(-50%)',
                    background:od?'var(--grad-err)':`linear-gradient(180deg,${col}f5 0%,${col}c0 100%)`,
                    boxShadow:'0 1px 4px '+(od?'rgba(192,57,43,.3)':col+'40'),
                    outline:isDragging?'2px solid var(--accent)':od?'2px solid var(--err)':'none',
                    cursor:'grab',userSelect:'none',
                    opacity:isDragging?0.85:1,
                    height:22
                  },
                  onMouseDown:e=>handleMouseDown(e,t.id,'move')
                },
                  el('div',{style:{...handleStyle,left:0,borderRadius:'2px 0 0 2px'},onMouseDown:e=>handleMouseDown(e,t.id,'left')},
                    el('i',{style:{fontSize:7,color:'rgba(255,255,255,.7)',pointerEvents:'none'}},'\u2551')
                  ),
                  barPx>60&&el('span',{style:{fontSize:9,fontWeight:600,color:od?'#fff':barT(t.cat,t.status),whiteSpace:'nowrap',overflow:'hidden',pointerEvents:'none',padding:'0 10px',textOverflow:'ellipsis',maxWidth:(barPx-20)+'px',display:'block'}},t.name),
                  el('div',{style:{...handleStyle,right:0,borderRadius:'0 2px 2px 0'},onMouseDown:e=>handleMouseDown(e,t.id,'right')},
                    el('i',{style:{fontSize:7,color:'rgba(255,255,255,.7)',pointerEvents:'none'}},'\u2551')
                  )
                )
              )
            );
          })
        )),

        /* Legend */
        el('div',{style:{display:'flex',gap:12,marginTop:10,paddingLeft:LW,flexWrap:'wrap',paddingBottom:4}},
          CAT_ORDER.flatMap(cid=>['Done','In Progress','Not Started'].map(st=>el('div',{key:cid+st,style:{display:'flex',alignItems:'center',gap:4}},
            el('div',{style:{width:11,height:11,borderRadius:3,background:barC(cid,st)}}),
            el('span',{style:{fontSize:10,color:'var(--text2)'}},CAT[cid].label.split(' ')[0]+' – '+st)
          ))),
          el('div',{style:{display:'flex',alignItems:'center',gap:4}},
            el('div',{style:{width:11,height:11,borderRadius:3,background:'var(--err)'}}),
            el('span',{style:{fontSize:10,color:'var(--text2)'}},'Overdue')
          ),
          el('div',{style:{display:'flex',alignItems:'center',gap:4,marginLeft:12,paddingLeft:12,borderLeft:'1px solid var(--bdr)'}},
            el('i',{className:'ti ti-drag-drop',style:{fontSize:11,color:'var(--text3)'}}),
            el('span',{style:{fontSize:10,color:'var(--text3)'}},'Drag bar · Drag edges to resize')
          )
        )
      )
    )
  );
}


function TasksPanel({tasks,onChange,onAdd,onDel}){
  const [coll,setColl]=useState({});
  const [ownerFilter,setOwnerFilter]=useState('All');
  const upd=(id,f,v)=>onChange(tasks.map(t=>t.id===id?{...t,[f]:v}:t));
  const bulkStatus=(catId,status)=>onChange(tasks.map(t=>t.cat===catId?{...t,status}:t));
  const allOwners=['All',...[...new Set(tasks.map(t=>t.owner).filter(Boolean))].sort()];
  const groups=CAT_ORDER.map(cid=>({...CAT[cid],items:tasks.filter(t=>t.cat===cid&&(ownerFilter==='All'||t.owner===ownerFilter))}));
  return el('div',null,
    el('div',{style:{display:'flex',alignItems:'center',gap:8,padding:'8px 20px',borderBottom:'0.5px solid var(--bdr)',background:'var(--bg2)',flexWrap:'wrap'}},
      el('span',{style:{fontSize:11,color:'var(--text2)',fontWeight:500}},el('i',{className:'ti ti-filter',style:{fontSize:12,marginRight:3}}),'Owner:'),
      allOwners.map(o=>el('button',{key:o,onClick:()=>setOwnerFilter(o),style:{background:ownerFilter===o?'var(--bg)':'transparent',border:ownerFilter===o?'0.5px solid var(--bdr2)':'0.5px solid transparent',borderRadius:6,cursor:'pointer',padding:'3px 10px',fontSize:11,color:ownerFilter===o?'var(--text)':'var(--text2)',fontWeight:ownerFilter===o?500:'normal'}},o))
    ),
    groups.map(g=>el('div',{key:g.id},
      el('div',{className:'cat-header',style:{background:g.light,color:g.text}},
        el('div',{onClick:()=>setColl(c=>({...c,[g.id]:!c[g.id]})),style:{display:'flex',alignItems:'center',gap:8,flex:1,cursor:'pointer'}},
          el('i',{className:'ti '+(coll[g.id]?'ti-chevron-right':'ti-chevron-down'),style:{fontSize:12}}),
          el('span',null,g.label),
          el('span',{style:{fontSize:11,marginLeft:4,opacity:.6}},g.items.length+' tasks · '+g.items.filter(t=>t.status==='Done').length+' done',
            g.items.some(t=>isOverdue(t))&&el('span',{style:{color:'var(--err)',marginLeft:6,fontWeight:700}},'⚠ overdue')
          )
        ),
        !coll[g.id]&&el('div',{style:{display:'flex',gap:4,marginLeft:'auto'}},
          el('span',{style:{fontSize:10,color:g.text,opacity:.7,alignSelf:'center',marginRight:4},'aria-label':'Bulk set status'},'Set all:'),
          ['Done','In Progress','Not Started'].map(s=>el('button',{key:s,onClick:e=>{e.stopPropagation();bulkStatus(g.id,s);},style:{background:'rgba(0,0,0,.08)',border:'none',borderRadius:4,cursor:'pointer',padding:'2px 7px',fontSize:10,color:g.text,fontWeight:500}},s))
        )
      ),
      !coll[g.id]&&el('div',null,
        el('table',{className:'task-tbl'},

/* ── Image Field ── */
function ImageField({value,onChange,label}){
  const fileRef=useRef();
  const hasImg=value&&value.startsWith('data:');
  const upload=e=>{
    const file=e.target.files[0];if(!file)return;
    if(file.size>4*1024*1024){alert('Image must be under 4 MB.');return;}
    const r=new FileReader();
    r.onload=ev=>onChange(ev.target.result);
    r.readAsDataURL(file);
    e.target.value='';
  };
  return el('div',{style:{display:'flex',alignItems:'flex-start',gap:10,flex:1}},
    hasImg
      ? el('div',{style:{position:'relative',flexShrink:0}},
          el('img',{src:value,alt:label,style:{width:'100%',maxWidth:200,height:160,objectFit:'contain',borderRadius:8,border:'0.5px solid var(--bdr2)',background:'var(--bg2)',display:'block'}}),
          el('button',{onClick:()=>onChange(''),title:'Remove image',style:{position:'absolute',top:-6,right:-6,background:'var(--err)',border:'none',borderRadius:'50%',width:18,height:18,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',color:'#fff',fontSize:10}},el('i',{className:'ti ti-x'}))
        )
      : el('button',{onClick:()=>fileRef.current.click(),style:{width:'100%',maxWidth:200,height:160,background:'var(--bg2)',border:'1.5px dashed var(--bdr2)',borderRadius:8,cursor:'pointer',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:6,color:'var(--text3)'}},
          el('i',{className:'ti ti-photo-plus',style:{fontSize:22}}),
          el('span',{style:{fontSize:10}}),'Upload'
        ),
    el('input',{ref:fileRef,type:'file',accept:'image/*',style:{display:'none'},onChange:upload})
  );
}

/* ── Specs ── */
function SpecsPanel({specs,onChange,prod,onProdChange,isDevTab,allProds}){
  const [coll,setColl]=useState({});
  const upd=(k,v)=>{
    const next={...specs,[k]:v};
    onChange(next);
    if(k==='_skuCode'&&onProdChange) onProdChange({...prod,skuCode:v,specs:next});
  };

  // Multi-line fields
  const MULTILINE=['Formulations','Ingredients','Additional Notes',
    'Product Primary/Hardware','Product Package/Outer','Packaging Labels',
    'Target Product Image','Target Accessory Image'];
  const IMAGE_KEYS=['Target Product Image','Target Accessory Image'];

  // Fields that get full-width treatment
  const FULL_WIDTH=['Brand Name Internal','Product Name Internal',
    'Formulations','Ingredients','Additional Notes',
    'Product Primary/Hardware','Product Package/Outer'];

  const isMulti=f=>MULTILINE.includes(f);
  const isImg=f=>IMAGE_KEYS.includes(f);
  const isFull=f=>FULL_WIDTH.includes(f);

  return el('div',{style:{padding:'0 0 20px'}},

    /* ── SKU / Status banner ── */
    el('div',{style:{
      display:'flex',alignItems:'center',gap:12,padding:'10px 20px',
      background:'var(--surface-warm)',borderBottom:'1px solid var(--border)'
    }},
      prod?.skuCode
        /* Has a code — show editable field */
        ? el('div',{style:{display:'flex',alignItems:'center',gap:8}},
            el('span',{style:{fontFamily:'var(--mono)',fontSize:10,color:'var(--muted)',
              textTransform:'uppercase',letterSpacing:'.08em'}},'Mera SKU'),
            el(Editable,{
              value:specs._skuCode||prod?.skuCode||'',
              onChange:v=>upd('_skuCode',v.toUpperCase()),
              placeholder:'e.g. VA083',
              style:{fontFamily:'var(--mono)',fontSize:16,fontWeight:700,
                color:'var(--accent)',letterSpacing:'.08em'}
            })
          )
        /* No code yet */
        : isDevTab
          /* In Development — R&D label */
          ? el('div',{style:{display:'flex',alignItems:'center',gap:7}},
              el('i',{className:'ti ti-flask',style:{color:'var(--x-violet)',fontSize:13}}),
              el('span',{style:{fontFamily:'var(--mono)',fontSize:10,fontWeight:700,
                color:'var(--x-violet)',textTransform:'uppercase',letterSpacing:'.07em'}},
                'R&D — SKU assigned on move to Product Call'
              )
            )
          /* In a PC tab — prompt to assign code */
          : el('div',{style:{display:'flex',alignItems:'center',gap:10}},
              el('span',{style:{fontFamily:'var(--mono)',fontSize:10,color:'var(--muted)',
                textTransform:'uppercase',letterSpacing:'.08em'}},'Mera SKU'),
              el('div',{style:{display:'flex',alignItems:'center',gap:6}},
                el(Editable,{
                  value:specs._skuCode||'',
                  onChange:v=>upd('_skuCode',v.toUpperCase()),
                  placeholder:'Type or auto-generate…',
                  style:{fontFamily:'var(--mono)',fontSize:13,fontWeight:600,
                    color:'var(--accent)',letterSpacing:'.06em',minWidth:120}
                }),
                el('button',{
                  onClick:()=>{
                    const cat=specs['Category']||specs._category||'';
                    // Gather all products for counter scan via onProdChange closure
                    const code=nextSkuCode(cat,allProds||{});
                    if(code){upd('_skuCode',code);if(onProdChange)onProdChange({...prod,skuCode:code,specs:{...specs,_skuCode:code}});}
                    else alert('Set the Category field first so a prefix can be determined (Vape→VA, Pre-Roll→PR, Concentrate→CN).');
                  },
                  style:{
                    fontFamily:'var(--mono)',fontSize:10,fontWeight:700,
                    background:'var(--accent)',color:'#fff',border:'none',
                    borderRadius:6,padding:'4px 10px',cursor:'pointer',whiteSpace:'nowrap',
                    letterSpacing:'.04em'
                  }
                },'⚡ Auto-assign')
              )
            ),
      /* Status tag pills on right */
      el('div',{style:{marginLeft:'auto',display:'flex',gap:6,flexWrap:'wrap'}},
        (prod?.tags||[]).map(t=>{
          const s={
            'Accepted':'#16a34a','Launched':'#16a34a','On Track':'#16a34a',
            'Rejected':'#dc2626','At Risk':'#dc2626','Delayed':'#dc2626',
            'In Progress':'#d97706','Pending':'#d97706','High Priority':'#d97706'
          };
          const c=s[t]||'#6b7280';
          return el('span',{key:t,style:{
            fontFamily:'var(--mono)',fontSize:10,fontWeight:700,
            background:c+'18',color:c,
            borderRadius:5,padding:'3px 10px',border:'1px solid '+c+'33'
          }},t);
        })
      )
    ),

    /* ── Sections ── */
    SPEC_SECTIONS.map(sec=>{
      const isOpen=!coll[sec.key];
      return el('div',{key:sec.key},

        /* Section header — Excel-style row divider */
        el('div',{
          onClick:()=>setColl(c=>({...c,[sec.key]:!c[sec.key]})),

            display:'flex',alignItems:'center',gap:8,

            background:'var(--surface-warm)',

          el('i',{className:'ti '+(isOpen?'ti-chevron-down':'ti-chevron-right'),
            style:{fontSize:11,color:'var(--muted)'}})
