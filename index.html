/* ── App ── */
const APP_PASSWORD='Mera2026!';
const AUTH_KEY='au_auth_v1';
const isAuthed=()=>{try{return localStorage.getItem(AUTH_KEY)==='1';}catch{return false;}};
const setAuthed=()=>{try{localStorage.setItem(AUTH_KEY,'1');}catch{}};

function LoginScreen({onAuth}){
  // Two stages: 1) password  2) load from GitHub (or skip to local)
  const [stage,  setStage]  = React.useState('password'); // 'password' | 'load'
  const [pw,     setPw]     = React.useState('');
  const [err,    setErr]    = React.useState(false);
  const [loading,setLoading]= React.useState(false);
  const [ghStatus,setGhStatus]=React.useState(null);
  const pwRef = React.useRef();
  React.useEffect(()=>{ if(stage==='password'&&pwRef.current) pwRef.current.focus(); },[stage]);

  const checkPw=()=>{
    if(pw===APP_PASSWORD){
      setErr(false);
      setStage('load');
    } else {
      setErr(true);
      setPw('');
      if(pwRef.current) pwRef.current.focus();
    }
  };

  const loadFromGitHub=async()=>{
    setLoading(true); setGhStatus(null);
    try{
      const r=await fetch(
        'https://raw.githubusercontent.com/'+GH_OWNER+'/'+GH_REPO+'/'+GH_BRANCH+'/'+GH_FILE+'?t='+Date.now()
      );
      if(!r.ok) throw new Error('HTTP '+r.status);
      const result=await r.json();
      if(result){
        setGhStatus({ok:true,msg:'Loaded from GitHub!'});
        setAuthed();
        setTimeout(()=>onAuth(result),500);
      } else {
        setGhStatus({ok:false,msg:'No data file found — loading with local data.'});
        setAuthed();
        setTimeout(()=>onAuth(),500);
      }
    }catch(e){
      setGhStatus({ok:false,msg:'Load error: '+e.message+' — using local data.'});
      setAuthed();
      setTimeout(()=>onAuth(),500);
    }
    setLoading(false);
  };

  const enterLocal=()=>{ setAuthed(); onAuth(); };

  return el('div',{style:{
    minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',
    background:'var(--bg2)',padding:20
  }},
    el('div',{style:{
      background:'var(--bg)',border:'0.5px solid var(--bdr2)',borderRadius:16,
      padding:'40px 36px',maxWidth:400,width:'100%',textAlign:'center',
      boxShadow:'0 8px 40px rgba(0,0,0,0.35)'
    }},
      el('div',{style:{fontSize:11,fontWeight:700,textTransform:'uppercase',letterSpacing:'.1em',color:'var(--text3)',marginBottom:10}},'Adult Rec'),
      el('h1',{style:{fontSize:22,fontWeight:800,letterSpacing:'-.3px',marginBottom:6}},'Product Launch Dashboard'),
      el('div',{style:{fontSize:11,color:'var(--text3)',marginBottom:32}},'Ontario · 2026 · v1.14'),

      /* ── Stage 1: Password ── */
      stage==='password'&&el('div',null,
        el('input',{
          ref:pwRef,type:'password',className:'ei',
          placeholder:'Enter password',value:pw,
          onChange:e=>{setPw(e.target.value);setErr(false);},
          onKeyDown:e=>e.key==='Enter'&&checkPw(),
          style:{fontSize:14,textAlign:'center',letterSpacing:'.1em',marginBottom:err?8:14}
        }),
        err&&el('div',{style:{fontSize:11,color:'var(--err)',marginBottom:10,display:'flex',alignItems:'center',justifyContent:'center',gap:4}},
          el('i',{className:'ti ti-x'}), ' Incorrect password'
        ),
        el('button',{onClick:checkPw,style:{
          width:'100%',background:'var(--info-bg)',border:'0.5px solid var(--info)',
          borderRadius:8,padding:'12px',fontSize:13,fontFamily:'inherit',
          color:'var(--info)',fontWeight:700,cursor:'pointer'
        }},'Continue →')
      ),

      /* ── Stage 2: Load ── */
      stage==='load'&&el('div',null,
        el('div',{style:{
          background:'var(--ok-bg)',border:'0.5px solid var(--ok)',borderRadius:8,
          padding:'10px 14px',marginBottom:20,fontSize:12,color:'var(--ok)',
          display:'flex',alignItems:'center',gap:7
        }},el('i',{className:'ti ti-check'}),' Password accepted'),
        el('button',{onClick:loadFromGitHub,disabled:loading,style:{
          width:'100%',background:'#111111',border:'none',borderRadius:8,
          padding:'12px',fontSize:13,fontFamily:'inherit',color:'#fff',fontWeight:700,
          cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',
          gap:8,marginBottom:12,opacity:loading?0.6:1
        }},
          loading
            ? el('span',null,el('i',{className:'ti ti-loader-2',style:{animation:'spin 1s linear infinite',marginRight:6}}),'Loading…')
            : el('span',null,el('i',{className:'ti ti-cloud-download'}),' Load from GitHub')
        ),
        ghStatus&&el('div',{style:{
          padding:'8px 12px',borderRadius:7,fontSize:12,marginBottom:12,
          background:ghStatus.ok?'var(--ok-bg)':'var(--warn-bg)',
          color:ghStatus.ok?'var(--ok)':'var(--warn)',
          display:'flex',alignItems:'center',gap:7,textAlign:'left'
        }},el('i',{className:'ti '+(ghStatus.ok?'ti-check':'ti-alert-circle')}),ghStatus.msg),
        !loading&&!ghStatus?.ok&&el('button',{onClick:enterLocal,style:{
          width:'100%',background:'transparent',border:'0.5px solid var(--bdr2)',
          borderRadius:8,padding:'10px',fontSize:12,fontFamily:'inherit',
          color:'var(--text2)',cursor:'pointer'
        }},'Skip — use local data')
      )
    )
  );
}

function App(){
  const [authed,setAuthed_]=useState(isAuthed);
  const init=(()=>{
    const s=loadState()||INITIAL;
    // Apply default owners migration (fills empty owners only)
    if(!localStorage.getItem(MIGRATION_KEY)){
      applyDefaultOwners(s);
      saveState(s);
      localStorage.setItem(MIGRATION_KEY,'1');
    }
    return s;
  })();
  const [data,setData]=useState(()=>({...INITIAL,...init,pcTabs:init.pcTabs||INITIAL.pcTabs}));
  const [view,setView]=useState(()=>data.pcTabs[0]?.id||'pc1');
  const [sels,setSels]=useState({pc1:'bb',pc2:'bcp',pc3:'pp'});
  const [prodView,setProdView]=useState('summary'); // 'summary' | 'detail'
  const [fullscreen,setFullscreen]=useState(false);
  const [saved,setSaved]=useState(false);
  const [lastSaved,setLastSaved]=useState(null);
  const [isDirty,setIsDirty]=useState(false);
  const [showGH,setShowGH]=useState(false);
  const [renamingTab,setRenamingTab]=useState(null);
  const [storeCountVer,setStoreCountVer]=useState(0); // bumped when store count changes to force re-render
  const importRef=useRef();

  // skipDirty=true when data was set programmatically (GitHub pull) — don't mark as edited
  const skipDirtyRef = React.useRef(true); // start true so initial load doesn't mark dirty

  useEffect(()=>{
    saveState(data);
    if(skipDirtyRef.current){
      skipDirtyRef.current=false; // reset — next change will be user-driven
      return;
    }
    dirtyRef.current=true; // user made a real edit
    setIsDirty(true);
    setSaved(true);setLastSaved(Date.now());
    const t=setTimeout(()=>setSaved(false),1800);
    return()=>clearTimeout(t);
  },[data]);

  // Auto-refresh from GitHub — PAUSES the moment user makes any edit
  const dirtyRef = React.useRef(false); // true = user has unsaved edits
  const refreshToken = GH_TOKEN_DEFAULT || getGHConf().token || '';

  // ── Silent pull on every page load (if not dirty) ──
  useEffect(()=>{
    if(!refreshToken||dirtyRef.current)return;
    ghRead(refreshToken).then(result=>{
      if(result&&!dirtyRef.current){
        skipDirtyRef.current=true;
        setData(result.data);
      }
    }).catch(()=>{});
  },[]);

  // ── Periodic auto-refresh every 30s (only when auto-refresh is on) ──
  useEffect(()=>{
    const conf=getGHConf();
    const token=refreshToken;
    if(!token)return;
    const interval=setInterval(async()=>{
      if(dirtyRef.current){
        console.log('[Auto-refresh] Skipped — unsaved edits pending');
        return;
      }
      try{
        const result=await ghRead(token);
        if(result){skipDirtyRef.current=true;setData(result.data);}
      }catch(e){ /* silent fail */ }
    },30000);
    return()=>clearInterval(interval);
  },[]);

  useEffect(()=>{
    const h=e=>{
      if(e.key==='Escape'&&fullscreen)setFullscreen(false);
      if(e.key==='F'&&!e.target.matches('input,textarea,select'))setFullscreen(f=>!f);
    };
    window.addEventListener('keydown',h);return()=>window.removeEventListener('keydown',h);
  },[fullscreen]);

    // prods/prod computed in return

  const updProd=(pcKey,id,upd)=>setData(d=>({...d,[pcKey]:(d[pcKey]||[]).map(p=>p.id===id?{...p,...upd}:p)}));
  const addProd=()=>{
    const p={...BLANK_PROD(data.pcTabs.find(t=>t.id===view)?.label||'')};
    setData(d=>({...d,[view]:[...(d[view]||[]),p]}));
    setSels(s=>({...s,[view]:p.id}));
    setProdView('detail');
  };
  const removeProd=id=>setData(d=>({...d,[view]:(d[view]||[]).filter(p=>p.id!==id)}));

  const kbNav=dir=>{const idx=prods.findIndex(p=>p.id===selId);const next=prods[idx+dir];if(next)setSelId(next.id);};

  const addProductCall=()=>{
    const nums=data.pcTabs.map(t=>{const m=t.id.match(/pc(\d+)/);return m?parseInt(m[1]):0;});
    const next=Math.max(0,...nums)+1,newId='pc'+next,newLabel='PC#'+next+' 2026';
    setData(d=>({...d,pcTabs:[...d.pcTabs,{id:newId,label:newLabel}],[newId]:[]}));
    setView(newId);setProdView('summary');
  };
  const removeTab=id=>{
    if(data.pcTabs.length<=1){alert('Cannot remove the last product call.');return;}
    if(!confirm('Remove this product call and all its products?'))return;
    const newTabs=data.pcTabs.filter(t=>t.id!==id);
    setData(d=>{const nd={...d,pcTabs:newTabs};delete nd[id];return nd;});
    if(view===id){setView(newTabs[0].id);setProdView('summary');}
  };
  const renameTab=(id,label)=>{setData(d=>({...d,pcTabs:d.pcTabs.map(t=>t.id===id?{...t,label}:t)}));setRenamingTab(null);};

  const importJSON=e=>{
    const file=e.target.files[0];if(!file)return;
    const r=new FileReader();
    r.onload=ev=>{try{const d=JSON.parse(ev.target.result);setData(d);setView(d.pcTabs?.[0]?.id||'pc1');alert('Backup imported successfully!');e.target.value='';}catch{alert('Invalid JSON file.');}};
    r.readAsText(file);
  };

  // Fullscreen uses the same main content but maximized
  if(fullscreen) return el('div',{style:{position:'fixed',inset:0,background:'var(--bg2)',zIndex:1000,overflow:'auto',padding:'20px'}},
    el('div',{style:{maxWidth:1400,margin:'0 auto'}},
      el('div',{style:{display:'flex',justifyContent:'flex-end',marginBottom:12}},
        el('button',{className:'btn',onClick:()=>setFullscreen(false)},el('i',{className:'ti ti-minimize'}),' Exit (Esc)')
      ),
      el('div',{className:'shell fullscreen-shell'},
        el(ProductPanels,{prods:data[view]||[],selId:sels[view]||(data[view]||[])[0]?.id,setSelId:id=>setSels(s=>({...s,[view]:id})),onAdd:addProd,onRemove:removeProd}),

        })()
      )
    )
  );


  if(!authed) return el(LoginScreen,{onAuth:(ghData)=>{
    if(ghData)setData(ghData);
    setAuthed_(true);
  }});
  // ── Macro Timeline View ──
  const MacroTimeline=React.useMemo(()=>{
    const allProds=data.pcTabs.flatMap(tab=>(data[tab.id]||[]).map(p=>({...p,pc:tab.label})));
    if(!allProds.length)return el('div',{style:{padding:40,color:'var(--text3)',textAlign:'center'}},'No products yet.');
    const allDates=allProds.flatMap(p=>p.tasks.flatMap(t=>[t.start,t.end].filter(Boolean)));
    if(!allDates.length)return el('div',{style:{padding:40,color:'var(--text3)',textAlign:'center'}},'No task dates set yet.');
    const minD=new Date(allDates.sort()[0]); const maxD=new Date(allDates.sort().reverse()[0]);
    const totalDays=Math.max(1,Math.ceil((maxD-minD)/86400000));
    const pct=d=>Math.max(0,Math.min(100,Math.ceil((new Date(d)-minD)/86400000/totalDays*100)));
    const CAT_COL={rd:'var(--rd-col)',procurement:'var(--pr-col)',operations:'var(--op-col)',marketing:'var(--mk-col)'};
    const today=new Date(); const todayPct=pct(today.toISOString().slice(0,10));
    return el('div',{style:{padding:'24px',overflowX:'auto'}},
      el('div',{style:{fontSize:13,fontWeight:700,color:'var(--text)',marginBottom:16,display:'flex',alignItems:'center',gap:8}},
        el('i',{className:'ti ti-layout-kanban',style:{color:'var(--accent)'}}), 'Macro Timeline — All Products'
      ),
      el('div',{style:{position:'relative',minWidth:700}},
        el('div',{style:{position:'absolute',left:todayPct+'%',top:0,bottom:0,borderLeft:'1.5px solid var(--err)',zIndex:2,pointerEvents:'none'}},
          el('span',{style:{position:'absolute',top:0,left:4,fontSize:9,color:'var(--err)',fontWeight:700,whiteSpace:'nowrap'}},'Today')
        ),
        allProds.map((p,pi)=>{
          const doneCnt=p.tasks.filter(t=>t.status==='Done').length;
          const tot=p.tasks.length;
          const overdue=p.tasks.filter(t=>isOverdue(t)).length;
          return el('div',{key:p.id,style:{marginBottom:6}},
            el('div',{style:{display:'flex',alignItems:'center',gap:0}},
              el('div',{style:{width:180,flexShrink:0,padding:'6px 12px 6px 0',display:'flex',flexDirection:'column',gap:2}},
                el('div',{style:{fontSize:10,color:'var(--text3)',fontWeight:600}},p.pc),
                el('div',{style:{fontSize:12,fontWeight:700,color:'var(--text)',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}},p.shortName||p.name),

                    top:3,bottom:3,background:CAT_COL[t.cat]||'var(--bdr2)',
                    opacity:t.status==='Done'?0.35:isOverdue(t)?1:0.7,
                    borderRadius:3,minWidth:3
                  }})
                )
              )
            )
          );
        })
      ),
      el('div',{style:{display:'flex',gap:16,marginTop:14,flexWrap:'wrap'}},
        [['rd','R&D'],['procurement','Procurement'],['operations','Operations'],['marketing','Marketing']].map(([cat,lbl])=>
          el('div',{key:cat,style:{display:'flex',alignItems:'center',gap:5,fontSize:10}},
            el('div',{style:{width:10,height:10,borderRadius:2,background:CAT_COL[cat]}}),
            el('span',{style:{color:'var(--text3)'}},lbl)
          )
        )
      )
    );
  },[data,view]);

  // ── Workload View ──
  const WorkloadView=React.useMemo(()=>{
    const allProds=data.pcTabs.flatMap(tab=>(data[tab.id]||[]));
    const ownerMap={};
    allProds.forEach(p=>p.tasks.forEach(t=>{
      const o=t.owner||'Unassigned';
      if(!ownerMap[o])ownerMap[o]={total:0,done:0,overdue:0,inProgress:0,notStarted:0};
      ownerMap[o].total++;
      if(t.status==='Done')ownerMap[o].done++;
      else if(isOverdue(t))ownerMap[o].overdue++;
      else if(t.status==='In Progress')ownerMap[o].inProgress++;
      else ownerMap[o].notStarted++;
    }));
    const owners=Object.entries(ownerMap).sort(([,a],[,b])=>b.overdue-a.overdue||(b.total-b.done)-(a.total-a.done));

      el('div',{style:{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(220px,1fr))',gap:12}},

      ),
      el('nav',{className:'sidebar-nav'},
        /* Product Calls */
        el('div',{className:'sidebar-section-label'},'Product Calls'),

          el('i',{className:'ti ti-plus',style:{fontSize:12}}), 'New PC'
        ),

        /* Post Launch */
        el('div',{className:'sidebar-section-label',style:{marginTop:8}},'Analytics'),
        el('button',{className:'sidebar-item '+(view==='postlaunch'?'active':''),onClick:()=>setView('postlaunch')},
          el('i',{className:'ti ti-chart-line'}), 'Post Launch'
        ),
        el('button',{className:'sidebar-item '+(view==='macro'?'active':''),onClick:()=>setView('macro')},
          el('i',{className:'ti ti-layout-kanban'}), 'Macro Timeline'
        ),
        el('button',{className:'sidebar-item '+(view==='workload'?'active':''),onClick:()=>setView('workload')},
          el('i',{className:'ti ti-users'}), 'Team Workload'
        )
      ),

      /* Sidebar footer */
      el('div',{className:'sidebar-footer'},
        el('div',{style:{display:'flex',alignItems:'center',gap:8,padding:'4px 10px',marginBottom:4}},
          el('i',{className:'ti ti-building-store',style:{fontSize:12,color:'var(--text3)'}}),
          el('span',{style:{fontSize:11,color:'var(--text3)'}},'Stores:'),
          el('input',{type:'number',key:'sc-'+storeCountVer,defaultValue:ONTARIO_STORES,min:1,max:99999,
            style:{width:50,background:'transparent',border:'none',outline:'none',fontSize:12,fontWeight:700,color:'var(--accent)',fontFamily:'inherit',textAlign:'center',MozAppearance:'textfield'},
            onChange:ev=>{const v=parseInt(ev.target.value);if(v>0){ONTARIO_STORES=v;saveStoreCount(v);setStoreCountVer(n=>n+1);}}
          })
        ),
        el('button',{className:'sidebar-footer-btn',onClick:()=>{const b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='au_backup_'+new Date().toISOString().slice(0,10)+'.json';a.click();}},
          el('i',{className:'ti ti-download'}), 'Backup'
        ),
        el('button',{className:'sidebar-footer-btn',onClick:()=>importRef.current.click()},
          el('i',{className:'ti ti-upload'}), 'Import'
        ),
        el('button',{className:'sidebar-footer-btn '+(isDirty?'warn':''),
          onClick:()=>setShowGH(true),
          style:{color:isDirty?'var(--accent)':'rgba(255,255,255,.4)',background:isDirty?'rgba(232,98,42,0.15)':""}},
          el('i',{className:'ti ti-brand-github'}),
          isDirty?'GitHub · Push':'GitHub'
        )
      )
    ),

    /* ── Main content ── */
    el('div',{style:{marginLeft:'var(--sidebar-w)',flex:1,minWidth:0,display:'flex',flexDirection:'column',minHeight:'100vh'}},
      /* Top bar */
      el('div',{className:'topbar2'},
        el('span',{className:'topbar2-title'},
          view==='postlaunch'?'Post Launch Analytics':
          view==='macro'?'Macro Timeline':
          view==='workload'?'Team Workload':
          (data.pcTabs.find(t=>t.id===view)?.label||'Dashboard')
        ),
        el('div',{className:'topbar2-sep'}),
        el('span',{className:'topbar2-meta'},'Last saved: ',fmtTs(lastSaved)),
        saved&&el('span',{style:{fontSize:11,color:'var(--ok)',display:'flex',alignItems:'center',gap:4}},el('i',{className:'ti ti-check'}),' Saved'),
        el('div',{className:'topbar2-actions'},
          el('span',{style:{fontSize:10,background:'var(--accent-bg)',color:'var(--accent)',border:'1px solid var(--accent-border)',borderRadius:'var(--rs)',padding:'2px 8px',fontWeight:700}},'v1.14'),
          el('button',{className:'btn',onClick:()=>window.print(),style:{fontSize:11}},el('i',{className:'ti ti-printer'}),' Print'),
          el('button',{className:'btn',onClick:()=>setFullscreen(true),style:{fontSize:11}},el('i',{className:'ti ti-maximize'}))
        )
      ),

      /* Modals */
      showGH&&el(GitHubSyncPanel,{data,setData,onClose:()=>setShowGH(false),onPushed:()=>{dirtyRef.current=false;setIsDirty(false);}}),
      el('input',{ref:importRef,type:'file',accept:'.json',style:{display:'none'},onChange:e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{try{const d=JSON.parse(ev.target.result);skipDirtyRef.current=true;setData(d);}catch{alert('Invalid backup file.');}};r.readAsText(f);}}),

      /* Content */
      el('div',{style:{flex:1}},
        view==='postlaunch' ? el(PostLaunchView,{data}) :
        view==='macro'      ? MacroTimeline :
        view==='workload'   ? WorkloadView :
        el('div',null,
          el(ProductPanels,{prods,selId:prod?.id||'',setSelId,onAdd:addProd,onRemove:removeProd}),
          prodView==='summary'
            ? el(SummaryView,{prods,onSelect:id=>{setSelId(id);setProdView('detail');}})
            : prod
              ? el(ProductDetail,{key:prod.id,prod,onChange:upd=>updProd(view,prod.id,upd),onKbNav:kbNav})
              : el('div',{style:{padding:'60px',textAlign:'center',color:'var(--text3)'}},
                  el('i',{className:'ti ti-package',style:{fontSize:40,display:'block',marginBottom:14,opacity:.3}}),
                  'No products yet.',el('br'),
                  el('button',{className:'btn btn-primary',style:{marginTop:16},onClick:addProd},el('i',{className:'ti ti-plus'}),' Add First Product')
                )
        )
      )
    )
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(el(App));

</script>
</body>
</html>
