/* ââ TagEditor ââ */
function TagEditor({tags,onChange}){
  const [open,setOpen]=useState(false);const ref=useRef();
  useEffect(()=>{if(!open)return;const h=e=>{if(ref.current&&!ref.current.contains(e.target))setOpen(false);};document.addEventListener('mousedown',h);return()=>document.removeEventListener('mousedown',h);},[open]);
  const avail=ALL_TAG_OPTIONS.filter(t=>!(tags||[]).includes(t));
  return el('div',{style:{display:'flex',alignItems:'center',gap:5,flexWrap:'wrap',position:'relative'},ref},
    (tags||[]).map(t=>{const s=sc(t);return el('span',{key:t,className:'badge',style:{background:s.bg,color:s.tx,gap:4,cursor:'default'}},t,
      el('button',{onClick:()=>onChange(tags.filter(x=>x!==t)),style:{background:'none',border:'none',cursor:'pointer',color:s.tx,padding:'0 2px',lineHeight:1,fontSize:11,display:'inline-flex',alignItems:'center'}},el('i',{className:'ti ti-x',style:{fontSize:9}}))
    );}),
    avail.length>0&&el('button',{onClick:()=>setOpen(o=>!o),style:{background:'var(--bg2)',border:'0.5px dashed var(--bdr2)',borderRadius:10,padding:'2px 8px',cursor:'pointer',fontSize:11,color:'var(--text2)',display:'inline-flex',alignItems:'center',gap:3}},el('i',{className:'ti ti-plus',style:{fontSize:10}}),' tag'),

/* ââ Editable ââ */
function Editable({value,onChange,multiline=false,style={},placeholder='',className=''}){
  const [editing,setEditing]=useState(false);const [val,setVal]=useState(value||'');const ref=useRef();
  useEffect(()=>{setVal(value||'');},[value]);
  useEffect(()=>{if(editing&&ref.current)ref.current.focus();},[editing]);
  const commit=()=>{setEditing(false);if(val!==(value||''))onChange(val);};
  if(editing)return multiline
    ?el('textarea',{ref,className:'ei '+className,style:{...style,width:'100%'},value:val,onChange:ev=>setVal(ev.target.value),onBlur:commit,onKeyDown:ev=>ev.key==='Escape'&&(setVal(value||''),setEditing(false))})
    :el('input',{ref,type:'text',className:'ei '+className,style,value:val,onChange:ev=>setVal(ev.target.value),onBlur:commit,onKeyDown:ev=>{if(ev.key==='Enter')commit();if(ev.key==='Escape'){setVal(value||'');setEditing(false);}}});
  return el('span',{className:'editable '+className,style,onClick:()=>setEditing(true),title:'Click to edit'},val||el('span',{style:{color:'var(--text3)',fontStyle:'italic'}},placeholder));
}
function ESelect({value,options,onChange,style={}}){
  return el('select',{className:'ei',style,value:value||options[0],onChange:ev=>onChange(ev.target.value)},options.map(o=>el('option',{key:o,value:o},o)));
}

function Ring({rd,pr,op,size=48}){
  const r=size/2-4,circ=2*Math.PI*r,total=rd+pr+op||1;
  const segs=[{v:rd,c:CAT.rd.col},{v:pr,c:CAT.procurement.col},{v:op,c:CAT.operations.col}];
  let off=0;
  return el('svg',{width:size,height:size,viewBox:`0 0 ${size} ${size}`,style:{transform:'rotate(-90deg)',flexShrink:0}},
    el('circle',{cx:size/2,cy:size/2,r,fill:'none',stroke:'var(--bg3)',strokeWidth:4}),
    segs.map((s,i)=>{const dash=circ*s.v/total,gap=circ-dash,o=off;off+=dash;return s.v>0&&el('circle',{key:i,cx:size/2,cy:size/2,r,fill:'none',stroke:s.c,strokeWidth:4,strokeDasharray:`${dash} ${gap}`,strokeDashoffset:-o,strokeLinecap:'butt'});})
  );
}

/* ââ Gantt ââ */
function GanttChart({tasks,launchDate}){
  const [zoom,setZoom]=useState(1);
  const LW=134,dated=tasks.filter(t=>t.start&&t.end);
  if(!dated.length)return el('div',{style:{padding:'28px 20px',color:'var(--text2)',fontSize:13,textAlign:'center'}},el('i',{className:'ti ti-calendar-off',style:{fontSize:28,display:'block',marginBottom:8,opacity:.4}}),'Add start and end dates to tasks to see the Gantt chart.');
  const ds=dated.flatMap(t=>[parseD(t.start),parseD(t.end)]);
  if(launchDate&&parseD(launchDate))ds.push(parseD(launchDate));
  let mn=new Date(Math.min(...ds));mn.setDate(1);
  let mx=new Date(Math.max(...ds));mx.setMonth(mx.getMonth()+1);mx.setDate(0);
  const tot=mx-mn;
  const pL=d=>Math.max(0,Math.min(100,(parseD(d)-mn)/tot*100));
  const pW=(s,e)=>Math.max(0.2,(parseD(e)-parseD(s))/tot*100);
  const tdP=(TODAY_D-mn)/tot*100,showTd=tdP>=0&&tdP<=100;
  const lP=launchDate&&parseD(launchDate)?pL(launchDate):null;
  const months=[];const dd=new Date(mn);
  while(dd<=mx){months.push({l:dd.toLocaleString('en-CA',{month:'short'}),y:String(dd.getFullYear()).slice(2),p:(dd-mn)/tot*100});dd.setMonth(dd.getMonth()+1);}
  const BW=Math.round(680*zoom);
  const groups=CAT_ORDER.map(cid=>({...CAT[cid],items:dated.filter(t=>t.cat===cid)})).filter(g=>g.items.length);
  return el('div',{className:'gantt-wrap'},
    el('div',{className:'gantt-toolbar'},
      el('button',{className:'gantt-btn',onClick:()=>setZoom(z=>Math.min(z+0.3,3))},el('i',{className:'ti ti-zoom-in'}),' In'),
      el('button',{className:'gantt-btn',onClick:()=>setZoom(z=>Math.max(z-0.3,0.5))},el('i',{className:'ti ti-zoom-out'}),' Out'),
      el('button',{className:'gantt-btn',onClick:()=>setZoom(1)},el('i',{className:'ti ti-refresh'}),' Reset'),
      el('span',{style:{fontSize:11,color:'var(--text3)',marginLeft:6}},
        showTd?el('span',null,el('span',{style:{color:'var(--err)',fontWeight:700}},'â'),' Today  '):'',
        lP!==null?el('span',null,el('span',{style:{color:'var(--ok)',fontWeight:700}},'â'),' Launch'):'')
    ),
    el('div',{style:{overflowX:'auto'}},
      el('div',{style:{minWidth:LW+BW}},
        el('div',{style:{display:'flex',marginBottom:4}},
          el('div',{style:{width:LW,flexShrink:0}}),
          el('div',{style:{width:BW,flex:'none',position:'relative',height:22}},
            months.map((m,i)=>el('span',{key:i,style:{position:'absolute',left:(m.p/100*BW)+'px',transform:'translateX(-50%)',fontSize:10,color:'var(--text3)',userSelect:'none',whiteSpace:'nowrap'}},m.l+' \''+m.y))
          )
        ),
        groups.map(g=>el('div',{key:g.id},
          el('div',{className:'gantt-cat-hd',style:{background:g.light,color:g.text}},el('i',{className:'ti ti-circle-filled',style:{fontSize:8}}),g.label),
          g.items.map(t=>{
            const l=pL(t.start),w=pW(t.start,t.end),col=barC(t.cat,t.status),od=isOverdue(t);
            return el('div',{key:t.id,style:{display:'flex',alignItems:'center',marginBottom:5}},
              el('div',{style:{width:LW,flexShrink:0,fontSize:11,paddingRight:8,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',color:od?'var(--err)':'var(--text2)',fontWeight:od?600:'normal'}},
                (t.atRisk||od)&&el('i',{className:'ti ti-alert-triangle',style:{fontSize:10,color:'var(--err)',marginRight:2}}),t.name
              ),
              el('div',{style:{width:BW,flex:'none',position:'relative',height:26}},
                showTd&&el('div',{style:{position:'absolute',left:(tdP/100*BW)+'px',top:-2,bottom:-2,width:2,background:'var(--err)',zIndex:3,opacity:.85}}),
                lP!==null&&el('div',{style:{position:'absolute',left:(lP/100*BW)+'px',top:-2,bottom:-2,width:2,background:'var(--ok)',zIndex:3}}),
                el('div',{className:'gantt-bar',title:t.name+' | '+t.status+'\n'+fmtD(t.start)+' â '+fmtD(t.end)+(od?'\nâ  OVERDUE':'')+(t.notes?'\n'+t.notes:''),style:{left:(l/100*BW)+'px',width:Math.max(4,w/100*BW)+'px',background:od?'var(--err)':col,outline:od?'2px solid var(--err)':'none'}},
                  w*BW/100>55&&el('span',{style:{fontSize:10,fontWeight:600,color:od?'#fff':barT(t.cat,t.status),whiteSpace:'nowrap',overflow:'hidden'}},t.name)

/* ââ Specs ââ */
function SpecsPanel({specs,onChange}){
  const [coll,setColl]=useState({});
  const upd=(k,v)=>onChange({...specs,[k]:v});
  return el('div',{className:'specs-wrap'},
    SPEC_SECTIONS.map(sec=>el('div',{key:sec.key,className:'spec-section'},
      el('div',{className:'spec-sec-hd',onClick:()=>setColl(c=>({...c,[sec.key]:!c[sec.key]}))},
        el('i',{className:'ti '+sec.icon,style:{fontSize:14}}),sec.label,
        el('i',{className:'ti '+(coll[sec.key]?'ti-chevron-right':'ti-chevron-down'),style:{fontSize:12,marginLeft:'auto'}})
      ),
      !coll[sec.key]&&(sec.key==='notes'
        ? el('div',null,sec.fields.map(f=>el('div',{key:f,className:'spec-field full'},
            el('span',{className:'spec-key'},f),
            el(Editable,{value:specs[f]||'',onChange:v=>upd(f,v),multiline:true,style:{width:'100%'},placeholder:'Add notesâ¦'})
          )))
        : el('div',null,
            el('div',{className:'spec-img-row'},
              IMAGE_FIELDS.filter(f=>sec.fields.includes(f)).map(f=>
                el('div',{key:f,style:{flex:1}},
                  el('div',{style:{fontSize:11,color:'var(--text2)',marginBottom:6,fontWeight:500}},f),
                  el(ImageField,{value:specs[f]||'',onChange:v=>upd(f,v),label:f})
                )
              )
            ),
            el('div',{className:'spec-grid'},
              sec.fields.filter(f=>!IMAGE_FIELDS.includes(f)).map(f=>
                el('div',{key:f,className:'spec-field'},
                  el('span',{className:'spec-key'},f),
                  el(Editable,{value:specs[f]||'',onChange:v=>upd(f,v),placeholder:'â'})
                )
              )
            )
          )
      )
    ))
  );
}

/* ââ Product Detail ââ */
function ProductDetail({prod,onChange,onKbNav}){
  const [sec,setSec]=useState('tasks');
  useEffect(()=>{
    const h=e=>{
      if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.tagName==='SELECT')return;
      if(e.key==='t'||e.key==='T')setSec('tasks');
      else if(e.key==='g'||e.key==='G')setSec('gantt');
      else if(e.key==='s'||e.key==='S')setSec('specs');
      else if(e.key==='ArrowLeft')onKbNav(-1);
      else if(e.key==='ArrowRight')onKbNav(1);
    };
    window.addEventListener('keydown',h);return()=>window.removeEventListener('keydown',h);
  },[onKbNav]);
  const upT=ts=>onChange({...prod,tasks:ts});
  const addT=cat=>upT([...prod.tasks,{id:uid(),name:'New task',owner:'',status:'Not Started',start:'',end:'',notes:'',cat,atRisk:false}]);
  const delT=id=>upT(prod.tasks.filter(t=>t.id!==id));
  const overdue=prod.tasks.filter(t=>isOverdue(t)).length;
  return el('div',{className:'main'},
    el('div',{className:'prod-header'},
      overdue>0&&el('div',{style:{background:'var(--err-bg)',border:'0.5px solid var(--err)',borderRadius:6,padding:'6px 12px',marginBottom:12,fontSize:12,color:'var(--err)',display:'flex',alignItems:'center',gap:8}},
        el('i',{className:'ti ti-alert-triangle',style:{flexShrink:0}}),overdue+' overdue task'+(overdue>1?'s':'')+' â see Tasks tab'
      ),
      el('div',{style:{display:'flex',alignItems:'flex-start',gap:12,flexWrap:'wrap'}},
        el('div',{style:{flex:1,minWidth:0}},
          el('div',{style:{fontSize:11,color:BRAND_COL[prod.brand]||'var(--info)',fontWeight:700,textTransform:'uppercase',letterSpacing:'.08em',marginBottom:5}},
            el(Editable,{value:prod.brand,onChange:v=>onChange({...prod,brand:v}),style:{color:'inherit'}})
          ),
          el(Editable,{value:prod.name,onChange:v=>onChange({...prod,name:v,shortName:v.length>30?v.slice(0,30)+'â¦':v}),style:{fontSize:16,fontWeight:700,display:'block',marginBottom:8,lineHeight:1.3}}),
          el(TagEditor,{tags:prod.tags||[],onChange:tags=>onChange({...prod,tags})})
        ),
        el('div',{style:{display:'flex',flexDirection:'column',alignItems:'flex-end',gap:6,flexShrink:0}},
          el('label',{style:{fontSize:11,color:'var(--text2)',display:'flex',alignItems:'center',gap:6}},
            'Launch date:',
            el('input',{type:'date',style:{font:'inherit',fontSize:12,background:'var(--bg2)',border:'0.5px solid var(--bdr2)',borderRadius:5,padding:'3px 8px',color:'var(--text)'},value:prod.launchDate||'',onChange:ev=>onChange({...prod,launchDate:ev.target.value})})
          ),
          el('div',{style:{fontSize:11,color:'var(--text3)'}},el('i',{className:'ti ti-keyboard',style:{fontSize:11}}),' T/G/S tabs Â· ââ products')
        )
      )
    ),
    el(NotesRow,{notes:prod.notes||{updates:'',blockers:''},onChange:n=>onChange({...prod,notes:n}),launchDate:prod.launchDate,tasks:prod.tasks}),
    el('div',{className:'sectabs'},
      [['tasks','Tasks'],['gantt','Gantt'],['specs','Specs']].map(([id,lbl])=>el('button',{key:id,className:'stab '+(sec===id?'on':''),onClick:()=>setSec(id)},lbl))
    ),
    sec==='tasks'&&el(TasksPanel,{tasks:prod.tasks,onChange:upT,onAdd:addT,onDel:delT}),
    sec==='gantt'&&el(GanttChart,{tasks:prod.tasks,launchDate:prod.launchDate}),
    sec==='specs'&&el(SpecsPanel,{specs:prod.specs,onChange:sp=>onChange({...prod,specs:sp})})
  );
}

const MAP_BOUNDS={w:-84.5,e:-74.0,s:41.4,n:47.5};
const toSVG=(lat,lng,W=460,H=320)=>{
  const x=((lng-MAP_BOUNDS.w)/(MAP_BOUNDS.e-MAP_BOUNDS.w))*W;
  const y=((MAP_BOUNDS.n-lat)/(MAP_BOUNDS.n-MAP_BOUNDS.s))*H;
  return [Math.round(x*10)/10,Math.round(y*10)/10];
};

// Format ISO week â readable label
const fmtWeek=w=>{
  // ISO week to a readable date label (Monday of that week)
  const[y,wn]=w.split('-W');
  const jan4=new Date(parseInt(y),0,4); // Jan 4 is always in week 1
  const monday=new Date(jan4);
  monday.setDate(jan4.getDate()-(jan4.getDay()||7)+1+(parseInt(wn)-1)*7);
  return monday.toLocaleString('en-CA',{month:'short',day:'numeric'});
};

/* ââ Weekly Bar Chart (ROS-aware) ââ */
function WeeklyChart({weekly,monthly}){
  const [mode,setMode]=React.useState('weekly');
  const raw=mode==='weekly'?weekly:monthly;
  const entries=Object.entries(raw).sort(([a],[b])=>a.localeCompare(b));
  if(!entries.length)return null;

  // Official thresholds â based on current Ontario store count
  const sc=ONTARIO_STORES;
  const ALL_T=mode==='weekly'?[
    {label:'A',units:Math.round(8*sc),   col:'#f0c030'},
    {label:'B',units:Math.round(3*sc),   col:'#4dbb6a'},
    {label:'C',units:Math.round(0.8*sc), col:'#5b9bd5'},
    {label:'D',units:Math.round(0.2*sc), col:'#e09b3d'},
  ]:[];

  const maxV=Math.max(...entries.map(([,v])=>v),1);
  // Only draw lines that fall within 0â2Ã of actual data (no point showing A at 13k if max is 400)
  const thresholds=ALL_T.filter(t=>t.units<=maxV*2);
  // Scale chart high enough to show the lowest threshold above the data
  const topThresh=thresholds.length?Math.max(...thresholds.map(t=>t.units)):0;
  const chartMax=Math.max(maxV,topThresh)*1.14;

  const BAR_H=108;
  const fmtMo=k=>{const[y,m]=k.split('-');return['','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][parseInt(m)]+"'"+y.slice(2);};
  const lbl=k=>mode==='weekly'?fmtWeek(k):fmtMo(k);

  return el('div',null,
    el('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:12}},
      el('div',{style:{fontSize:12,fontWeight:700,display:'flex',alignItems:'center',gap:6}},
        el('i',{className:'ti ti-chart-bar',style:{color:'var(--info)'}}), 'Weekly Sales & ROS Class'
      ),
      el('div',{style:{display:'flex',gap:4}},
        ['weekly','monthly'].map(m=>el('button',{key:m,onClick:()=>setMode(m),style:{
          background:mode===m?'var(--info-bg)':'var(--bg2)',
          border:'0.5px solid '+(mode===m?'var(--info)':'var(--bdr)'),
          borderRadius:5,cursor:'pointer',padding:'3px 10px',fontSize:11,
          color:mode===m?'var(--info)':'var(--text2)',fontFamily:'inherit'
        }},m.charAt(0).toUpperCase()+m.slice(1)))
      )
    ),
    el('div',{style:{position:'relative',marginBottom:6}},
      /* bars */
      el('div',{style:{display:'flex',alignItems:'flex-end',gap:3,height:BAR_H}},
        entries.map(([k,v])=>{
          const ros=v/ONTARIO_STORES;
          const rc=getROS(ros);
          const h=Math.max(4,Math.round((v/chartMax)*BAR_H));
          return el('div',{key:k,style:{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:2}},
            el('div',{style:{fontSize:9,color:'var(--text2)',fontWeight:600,lineHeight:1}},v),
            el('div',{style:{fontSize:9,fontWeight:800,color:rc.tx,lineHeight:1}},rc.cls),
            el('div',{title:lbl(k)+' | '+v+' units | vel:'+ros.toFixed(4)+' | Class '+rc.cls,style:{
              width:'100%',height:h+'px',background:rc.col,
              borderRadius:'3px 3px 0 0',minHeight:4,opacity:0.88
            }})
          );
        })
      ),
      /* threshold lines â absolutely on top of bars */
      el('div',{style:{position:'absolute',inset:0,pointerEvents:'none',zIndex:10}},
        thresholds.map(t=>{
          const pxFromBottom=Math.round(t.units/chartMax*BAR_H);
          return el('div',{key:t.label,style:{
            position:'absolute',left:0,right:0,
            bottom:pxFromBottom+'px',
            borderTop:'1.5px dashed '+t.col,
          }},
            el('span',{style:{
              position:'absolute',right:2,top:-14,
              fontSize:9,fontWeight:700,color:t.col,
              background:'var(--bg)',padding:'1px 5px',
              borderRadius:3,border:'0.5px solid '+t.col,
              whiteSpace:'nowrap',
            }},t.label+' â '+t.units.toLocaleString()+' units')
          );
        })
      )
    ),
    /* week labels */
    el('div',{style:{display:'flex',gap:3}},
      entries.map(([k])=>el('div',{key:k,style:{flex:1,textAlign:'center',fontSize:9,color:'var(--text3)',whiteSpace:'nowrap',overflow:'hidden'}},lbl(k)))
    ),
    mode==='weekly'&&el('div',{style:{display:'flex',gap:8,marginTop:10,flexWrap:'wrap',alignItems:'center'}},
      ROS_CLASSES.map(r=>el('div',{key:r.cls,style:{display:'flex',alignItems:'center',gap:4,fontSize:10}},
        el('div',{style:{width:10,height:10,borderRadius:2,background:r.col}}),
        el('span',{style:{color:'var(--text2)'}},r.cls+' '+r.label)
      )),
      el('div',{style:{fontSize:9,color:'var(--text3)',marginLeft:'auto'}},'Ã· '+ONTARIO_STORES.toLocaleString()+' Ontario stores')
    )
  );
}

/* ââ Ontario Map (Leaflet) ââ */
function OntarioMap({cityData}){
  const containerRef = React.useRef(null);
  const mapRef       = React.useRef(null);
  const markersRef   = React.useRef([]);

  // Init Leaflet once when the div mounts
  React.useEffect(()=>{
    if(!containerRef.current || mapRef.current) return;
    const L = window.L;
    if(!L){ console.warn('Leaflet not loaded'); return; }

    const map = L.map(containerRef.current,{
      center:[48.5,-84.0], zoom:5,
      zoomControl:true, scrollWheelZoom:false, attributionControl:true,
    });

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
      attribution:'&copy; <a href="https://openstreetmap.org">OpenStreetMap</a>',
      maxZoom:18,
    }).addTo(map);

    mapRef.current = map;
    return ()=>{ map.remove(); mapRef.current=null; };
  },[]);

  // Sync markers whenever cityData changes (after map is ready)
  React.useEffect(()=>{
    const L = window.L;
    const map = mapRef.current;
    if(!L || !map) return;

    markersRef.current.forEach(m=>m.remove());
    markersRef.current = [];

    const entries = Object.entries(cityData)
      .filter(([c])=>CITY_COORDS[c])
      .sort(([,a],[,b])=>a-b);
    if(!entries.length) return;

    const maxU = Math.max(...entries.map(([,v])=>v), 1);
    entries.forEach(([city,units])=>{
      const [lat,lng] = CITY_COORDS[city];
      const r   = Math.max(5, Math.min(26, 5+(units/maxU)*21));
      const pct = units/maxU;
      const col = pct>0.6?'#f0c030':pct>0.3?'#5b9bd5':'#3a7abf';
      const m = L.circleMarker([lat,lng],{
        radius:r, fillColor:col,
        color:'rgba(255,255,255,0.5)', weight:1, fillOpacity:0.85,
      })
      .bindTooltip(
        '<b style="color:'+col+'">'+city+'</b><br>'+units.toLocaleString()+' units',
        {direction:'top', offset:[0,-2]}
      )
      .addTo(map);
      markersRef.current.push(m);
    });
  });   // no dep array â runs after every render, safe because we clear first

  return el('div',null,
    el('div',{
      ref:containerRef,
      style:{height:340,borderRadius:8,overflow:'hidden',border:'0.5px solid var(--bdr)'}
    }),
    el('div',{style:{fontSize:10,color:'var(--text3)',textAlign:'center',marginTop:4}},
      'Hover a city  Â·  Bubble size & colour = units sold'
    )
  );
}

/* ââ Daily Line Chart ââ */
function DailyLineChart({daily,brand,skuClass,launchDate}){
  if(!daily||!Object.keys(daily).length)return null;

  const CLS_COL={A:'#f0c030',B:'#4dbb6a',C:'#5b9bd5',D:'#e09b3d',E:'#e07878','New Product':'#a78bfa'};
  const lineCol=CLS_COL[skuClass]||'#5b9bd5';

  // Fill every calendar day between first and last order date with 0 if no orders
  const rawEntries=Object.entries(daily).sort(([a],[b])=>a.localeCompare(b));
  const firstDate=new Date(rawEntries[0][0]+'T00:00:00');
  const lastDate=new Date(rawEntries[rawEntries.length-1][0]+'T00:00:00');
  const dailyMap=Object.fromEntries(rawEntries);
  const allEntries=[];
  const cur=new Date(firstDate);
  while(cur<=lastDate){
    const ds=cur.toISOString().slice(0,10);
    allEntries.push([ds, dailyMap[ds]||0]);
    cur.setDate(cur.getDate()+1);
  }
  const entries=allEntries;
  const vals=entries.map(([,v])=>v);
  const maxV=Math.max(...vals,1);
  const W=880, H=120, PL=44, PR=12, PT=12, PB=28;
  const cW=W-PL-PR, cH=H-PT-PB;
  const n=entries.length;
  const xPos=i=>(i/(n-1||1))*cW;
  const yPos=v=>cH-(v/maxV)*cH;

  // Build SVG polyline points
  const points=entries.map(([,v],i)=>`${PL+xPos(i)},${PT+yPos(v)}`).join(' ');

  // Month labels â show first day of each month
  const monthLabels=[];
  let lastMonth='';
  entries.forEach(([date],i)=>{
    const mo=date.slice(0,7);
    if(mo!==lastMonth){
      lastMonth=mo;
      const[y,m]=mo.split('-');
      const lbl=['','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][parseInt(m)]+"'"+y.slice(2);
      monthLabels.push({lbl,x:PL+xPos(i)});
    }
  });

  // Y-axis labels
  const yTicks=[0,Math.round(maxV*0.5),maxV];

  // Tooltip state
  const [tip,setTip]=React.useState(null);

  // Milestone lines: 15, 30, 60, 90 days from launchDate
  const milestones=launchDate?[15,30,60,90].map(days=>{
    const d=new Date(launchDate+'T00:00:00');
    d.setDate(d.getDate()+days);
    const ds=d.toISOString().slice(0,10);
    // Find the closest entry index by date
    let mIdx=entries.findIndex(([date])=>date>=ds);
    if(mIdx<0){
      // Past the end of data â place at the end
      mIdx=entries.length-1;
    }
    // Snap to exact position if date matches, else interpolate
    const mx=PL+xPos(mIdx);
    return{days,x:mx,date:ds,past:ds>entries[entries.length-1][0]};
  }).filter(Boolean):[];

  // Weekly separator x positions â every Monday
  const weekSeps=[];
  entries.forEach(([date],i)=>{
    if(i===0)return;
    const d=new Date(date+'T00:00:00');
    if(d.getDay()===1) weekSeps.push(PL+xPos(i));
  });

  // Area fill points (close the polygon)
  const areaPoints=`${PL+xPos(0)},${PT+cH} ${points} ${PL+xPos(n-1)},${PT+cH}`;

  return el('div',{style:{background:'var(--bg)',border:'0.5px solid var(--bdr)',borderRadius:10,padding:'16px',marginTop:16}},
    el('div',{style:{fontSize:12,fontWeight:700,marginBottom:12,display:'flex',alignItems:'center',gap:6}},
      el('i',{className:'ti ti-chart-line',style:{color:lineCol}}),
      'Daily Orders â Full Life of SKU',
      el('span',{style:{fontSize:10,color:'var(--text3)',marginLeft:6,fontWeight:400}},
        entries[0]?.[0]+' â '+entries[entries.length-1]?.[0],
        '  Â·  '+n+' order days'
      )
    ),
    el('div',{style:{position:'relative',overflowX:'auto'},
      onMouseLeave:()=>setTip(null)},
      el('svg',{
        viewBox:`0 0 ${W} ${H}`,
        style:{width:'100%',minWidth:500,display:'block'},
        onMouseMove:e=>{
          const rect=e.currentTarget.getBoundingClientRect();
          const svgX=(e.clientX-rect.left)*(W/rect.width);
          const relX=svgX-PL;
          const i=Math.round((relX/cW)*(n-1));
          if(i>=0&&i<n) setTip({i,x:PL+xPos(i),y:PT+yPos(vals[i]),date:entries[i][0],units:vals[i]});
        }
      },
        // Grid lines
        yTicks.map((v,i)=>el('g',{key:i},
          el('line',{x1:PL,y1:PT+yPos(v),x2:PL+cW,y2:PT+yPos(v),stroke:'var(--bdr)',strokeWidth:0.5,strokeDasharray:v===0?'none':'3 4'}),
          el('text',{x:PL-4,y:PT+yPos(v)+4,textAnchor:'end',fontSize:9,fill:'var(--text3)',fontFamily:'inherit'},v)
        )),
        // Area fill
        el('polygon',{points:areaPoints,fill:lineCol,opacity:0.08}),
        // Weekly separators â light vertical lines every Monday
        ...weekSeps.map((x,i)=>el('line',{key:'ws'+i,x1:x,y1:PT,x2:x,y2:PT+cH,stroke:'var(--bdr2)',strokeWidth:0.5,opacity:0.5})),
        // Milestone day lines
        ...milestones.map(m=>{
          if(m.past)return null;
          // Each milestone gets a slightly different colour for distinction
          const mcols={15:'#a78bfa',30:'#5b9bd5',60:'#4dbb6a',90:'#f0c030'};
          const mcol=mcols[m.days]||'#f0c030';
          const mbg={15:'#1a0f3c',30:'#0d1f3c',60:'#0d2a14',90:'#2a2200'};
          const flipLabel=m.x>W*0.82; // flip label left if near right edge
          const lx=flipLabel?m.x-34:m.x+3;
          return el('g',{key:m.days},
            el('line',{x1:m.x,y1:PT,x2:m.x,y2:PT+cH,stroke:mcol,strokeWidth:1.5,strokeDasharray:'4 3',opacity:0.85}),
            el('rect',{x:lx,y:PT+2,width:30,height:14,rx:3,fill:mbg[m.days]||'#2a2200',stroke:mcol,strokeWidth:0.5}),
            el('text',{x:lx+5,y:PT+12,fontSize:9,fill:mcol,fontWeight:700,fontFamily:'inherit'},m.days+'d')
          );
        }),
        // Line
        el('polyline',{points,fill:'none',stroke:lineCol,strokeWidth:1.5,strokeLinejoin:'round',strokeLinecap:'round'}),
        // Month labels
        monthLabels.map((m,i)=>el('g',{key:i},
          el('line',{x1:m.x,y1:PT+cH,x2:m.x,y2:PT+cH+3,stroke:'var(--text3)',strokeWidth:0.5}),
          el('text',{x:m.x,y:H-4,textAnchor:'middle',fontSize:9,fill:'var(--text3)',fontFamily:'inherit'},m.lbl)
        )),
        // Tooltip dot + line
        tip&&el('g',null,
          el('line',{x1:tip.x,y1:PT,x2:tip.x,y2:PT+cH,stroke:'var(--bdr2)',strokeWidth:1,strokeDasharray:'3 3'}),
          el('circle',{cx:tip.x,cy:tip.y,r:4,fill:lineCol,stroke:'var(--bg)',strokeWidth:1.5}),
          el('rect',{
            x:tip.x+(tip.x>W*0.7?-96:10),y:tip.y-18,
            width:88,height:32,rx:5,
            fill:'var(--bg)',stroke:lineCol,strokeWidth:0.5
          }),
          el('text',{x:tip.x+(tip.x>W*0.7?-92:14),y:tip.y-4,fontSize:10,fontWeight:700,fill:lineCol,fontFamily:'inherit'},tip.units+' units'),
          el('text',{x:tip.x+(tip.x>W*0.7?-92:14),y:tip.y+9,fontSize:9,fill:'var(--text2)',fontFamily:'inherit'},tip.date)
        )
      )
    )
  );
}

/* ââ Store Distribution Card ââ */
function StoreDistributionCard({storeMetrics,vel,prevVel,clsCol}){
  if(!storeMetrics)return null;
  const wkEntries=Object.entries(storeMetrics.weekMetrics).sort(([a],[b])=>a.localeCompare(b));
  const lw=wkEntries[wkEntries.length-1]?.[1]||{};
  const repeatRate=lw.prevActive>0?Math.round(lw.repeat/lw.prevActive*100):null;
  const distPct=Math.round(storeMetrics.totalStores/ONTARIO_STORES*100);
  const velDelta=prevVel!=null?vel-prevVel:null;
  const velDeltaPct=prevVel>0?((vel-prevVel)/prevVel*100):null;

  return el('div',{style:{background:'var(--bg)',border:'0.5px solid var(--bdr)',borderRadius:10,padding:'16px',marginBottom:16}},
    el('div',{style:{fontSize:10,fontWeight:700,textTransform:'uppercase',letterSpacing:'.07em',color:'var(--text3)',marginBottom:14}},'Store Distribution & Growth'),

const GH_CONF_KEY = 'au_gh_config_v1';
const GH_OWNER    = 'kylenauj';
const GH_REPO     = 'productdev';
const GH_FILE     = 'data.json';
const GH_BRANCH   = 'main';
const GH_TOKEN_DEFAULT='';

const getGHConf = ()=>{ try{ return JSON.parse(localStorage.getItem(GH_CONF_KEY))||{}; }catch{ return {}; } };
const saveGHConf = c=>{ try{ localStorage.setItem(GH_CONF_KEY, JSON.stringify(c)); }catch{} };
const getToken = ()=>getGHConf().token||GH_TOKEN_DEFAULT;

const ghHeaders = token=>({
  'Authorization': 'Bearer '+token,
  'Accept': 'application/vnd.github.v3+json',
  'Content-Type': 'application/json',
  'X-GitHub-Api-Version': '2022-11-28',
});

async function ghRead(token){
  const r = await fetch(
    `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${GH_FILE}?ref=${GH_BRANCH}`,
    { headers: ghHeaders(token) }
  );
  if(r.status===404) return null; // file doesn't exist yet
  if(r.status===401||r.status===403){
    const e=await r.json().catch(()=>({}));
    throw new Error('Auth failed ('+r.status+'): '+(e.message||'PAT may be expired or missing repo scope'));
  }
  if(!r.ok) throw new Error('GitHub read failed: '+r.status);
  const d = await r.json();
  const content = JSON.parse(atob(d.content.replace(/\n/g,'')));
  return { data: content, sha: d.sha };
}

async function ghWrite(token, data, sha){
  const content = btoa(unescape(encodeURIComponent(JSON.stringify({...data, _ghLastSaved: new Date().toISOString()}))));
  const body = {
    message: 'Dashboard update '+new Date().toISOString().slice(0,16),
    content,
    branch: GH_BRANCH,
    ...(sha ? { sha } : {})
  };
  const r = await fetch(
    `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${GH_FILE}`,
    { method:'PUT', headers: ghHeaders(token), body: JSON.stringify(body) }
  );
  if(r.status===401||r.status===403){
    const e=await r.json().catch(()=>({}));
    throw new Error('Auth failed ('+r.status+'): '+(e.message||'check PAT has repo scope and is not expired'));
  }
  if(!r.ok){
    const e = await r.json().catch(()=>({}));
    throw new Error(e.message||'GitHub write failed: '+r.status);
  }
  const d = await r.json();
  return d.content.sha; // return new sha for next write
}

function GitHubSyncPanel({data, setData, onClose}){
  const conf = getGHConf();
  const [token,   setToken]   = React.useState(conf.token||'');
  const [autoRef, setAutoRef] = React.useState(conf.autoRefresh!==false);
  const [status,  setStatus]  = React.useState(null);
  const [busy,    setBusy]    = React.useState(false);
  const shaRef = React.useRef(conf.sha||null);

  const saveConf = (t,ar,sha)=>{
    shaRef.current = sha||shaRef.current;
    saveGHConf({token:t, autoRefresh:ar, sha:shaRef.current});
  };

  const handleTokenChange = val=>{
    setToken(val);
    saveConf(val, autoRef, shaRef.current);
  };

  const handlePull = async()=>{
    if(!token){ setStatus({ok:false,msg:'Paste your GitHub PAT below first.'}); return; }
    setBusy(true); setStatus(null);
    try{
      const result = await ghRead(token);
      if(!result){ setStatus({ok:false,msg:'No data.json found yet — use Push first to create it.'}); }
      else{
        shaRef.current = result.sha;
        saveConf(token, autoRef, result.sha);
        setData(result.data);
        setStatus({ok:true, msg:'Pulled! Dashboard loaded from GitHub.'});
      }
    }catch(e){ setStatus({ok:false,msg:e.message}); }
    finally{ setBusy(false); }
  };

  const handlePush = async()=>{
    if(!token){ setStatus({ok:false,msg:'Paste your GitHub PAT below first.'}); return; }
    setBusy(true); setStatus(null);
    try{
      const latest = await ghRead(token);
      const sha = latest ? latest.sha : shaRef.current;
      const newSha = await ghWrite(token, data, sha);
      shaRef.current = newSha;
      saveConf(token, autoRef, newSha);
      setStatus({ok:true, msg:'Saved to GitHub! Viewers can Pull to see your changes.'});
    }catch(e){ setStatus({ok:false,msg:e.message}); }
    finally{ setBusy(false); }
  };

  const handleAutoRefresh = val=>{
    setAutoRef(val);
    saveConf(token, val, shaRef.current);
  };

  const hasToken = token && token.length > 10;

  return el('div',{style:{

        el('div',null,
          el('div',{style:{fontSize:15,fontWeight:800,display:'flex',alignItems:'center',gap:8}},

          ),
          el('div',{style:{fontSize:11,color:'var(--text3)',marginTop:3}},
            GH_OWNER+' / '+GH_REPO+' → '+GH_FILE
          )
        ),
        el('button',{onClick:onClose,style:{background:'none',border:'none',cursor:'pointer',color:'var(--text3)',fontSize:18}},
          el('i',{className:'ti ti-x'})
        )
      ),
      el('div',{style:{padding:'20px'}},
        el('div',{style:{background:'var(--info-bg)',border:'0.5px solid var(--info)',borderRadius:8,padding:'10px 14px',marginBottom:16,fontSize:12,color:'var(--info)'}},
          el('i',{className:'ti ti-info-circle',style:{marginRight:6}}),
          'Code and data are separate. Pushing saves ',el('strong',null,'data.json'),' to your repo — your HTML/code is never changed.'
        ),
        el('div',{style:{marginBottom:16}},
          el('div',{style:{fontSize:11,fontWeight:600,color:'var(--text2)',marginBottom:5,display:'flex',alignItems:'center',gap:6}},
            el('i',{className:'ti ti-key',style:{fontSize:13}}),

          ),
          el('input',{
            type:'password',

            value:token,
            onChange:e=>handleTokenChange(e.target.value),

          }),
          el('div',{style:{fontSize:10,color:'var(--text3)'}},

function PostLaunchView({data}){
  // data = launch dashboard data (for reading launchDate from product tasks)
  const [salesData,setSalesData]=React.useState(()=>{
    try{const s=localStorage.getItem('au_pl_data');return s?JSON.parse(s):SALES_DATA_DEFAULT;}
    catch{return SALES_DATA_DEFAULT;}
  });
  const [hidden,setHidden]=React.useState(()=>{
    try{const s=localStorage.getItem('au_pl_hidden');return s?JSON.parse(s):[];}
    catch{return [];}
  });
  const [sel,setSel]=React.useState(Object.keys(SALES_DATA_DEFAULT)[0]||'');
  const [activePC,setActivePC]=React.useState('pc1');

  const saveHidden=h=>{setHidden(h);try{localStorage.setItem('au_pl_hidden',JSON.stringify(h));}catch{}};
  const removeProduct=name=>saveHidden([...hidden,name]);
  const restoreProduct=name=>saveHidden(hidden.filter(h=>h!==name));

  // PC groupings matching the launch dashboard tabs
  const PC_GROUPS=[
    {id:'pc1',label:'PC#1 2026'},
    {id:'pc2',label:'PC#2 2026'},
    {id:'pc3',label:'PC#3 2026'},
    {id:'other',label:'Other SKUs'},
  ];

  // Resolve launchDate: prefer the launch dashboard product's launchDate, fallback to SALES_DATA
  const getEffectiveLaunchDate=(name,sdProd)=>{
    // 1. Try to find matching product in launch dashboard by name similarity
    for(const pcKey of Object.keys(data)){
      if(!Array.isArray(data[pcKey]))continue;
      const match=data[pcKey].find(p=>
        p.name&&name&&(
          name.toLowerCase().includes(p.shortName?.toLowerCase())||
          p.name.toLowerCase().includes(name.split(' ').slice(0,3).join(' ').toLowerCase())
        )
      );
      if(match&&match.launchDate)return match.launchDate;
    }
    // 2. Fall back to launchDate on the sales data product itself
    if(sdProd?.launchDate)return sdProd.launchDate;
    // 3. Fall back to OCS first receipt date
    if(sdProd?.ocs?.firstReceipt)return sdProd.ocs.firstReceipt;
    return '';
  };

  // Products grouped by PC
  const allNames=Object.keys(salesData).filter(k=>!hidden.includes(k));
  const grouped=PC_GROUPS.map(pc=>({
    ...pc,
    products:allNames.filter(name=>(salesData[name]?.pc||'other')===pc.id)
  })).filter(g=>g.products.length>0||(g.id===activePC));

  // If active PC has no products, auto-select first PC that does
  React.useEffect(()=>{
    const firstWithProducts=grouped.find(g=>g.products.length>0);
    if(firstWithProducts&&!grouped.find(g=>g.id===activePC)?.products?.length){
      setActivePC(firstWithProducts.id);
    }
  },[]);

  const activeGroup=grouped.find(g=>g.id===activePC);
  const visibleProds=activeGroup?.products||[];

  // Auto-select first product in active PC if current sel not in this PC
  React.useEffect(()=>{
    if(visibleProds.length>0&&!visibleProds.includes(sel)){
      setSel(visibleProds[0]);
    }
  },[activePC]);

  const current=salesData[sel];
  // Use SALES_DATA_DEFAULT launchDate (first order date) as priority for milestone markers
  // Falls back to OCS firstReceipt, then dashboard launch date
  const effectiveLaunchDate=current?(
    SALES_DATA_DEFAULT[sel]?.launchDate ||
    current?.launchDate ||
    current?.ocs?.firstReceipt ||
    getEffectiveLaunchDate(sel,current) ||
    ''
  ):'';

  if(Object.keys(salesData).filter(k=>!hidden.includes(k)).length===0)
    return el('div',{style:{padding:40,textAlign:'center',color:'var(--text2)'}},
      el('i',{className:'ti ti-chart-off',style:{fontSize:36,display:'block',marginBottom:12,opacity:.4}}),
      'All products hidden.',el('br',null),
      el('div',{style:{marginTop:16,display:'flex',gap:8,justifyContent:'center',flexWrap:'wrap'}},
        hidden.map(name=>el('button',{key:name,onClick:()=>restoreProduct(name),className:'btn'},el('i',{className:'ti ti-eye'}),' '+name.slice(0,30)))
      )
    );

  return el('div',{style:{padding:'20px'}},
    /* ââ PC Tab bar ââ */
    el('div',{style:{display:'flex',gap:0,borderBottom:'0.5px solid var(--bdr)',marginBottom:16,overflowX:'auto'}},
      PC_GROUPS.map(pc=>{
        const count=Object.keys(salesData).filter(k=>!hidden.includes(k)&&(salesData[k]?.pc||'other')===pc.id).length;
        if(count===0)return null;
        const isOn=activePC===pc.id;

/* ââ App ââ */
const APP_PASSWORD='Mera2026!';
const AUTH_KEY='au_auth_v1';
const isAuthed=()=>{try{return localStorage.getItem(AUTH_KEY)==='1';}catch{return false;}};
const setAuthed=()=>{try{localStorage.setItem(AUTH_KEY,'1');}catch{}};

function LoginScreen({onAuth}){
  // Two stages: 1) password  2) load from GitHub (or skip to local)
  const [stage,  setStage]  = React.useState('password'); // 'password' | 'load'
  const [pw,     setPw]     = React.useState('');
  const [err,    setErr]    = React.useState(false);
  const [loading,setLoading]= React.useState(false);
  const [ghStatus,setGhStatus]=React.useState(null);
  const pwRef = React.useRef();
  React.useEffect(()=>{ if(stage==='password'&&pwRef.current) pwRef.current.focus(); },[stage]);

  const checkPw=()=>{
    if(pw===APP_PASSWORD){
      setErr(false);
      setStage('load');
    } else {
      setErr(true);
      setPw('');
      if(pwRef.current) pwRef.current.focus();
    }
  };

  const loadFromGitHub=async()=>{
    setLoading(true); setGhStatus(null);
    try{
      const r=await fetch(
        'https://raw.githubusercontent.com/'+GH_OWNER+'/'+GH_REPO+'/'+GH_BRANCH+'/'+GH_FILE+'?t='+Date.now()
      );
      if(!r.ok) throw new Error('HTTP '+r.status);
      const result=await r.json();
      if(result){
        setGhStatus({ok:true,msg:'Loaded from GitHub!'});
        setAuthed();
        setTimeout(()=>onAuth(result),500);
      } else {
        setGhStatus({ok:false,msg:'No data file found â loading with local data.'});
        setAuthed();
        setTimeout(()=>onAuth(),500);
      }
    }catch(e){
      setGhStatus({ok:false,msg:'Load error: '+e.message+' â using local data.'});
      setAuthed();
      setTimeout(()=>onAuth(),500);
    }
    setLoading(false);
  };

  const enterLocal=()=>{ setAuthed(); onAuth(); };

  return el('div',{style:{
    minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',
    background:'var(--bg3)',padding:20
  }},
    el('div',{style:{
      background:'var(--bg)',border:'0.5px solid var(--bdr2)',borderRadius:16,
      padding:'40px 36px',maxWidth:400,width:'100%',textAlign:'center',
      boxShadow:'0 8px 40px rgba(0,0,0,0.35)'
    }},
      el('div',{style:{fontSize:11,fontWeight:700,textTransform:'uppercase',letterSpacing:'.1em',color:'var(--text3)',marginBottom:10}},'Adult Rec'),
      el('h1',{style:{fontSize:22,fontWeight:800,letterSpacing:'-.3px',marginBottom:6}},'Product Launch Dashboard'),
      el('div',{style:{fontSize:11,color:'var(--text3)',marginBottom:32}},'Ontario Â· 2026 Â· v1.14'),

      /* ââ Stage 1: Password ââ */
      stage==='password'&&el('div',null,
        el('input',{
          ref:pwRef,type:'password',className:'ei',
          placeholder:'Enter password',value:pw,
          onChange:e=>{setPw(e.target.value);setErr(false);},
          onKeyDown:e=>e.key==='Enter'&&checkPw(),
          style:{fontSize:14,textAlign:'center',letterSpacing:'.1em',marginBottom:err?8:14}
        }),
        err&&el('div',{style:{fontSize:11,color:'var(--err)',marginBottom:10,display:'flex',alignItems:'center',justifyContent:'center',gap:4}},
          el('i',{className:'ti ti-x'}), ' Incorrect password'
        ),
        el('button',{onClick:checkPw,style:{
          width:'100%',background:'var(--info-bg)',border:'0.5px solid var(--info)',
          borderRadius:8,padding:'12px',fontSize:13,fontFamily:'inherit',
          color:'var(--info)',fontWeight:700,cursor:'pointer'
        }},'Continue â')
      ),

      /* ââ Stage 2: Load ââ */
      stage==='load'&&el('div',null,
        el('div',{style:{
          background:'var(--ok-bg)',border:'0.5px solid var(--ok)',borderRadius:8,
          padding:'10px 14px',marginBottom:20,fontSize:12,color:'var(--ok)',
          display:'flex',alignItems:'center',gap:7
        }},el('i',{className:'ti ti-check'}),' Password accepted'),
        el('button',{onClick:loadFromGitHub,disabled:loading,style:{
          width:'100%',background:'#24292f',border:'none',borderRadius:8,
          padding:'12px',fontSize:13,fontFamily:'inherit',color:'#fff',fontWeight:700,
          cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',
          gap:8,marginBottom:12,opacity:loading?0.6:1
        }},
          loading
            ? el('span',null,el('i',{className:'ti ti-loader-2',style:{animation:'spin 1s linear infinite',marginRight:6}}),'Loadingâ¦')
            : el('span',null,el('i',{className:'ti ti-cloud-download'}),' Load from GitHub')
        ),
        ghStatus&&el('div',{style:{
          padding:'8px 12px',borderRadius:7,fontSize:12,marginBottom:12,
          background:ghStatus.ok?'var(--ok-bg)':'var(--warn-bg)',
          color:ghStatus.ok?'var(--ok)':'var(--warn)',
          display:'flex',alignItems:'center',gap:7,textAlign:'left'
        }},el('i',{className:'ti '+(ghStatus.ok?'ti-check':'ti-alert-circle')}),ghStatus.msg),
        !loading&&!ghStatus?.ok&&el('button',{onClick:enterLocal,style:{
          width:'100%',background:'transparent',border:'0.5px solid var(--bdr2)',
          borderRadius:8,padding:'10px',fontSize:12,fontFamily:'inherit',
          color:'var(--text2)',cursor:'pointer'
        }},'Skip â use local data')
      )
    )
  );
}

function App(){
  const [authed,setAuthed_]=useState(isAuthed);
  const init=loadState()||INITIAL;
  const [data,setData]=useState(()=>({...INITIAL,...init,pcTabs:init.pcTabs||INITIAL.pcTabs}));
  const [view,setView]=useState(()=>data.pcTabs[0]?.id||'pc1');
  const [sels,setSels]=useState({pc1:'bb',pc2:'bcp',pc3:'pp'});
  const [prodView,setProdView]=useState('summary'); // 'summary' | 'detail'
  const [fullscreen,setFullscreen]=useState(false);
  const [saved,setSaved]=useState(false);
  const [lastSaved,setLastSaved]=useState(null);
  const [showGH,setShowGH]=useState(false);
  const [renamingTab,setRenamingTab]=useState(null);
  const [storeCountVer,setStoreCountVer]=useState(0); // bumped when store count changes to force re-render
  const importRef=useRef();

  useEffect(()=>{saveState(data);setSaved(true);setLastSaved(Date.now());const t=setTimeout(()=>setSaved(false),1800);return()=>clearTimeout(t);},[data]);

  // Auto-refresh from GitHub for viewers
  useEffect(()=>{
    const conf=getGHConf();
    if(!conf.autoRefresh||!conf.token)return;
    const interval=setInterval(async()=>{
      try{
        const result=await ghRead(conf.token);
        if(result)setData(result.data);
      }catch(e){ /* silent fail */ }
    },30000);
    return()=>clearInterval(interval);
  },[]);

  useEffect(()=>{
    const h=e=>{
      if(e.key==='Escape'&&fullscreen)setFullscreen(false);
      if(e.key==='F'&&!e.target.matches('input,textarea,select'))setFullscreen(f=>!f);
    };
    window.addEventListener('keydown',h);return()=>window.removeEventListener('keydown',h);
  },[fullscreen]);

  const prods=data[view]||[];
  const selId=sels[view]||prods[0]?.id;
  const prod=prods.find(p=>p.id===selId)||prods[0];
  const setSelId=id=>{setSels(s=>({...s,[view]:id}));setProdView('detail');};

  const updProd=(pc,id,upd)=>setData(d=>({...d,[pc]:d[pc].map(p=>p.id===id?upd:p)}));
  const addProd=()=>{
    const tab=data.pcTabs.find(t=>t.id===view);
    const np=BLANK_PROD(tab?tab.label:'New PC');
    setData(d=>({...d,[view]:[...(d[view]||[]),np]}));
    setSels(s=>({...s,[view]:np.id}));
    setProdView('detail');
  };
  const removeProd=id=>{
    setData(d=>{const next=(d[view]||[]).filter(p=>p.id!==id);return {...d,[view]:next};});
    const remaining=(data[view]||[]).filter(p=>p.id!==id);
    setSels(s=>({...s,[view]:remaining.length>0?remaining[0].id:''}));
    if(remaining.length===0)setProdView('summary');
  };
  const kbNav=dir=>{const idx=prods.findIndex(p=>p.id===selId);const next=prods[idx+dir];if(next)setSelId(next.id);};

  const addProductCall=()=>{
    const nums=data.pcTabs.map(t=>{const m=t.id.match(/pc(\d+)/);return m?parseInt(m[1]):0;});
    const next=Math.max(0,...nums)+1,newId='pc'+next,newLabel='PC#'+next+' 2026';
    setData(d=>({...d,pcTabs:[...d.pcTabs,{id:newId,label:newLabel}],[newId]:[]}));
    setView(newId);setProdView('summary');
  };
  const removeTab=id=>{
    if(data.pcTabs.length<=1){alert('Cannot remove the last product call.');return;}
    if(!confirm('Remove this product call and all its products?'))return;
    const newTabs=data.pcTabs.filter(t=>t.id!==id);
    setData(d=>{const nd={...d,pcTabs:newTabs};delete nd[id];return nd;});
    if(view===id){setView(newTabs[0].id);setProdView('summary');}
  };
  const renameTab=(id,label)=>{setData(d=>({...d,pcTabs:d.pcTabs.map(t=>t.id===id?{...t,label}:t)}));setRenamingTab(null);};

  const importJSON=e=>{
    const file=e.target.files[0];if(!file)return;
    const r=new FileReader();
    r.onload=ev=>{try{const d=JSON.parse(ev.target.result);setData(d);setView(d.pcTabs?.[0]?.id||'pc1');alert('Backup imported successfully!');e.target.value='';}catch{alert('Invalid JSON file.');}};
    r.readAsText(file);
  };

  const shell=el('div',{className:'shell'+(fullscreen?' fullscreen-shell':'')},
    el('div',{className:'topbar',style:{gap:0}},
      data.pcTabs.map(tab=>el('div',{key:tab.id,style:{display:'flex',alignItems:'center',borderBottom:view===tab.id?'2px solid var(--bdr2)':'2px solid transparent',marginBottom:-1}},
        renamingTab===tab.id
          ?el('input',{autoFocus:true,className:'ei',style:{fontSize:13,padding:'6px 10px',width:120},defaultValue:tab.label,onBlur:e=>renameTab(tab.id,e.target.value||tab.label),onKeyDown:e=>{if(e.key==='Enter')renameTab(tab.id,e.target.value||tab.label);if(e.key==='Escape')setRenamingTab(null);}})
          :el('button',{className:'ptab '+(view===tab.id?'on':''),style:{borderBottom:'none'},onClick:()=>{setView(tab.id);setProdView('summary');},onDoubleClick:()=>setRenamingTab(tab.id),title:'Double-click to rename'},tab.label),
        data.pcTabs.length>1&&el('button',{onClick:()=>removeTab(tab.id),style:{background:'transparent',border:'none',cursor:'pointer',color:'var(--text3)',padding:'0 6px 0 0',fontSize:11,display:'flex',alignItems:'center'}},el('i',{className:'ti ti-x',style:{fontSize:10}}))
      )),
      el('button',{onClick:addProductCall,style:{background:'transparent',border:'none',borderBottom:'2px solid transparent',cursor:'pointer',padding:'9px 14px',fontSize:12,color:'var(--text2)',display:'flex',alignItems:'center',gap:4},title:'Add new product call'},el('i',{className:'ti ti-plus'}),' New PC'),
      el('button',{className:'ptab '+(view==='postlaunch'?'on':''),style:{borderBottom:view==='postlaunch'?'2px solid var(--bdr2)':'2px solid transparent',marginLeft:8,paddingLeft:16,borderLeft:'0.5px solid var(--bdr)',color:view==='postlaunch'?'var(--text)':'var(--text2)'},onClick:()=>setView('postlaunch')},
        el('i',{className:'ti ti-chart-line',style:{fontSize:13,marginRight:5}}),'Post Launch'
      ),
      el('div',{style:{marginLeft:'auto',display:'flex',alignItems:'center',gap:6,paddingRight:8}},
        el('button',{onClick:()=>setProdView(v=>v==='summary'?'detail':'summary'),className:'gantt-btn',title:'Toggle summary / detail view'},
          el('i',{className:'ti '+(prodView==='summary'?'ti-layout-cards':'ti-layout-list')}),prodView==='summary'?' Summary':' Detail'
        ),
        el('button',{onClick:()=>setFullscreen(f=>!f),className:'gantt-btn',title:'Fullscreen (F)'},el('i',{className:'ti '+(fullscreen?'ti-minimize':'ti-maximize')}))
      )
    ),
    view==='postlaunch'
      ? el(PostLaunchView,{data})
      : el('div',null,
          el(ProductPanels,{prods,selId:prod?.id||'',setSelId,onAdd:addProd,onRemove:removeProd}),
          prodView==='summary'
            ? el(SummaryView,{prods,onSelect:id=>{setSelId(id);}})
            : prod
              ? el(ProductDetail,{key:prod.id,prod,onChange:upd=>updProd(view,prod.id,upd),onKbNav:kbNav})
              : el('div',{style:{padding:'40px',textAlign:'center',color:'var(--text2)'}},
                  el('i',{className:'ti ti-package',style:{fontSize:36,display:'block',marginBottom:12,opacity:.4}}),
                  'No products yet.',el('br'),
                  el('button',{className:'btn',style:{marginTop:12},onClick:addProd},el('i',{className:'ti ti-plus'}),' Add First Product')
                )
        )
  );

  if(fullscreen)return el('div',{style:{position:'fixed',inset:0,background:'var(--bg3)',zIndex:1000,overflow:'auto',padding:'20px'}},
    el('div',{style:{maxWidth:1200,margin:'0 auto'}},
      el('div',{style:{display:'flex',justifyContent:'flex-end',marginBottom:12}},
        el('button',{className:'btn',onClick:()=>setFullscreen(false)},el('i',{className:'ti ti-minimize'}),' Exit (Esc)')
      ),
      shell
    )
  );

  if(!authed) return el(LoginScreen,{onAuth:(ghData)=>{
    if(ghData)setData(ghData);
    setAuthed_(true);
  }});
  return el('div',null,
    el('div',{className:'page-hd'},
      el('div',null,
        el('h1',null,'Adult Rec â Product Launch Dashboard'),
        el('div',{style:{display:'flex',alignItems:'center',gap:12,flexWrap:'wrap',marginTop:2}},
          el('div',{style:{display:'flex',alignItems:'center',gap:10}},
            el('small',{style:{color:'var(--text2)'}},'Ontario Â· 2026  Â·  Last saved: ',fmtTs(lastSaved)),
            el('span',{style:{fontSize:10,background:'var(--info-bg)',color:'var(--info)',border:'0.5px solid var(--info)',borderRadius:5,padding:'1px 7px',fontWeight:700,letterSpacing:'.03em'}},'v1.14')
          ),
          el('div',{style:{display:'flex',alignItems:'center',gap:6,background:'var(--bg2)',border:'0.5px solid var(--bdr2)',borderRadius:7,padding:'3px 10px'}},
            el('i',{className:'ti ti-building-store',style:{fontSize:12,color:'var(--text3)'}}),
            el('span',{style:{fontSize:11,color:'var(--text2)'}},'Stores:'),
            el('input',{
              type:'number',
              key:'sc-'+storeCountVer,
              defaultValue:ONTARIO_STORES,
              min:1,max:99999,
              title:'Active Ontario store count â updates all velocity & threshold calculations',
              style:{width:56,background:'transparent',border:'none',outline:'none',fontSize:12,fontWeight:700,color:'var(--info)',fontFamily:'inherit',textAlign:'center',MozAppearance:'textfield'},
              onChange:ev=>{
                const v=parseInt(ev.target.value);
                if(v>0){ONTARIO_STORES=v;saveStoreCount(v);setStoreCountVer(n=>n+1);}
              }
            }),
            el('span',{style:{fontSize:10,color:'var(--text3)'}},'/ Ontario')
          )
        )
      ),
      el('div',{style:{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}},
        saved&&el('span',{className:'save-ind'},el('i',{className:'ti ti-check'}),' Saved'),
        
        el('button',{className:'btn',onClick:()=>{const b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='au_dashboard_'+new Date().toISOString().slice(0,10)+'.json';a.click();}},el('i',{className:'ti ti-download'}),' Backup'),
        el('button',{className:'btn',onClick:()=>importRef.current.click()},el('i',{className:'ti ti-upload'}),' Import'),
        el('button',{className:'btn',onClick:()=>setShowGH(true),style:{background:getToken()?'rgba(36,41,47,0.2)':'',border:getToken()?'0.5px solid rgba(255,255,255,0.3)':''}},el('i',{className:'ti ti-brand-github'}),' GitHub'),
        el('input',{ref:importRef,type:'file',accept:'.json',style:{display:'none'},onChange:importJSON}),
        el('button',{className:'btn',onClick:()=>window.print()},el('i',{className:'ti ti-printer'}),' Print')
      )
    ),
    showGH&&el(GitHubSyncPanel,{data,setData,onClose:()=>setShowGH(false)}),
    shell,
    el('p',{style:{fontSize:11,color:'var(--text3)',textAlign:'center',marginTop:12}},'Generated '+new Date().toLocaleDateString('en-CA',{year:'numeric',month:'long',day:'numeric'})+' Â· Keyboard: T Tasks Â· G Gantt Â· S Specs Â· â â switch products Â· F fullscreen  Â·  Built by Kyle Naujokaitis  Â·  v1.14')
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(el(App));

</script>
