<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Adult Rec — Product Launch Dashboard 2026 · v1.14</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  /* Backgrounds */
  --bg:#ffffff;
  --bg2:#f7f5f3;
  --bg3:#f0ede9;
  --bg4:#e8e4e0;
  --sidebar-bg:#1a1410;

  /* Text */
  --text:#111111;
  --text2:#444444;
  --text3:#888888;
  --text4:#bbbbbb;
  --text-inv:#ffffff;

  /* Borders */
  --bdr:#e0dbd5;
  --bdr2:#ccc7c0;
  --bdr3:#b0a89e;

  /* Orange accent system */
  --accent:#e8622a;
  --accent2:#c94f1a;
  --accent3:#ff8455;
  --accent-bg:#fff4ef;
  --accent-border:#f5c4b0;

  /* Status */
  --ok:#1a7a4a;      --ok-bg:#eef7f1;    --ok-dim:#c8ecd6;
  --info:#1a5fa8;    --info-bg:#eef4fc;  --info-dim:#c4daf5;
  --warn:#b87000;    --warn-bg:#fffaed;  --warn-dim:#f5e4aa;
  --err:#c0392b;     --err-bg:#fdf0ee;   --err-dim:#f5c4be;

  /* Category colours — richer on white */
  --rd-col:#1a5fa8;   --rd-light:#eef4fc;
  --pr-col:#b87000;   --pr-light:#fffaed;
  --op-col:#1a7a4a;   --op-light:#eef7f1;
  --mk-col:#7c3aed;   --mk-light:#f4f0fd;

  /* Radius — sharper */
  --r:6px;
  --rl:8px;
  --rs:4px;

  --sidebar-w:220px;

  /* Type scale */
  --fs-xs:10px;
  --fs-sm:11px;
  --fs-base:13px;
  --fs-md:15px;
  --fs-lg:20px;
  --fs-xl:26px;
}

*{color-scheme:light}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:var(--bg3);
  color:var(--text);
  font-size:var(--fs-base);
  line-height:1.5;
  font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;
}

#root{position:relative}

/* ── Sidebar ── */
.sidebar{
  width:var(--sidebar-w);
  background:var(--sidebar-bg);
  display:flex;
  flex-direction:column;
  position:fixed;
  top:0;left:0;bottom:0;
  z-index:100;
  overflow:hidden;
}
.sidebar-logo{
  padding:20px 16px 14px;
  border-bottom:1px solid rgba(255,255,255,.08);
}
.sidebar-logo-mark{display:flex;align-items:center;gap:10px;margin-bottom:2px}
.sidebar-logo-dot{
  width:30px;height:30px;
  background:var(--accent);
  border-radius:var(--rs);
  display:flex;align-items:center;justify-content:center;
  font-size:15px;font-weight:900;color:#fff;flex-shrink:0;
}
.sidebar-title{font-size:13px;font-weight:700;color:#fff;letter-spacing:-.1px}
.sidebar-sub{font-size:10px;color:rgba(255,255,255,.4);margin-top:2px}

.sidebar-nav{flex:1;overflow-y:auto;padding:8px}
.sidebar-section-label{
  font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;
  color:rgba(255,255,255,.3);padding:14px 8px 5px;
}
.sidebar-item{
  display:flex;align-items:center;gap:9px;padding:8px 10px;
  border-radius:var(--rs);cursor:pointer;border:none;background:transparent;
  font:var(--fs-sm) inherit;color:rgba(255,255,255,.5);width:100%;text-align:left;
  transition:background .1s,color .1s;position:relative;
}
.sidebar-item:hover{background:rgba(255,255,255,.07);color:rgba(255,255,255,.8)}
.sidebar-item.active{background:var(--accent);color:#fff;font-weight:600}
.sidebar-item i{font-size:15px;width:18px;text-align:center;flex-shrink:0}
.sidebar-badge{
  margin-left:auto;background:var(--err);color:#fff;
  border-radius:3px;padding:1px 6px;font-size:10px;font-weight:700;
}
.sidebar-pc-badge{margin-left:auto;font-size:10px;color:rgba(255,255,255,.25)}
.sidebar-footer{
  padding:10px 8px;border-top:1px solid rgba(255,255,255,.08);
  display:flex;flex-direction:column;gap:2px;
}
.sidebar-footer-btn{
  display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:var(--rs);
  cursor:pointer;border:none;background:transparent;font:var(--fs-sm) inherit;
  color:rgba(255,255,255,.4);width:100%;text-align:left;transition:all .1s;
}
.sidebar-footer-btn:hover{background:rgba(255,255,255,.07);color:rgba(255,255,255,.75)}
.sidebar-footer-btn i{font-size:14px;width:18px;text-align:center}

/* ── Main ── */
.main-content{
  margin-left:var(--sidebar-w);flex:1;min-width:0;
  display:flex;flex-direction:column;min-height:100vh;
}

/* ── Topbar ── */
.topbar2{
  height:46px;background:var(--bg);border-bottom:1px solid var(--bdr);
  display:flex;align-items:center;padding:0 20px;gap:12px;
  position:sticky;top:0;z-index:50;
}
.topbar2-title{font-size:14px;font-weight:700;color:var(--text)}
.topbar2-sep{width:1px;height:16px;background:var(--bdr2)}
.topbar2-meta{font-size:11px;color:var(--text3)}
.topbar2-actions{margin-left:auto;display:flex;align-items:center;gap:8px}

/* ── Cards ── */
.card{background:var(--bg);border:1px solid var(--bdr);border-radius:var(--r);overflow:hidden}

/* ── Product strip ── */
.prod-strip{
  display:flex;gap:8px;padding:14px 20px;overflow-x:auto;
  border-bottom:1px solid var(--bdr);background:var(--bg);
}
.prod-chip{
  flex-shrink:0;width:174px;background:var(--bg2);border:1px solid var(--bdr);
  border-radius:var(--r);padding:11px 13px;cursor:pointer;transition:all .12s;
  position:relative;overflow:hidden;
}
.prod-chip::before{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:var(--chip-accent,var(--bdr2));
}
.prod-chip:hover{border-color:var(--bdr2);background:var(--bg)}
.prod-chip.active{border-color:var(--accent);background:var(--accent-bg)}
.prod-chip.active::before{background:var(--accent)}
.prod-chip-brand{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--text3);margin-bottom:4px}
.prod-chip-name{font-size:12px;font-weight:700;color:var(--text);line-height:1.3;margin-bottom:7px}
.prod-chip-meta{font-size:10px;color:var(--text3);display:flex;gap:8px;align-items:center}
.prod-chip-pct{height:2px;background:var(--bdr);margin-top:8px;overflow:hidden}
.prod-chip-pct-fill{height:100%;background:var(--chip-accent,var(--accent))}

/* ── Buttons ── */
.btn{
  background:var(--bg);border:1px solid var(--bdr2);border-radius:var(--rs);
  cursor:pointer;padding:5px 12px;font:inherit;font-size:var(--fs-sm);color:var(--text2);
  display:inline-flex;align-items:center;gap:5px;transition:all .1s;
}
.btn:hover{background:var(--bg2);border-color:var(--bdr3);color:var(--text)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn-primary:hover{background:var(--accent2);border-color:var(--accent2)}
.icon-btn{
  background:transparent;border:none;cursor:pointer;color:var(--text3);
  padding:4px 6px;border-radius:var(--rs);display:inline-flex;align-items:center;
  transition:all .1s;
}
.icon-btn:hover{color:var(--text);background:var(--bg3)}

/* ── Badges ── */
.badge{display:inline-flex;align-items:center;padding:2px 7px;border-radius:3px;font-size:10px;font-weight:600;white-space:nowrap}

/* ── Section tabs ── */
.sectabs{display:flex;border-bottom:1px solid var(--bdr);padding:0 20px;background:var(--bg)}
.stab{
  background:transparent;border:none;border-bottom:2px solid transparent;
  cursor:pointer;padding:9px 14px;font:inherit;font-size:var(--fs-sm);
  color:var(--text3);transition:color .1s;
}
.stab:hover{color:var(--text2)}
.stab.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}

/* ── Task table ── */
.task-tbl{width:100%;border-collapse:collapse}
.task-tbl th{
  padding:7px 12px;text-align:left;font-size:10px;font-weight:700;
  color:var(--text3);letter-spacing:.06em;text-transform:uppercase;
  background:var(--bg2);border-bottom:1px solid var(--bdr);
}
.task-tbl td{padding:7px 12px;font-size:var(--fs-sm);border-bottom:1px solid var(--bdr);vertical-align:middle}
.task-tbl tr:last-child td{border-bottom:none}
.task-tbl tr:hover td{background:var(--bg2)}
.task-tbl tr.overdue-row td{background:#fdf0ee}

/* ── Category headers ── */
.cat-header{
  display:flex;align-items:center;gap:9px;padding:9px 16px;
  font-size:11px;font-weight:700;cursor:pointer;user-select:none;
  border-bottom:1px solid var(--bdr);text-transform:uppercase;letter-spacing:.06em;
  background:var(--bg);
}
.add-row{
  background:transparent;border:none;cursor:pointer;color:var(--text4);
  font:var(--fs-sm) inherit;padding:7px 16px;display:flex;align-items:center;
  gap:6px;width:100%;border-top:1px solid var(--bdr);transition:all .1s;
}
.add-row:hover{color:var(--accent);background:var(--accent-bg)}

/* ── Owner pills ── */
.owner-pills{display:flex;gap:6px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--bdr);background:var(--bg)}
.owner-pill{background:var(--bg2);border:1px solid var(--bdr);border-radius:3px;padding:3px 10px;cursor:pointer;font-size:var(--fs-sm);color:var(--text3);transition:all .1s}
.owner-pill.active{background:var(--accent-bg);border-color:var(--accent);color:var(--accent);font-weight:600}

/* ── Inputs ── */
*{color-scheme:light}
input,textarea,select{color:var(--text);background:var(--bg);font-family:inherit}
select option{background:var(--bg);color:var(--text)}
input.ei,textarea.ei,select.ei{
  background:var(--bg);border:1px solid var(--bdr2);border-radius:var(--rs);
  color:var(--text);font:inherit;font-size:inherit;padding:4px 8px;outline:none;width:100%;
  transition:border-color .1s;
}
input.ei:focus,textarea.ei:focus,select.ei:focus{border-color:var(--accent)}
textarea.ei{resize:vertical;min-height:52px}

/* ── Specs ── */
.specs-wrap{padding:20px 24px}
.spec-section{background:var(--bg);border:1px solid var(--bdr);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.spec-sec-hd{padding:9px 14px;font-size:11px;font-weight:700;letter-spacing:.05em;background:var(--bg2);border-bottom:1px solid var(--bdr);display:flex;align-items:center;gap:7px;cursor:pointer;user-select:none;text-transform:uppercase}
.spec-grid{display:grid;grid-template-columns:1fr 1fr}
.spec-field{display:flex;padding:8px 14px;border-bottom:1px solid var(--bdr);gap:12px}
.spec-field:nth-child(odd){border-right:1px solid var(--bdr)}
.spec-field.full{grid-column:1/-1;border-right:none}
.spec-key{font-size:11px;color:var(--text3);width:160px;flex-shrink:0;padding-top:2px}
.spec-val{font-size:var(--fs-base);flex:1;min-width:0}
.editable{cursor:pointer;border-radius:3px;padding:1px 4px;display:inline-block;min-width:10px}
.editable:hover{background:var(--bg3);outline:1px dashed var(--bdr2)}

/* ── Gantt ── */
.gantt-wrap{padding:20px 24px}
.gantt-toolbar{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.gantt-btn{background:var(--bg2);border:1px solid var(--bdr);border-radius:var(--rs);cursor:pointer;padding:5px 11px;font:var(--fs-sm) inherit;color:var(--text2);display:inline-flex;align-items:center;gap:4px}
.gantt-btn:hover{background:var(--bg3)}
.gantt-bar{position:absolute;height:100%;border-radius:3px;overflow:hidden;display:flex;align-items:center;padding:0 7px;min-width:4px}
.gantt-bar:hover{opacity:.82}

/* ── Summary ── */
.summary-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;padding:20px}
.summary-card{background:var(--bg);border:1px solid var(--bdr);border-radius:var(--r);padding:16px;cursor:pointer;transition:border-color .12s,box-shadow .12s}
.summary-card:hover{border-color:var(--accent);box-shadow:0 2px 12px rgba(232,98,42,.12)}

/* ── Misc ── */
.page-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px}
.page-hd h1{font-size:var(--fs-xl);font-weight:800;letter-spacing:-.4px;color:var(--text)}
.save-ind{font-size:var(--fs-sm);color:var(--ok);display:flex;align-items:center;gap:4px}
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
div:hover > .rm-btn{display:flex!important}
.shell{background:var(--bg);border:1px solid var(--bdr);border-radius:var(--rl);overflow:hidden}
.fullscreen-shell{border-radius:0}

/* ── Leaflet ── */
.leaflet-container{font-family:inherit;font-size:12px}
.leaflet-tooltip{background:var(--bg);color:var(--text);border:1px solid var(--bdr2);border-radius:var(--rs);padding:6px 10px;box-shadow:0 2px 10px rgba(0,0,0,.12);font-family:inherit}
.leaflet-tooltip-top::before{border-top-color:var(--bdr2)}
.leaflet-control-attribution{font-size:9px;opacity:.5}

/* ── Animations ── */
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn .18s ease}

/* ── Scrollbar ── */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bdr2);border-radius:2px}
::-webkit-scrollbar-thumb:hover{background:var(--bdr3)}

/* ── Post launch inline overrides ── */
.leaflet-tile{filter:none}
</style>

</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script>
'use strict';
const {useState,useEffect,useRef,useCallback}=React;
const el=React.createElement;
const TODAY_D=new Date(new Date().toDateString());
const parseD=s=>s?new Date(s+'T00:00:00'):null;
const fmtD=s=>{if(!s)return'—';const d=parseD(s);return d.toLocaleDateString('en-CA',{month:'short',day:'numeric',year:'2-digit'});};
const dLeft=s=>{if(!s)return null;return Math.ceil((parseD(s)-TODAY_D)/86400000);};
const uid=()=>'t'+Math.random().toString(36).slice(2,8);
const fmtTs=d=>d?new Date(d).toLocaleString('en-CA',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}):'—';

const SC={'Done':{bg:'var(--ok-bg)',tx:'var(--ok)'},'In Progress':{bg:'var(--info-bg)',tx:'var(--info)'},'Not Started':{bg:'var(--bg2)',tx:'var(--text3)'},'Blocked':{bg:'var(--err-bg)',tx:'var(--err)'},'Delayed':{bg:'var(--err-bg)',tx:'var(--err)'},'High Priority':{bg:'var(--warn-bg)',tx:'var(--warn)'},'Accepted':{bg:'var(--ok-bg)',tx:'var(--ok)'},'Rejected':{bg:'var(--err-bg)',tx:'var(--err)'},'Cancelled':{bg:'var(--bg2)',tx:'var(--text3)'},'On Track':{bg:'var(--ok-bg)',tx:'var(--ok)'},'Pending':{bg:'var(--warn-bg)',tx:'var(--warn)'},'Launched':{bg:'var(--ok-bg)',tx:'var(--ok)'},'At Risk':{bg:'var(--warn-bg)',tx:'var(--warn)'}};
const sc=s=>SC[s]||{bg:'var(--bg2)',tx:'var(--text2)'};
const ALL_TAG_OPTIONS=['Accepted','Rejected','Cancelled','Delayed','On Track','In Progress','High Priority','Blocked','At Risk','Launched','Pending'];
const STATUS_OPTS=['Not Started','In Progress','Done','Blocked','Delayed'];
const CAT={rd:{id:'rd',label:'R&D',light:'var(--rd-light)',text:'#9ac5f5',col:'#2468b8'},procurement:{id:'procurement',label:'Procurement',light:'var(--pr-light)',text:'#e8a84a',col:'#d4944a'},operations:{id:'operations',label:'Operations & Delivery',light:'var(--op-light)',text:'#4ecfa0',col:'#3dba8a'},marketing:{id:'marketing',label:'Marketing & Post Launch',light:'#1a0f3c',text:'#c4b5fd',col:'#a78bfa'}};
const CAT_ORDER=['rd','procurement','operations','marketing'];
const TCAT={'R&D':'rd','Product Specs / Submission':'rd','Formulation Dev':'rd','Sensory':'rd','Sensory – Internal':'rd','Sensory – Customer':'rd','Formulation Finalization':'rd','NNCP/GTIN':'rd','Financial Analysis':'rd','Packaging Dev':'rd','Labels':'procurement','Input':'procurement','Internal Packaging':'procurement','External Packaging':'procurement','Materials On Site':'operations','Labour':'operations','Samples Ready':'operations','Sample Run':'operations','Base Marketing Materials':'operations','Pre-Sell / Promo':'operations','Pre-Selling':'operations','PO Received':'operations','Production Week':'operations','Bulk Production':'operations','Production/Shipment':'operations','Delivery into OCS':'operations','Pre-Sell Communications':'marketing','Launch Eblast & Comms':'marketing','Digital Selling Assets':'marketing','Printed Marketing Materials':'marketing'};
const getTC=n=>TCAT[n]||'operations';
const BCOL={
  'Done':      {rd:'#1a5fa8',   procurement:'#d4944a',  operations:'#2da878',  marketing:'#7c5fc8'},
  'In Progress':{rd:'#3478c8',  procurement:'#b87c32',  operations:'#1f9464',  marketing:'#9b72e8'},
  'Not Started':{rd:'#1a3660',  procurement:'#251508',  operations:'#0a2018',  marketing:'#1a0f3c'},
};
const BCOL_TEXT={
  'Done':      {rd:'#ffffff',   procurement:'#0d1829',  operations:'#0d1829',  marketing:'#ffffff'},
  'In Progress':{rd:'#e8edf8',  procurement:'#e8d5b0',  operations:'#c8ede0'},
  'Not Started':{rd:'#7db8f0',  procurement:'#c8902a',  operations:'#2a9e70'},
};
const barC=(cat,st)=>(BCOL[st]||BCOL['Not Started'])[cat]||'#333';
const barT=(cat,st)=>(BCOL_TEXT[st]||BCOL_TEXT['Not Started'])[cat]||'#ccc';
const BRAND_COL={'Litti':'var(--info)','Greazy':'var(--ok)','Shatterizer':'var(--warn)','Buddy Blooms':'var(--err)'};
const prodStat=p=>{const d=p.tasks.filter(t=>t.status==='Done').length,tot=p.tasks.length,pct=tot?d/tot:0;if(p.tags&&p.tags.includes('Launched'))return'Launched';if(p.launchDate&&parseD(p.launchDate)<TODAY_D&&pct<1)return'Delayed';if(pct===1)return'Launched';if(pct>=0.55)return'On Track';return'In Progress';};
const mk=(id,name,owner,status,start,end,notes='',atRisk=false)=>({id,name,owner,status,start,end,notes,atRisk,cat:getTC(name)});
const PRESELL_NAMES=['Pre-Selling','Pre-Sell / Promo','Pre-Sell','Presell'];
const getPreSellDate=tasks=>{const t=tasks.find(t=>PRESELL_NAMES.includes(t.name)&&t.start);return t?t.start:null;};
const isOverdue=t=>t.end&&parseD(t.end)<TODAY_D&&t.status!=='Done';

const IMAGE_FIELDS=['Target Product Image','Target Accessory Image'];
const SPEC_SECTIONS=[
  {key:'overview',label:'Product Overview',icon:'ti-info-circle',fields:['Planned Launch Time','Commercial Lead','Formulation Lead','Ops Lead','Brand Name Internal','Product Name Internal','Manufactured by: LP Name','Stocking Status','Launch Window','Stocking Type','Initial Case Offering (FT)','Samples Required']},
  {key:'financial',label:'Financials',icon:'ti-currency-dollar',fields:['Landed Cost','Wholesale Cost','MSRP','Launch PO']},
  {key:'product',label:'Product Specifics',icon:'ti-flask',fields:['Category','Product Size','Formulated Range','Label THC Range','Target CBD Range','Other Cannabinoids, Range','Flavouring Type','Flavour Description','Biomass Input','Formulations','Ingredients']},
  {key:'packaging',label:'Packaging Requirements',icon:'ti-box',fields:['Target Product Image','Target Accessory Image','Product Primary/Hardware','Product Package/Outer','Packaging Labels','Accessory','Master Case GTIN','Retail Pack GTIN','Master Case Dimensions','Units per Master Shipper/Case','Who is responsible for Labels Sourcing?','Do we need new dies for labels?','Vendor providing retail labels?','Vendor providing case labels?']},
  {key:'notes',label:'Notes',icon:'ti-notes',fields:['Additional Notes']}
];

const BLANK_PROD=pcLabel=>({
  id:uid(),brand:'New Brand',name:'New Product',shortName:'New Product',launchDate:'',tags:['In Progress'],

// One-time migration: apply default owners to all existing products
// Only fills in EMPTY owners — never overwrites a name someone already set
const MIGRATION_KEY='au_owner_migration_v1';
const applyDefaultOwners=data=>{
  let changed=false;
  Object.keys(data).forEach(pcKey=>{
    if(!Array.isArray(data[pcKey]))return;
    data[pcKey].forEach(prod=>{
      if(!Array.isArray(prod.tasks))return;
      prod.tasks.forEach(task=>{
        if(!task.owner&&DEFAULT_TASK_OWNERS[task.name]!==undefined){
          task.owner=DEFAULT_TASK_OWNERS[task.name];
          changed=true;
        }
      });
      // Also ensure marketing tasks exist
      const hasMkt=prod.tasks.some(t=>t.name==='Pre-Sell Communications');
      if(!hasMkt){
        ['Pre-Sell Communications','Launch Eblast & Comms','Digital Selling Assets','Printed Marketing Materials']
          .forEach(name=>{
            prod.tasks.push({id:'mkt_'+Math.random().toString(36).slice(2,8),name,owner:DEFAULT_TASK_OWNERS[name]||'Kyle',status:'Not Started',start:'',end:'',notes:'',atRisk:false,cat:'marketing'});
          });
        changed=true;
      }
    });
  });
  return changed;
};

/* ── Editable ── */
function Editable({value,onChange,multiline=false,style={},placeholder='',className=''}){
  const [editing,setEditing]=useState(false);const [val,setVal]=useState(value||'');const ref=useRef();
  useEffect(()=>{setVal(value||'');},[value]);
  useEffect(()=>{if(editing&&ref.current)ref.current.focus();},[editing]);
  const commit=()=>{setEditing(false);if(val!==(value||''))onChange(val);};
  if(editing)return multiline
    ?el('textarea',{ref,className:'ei '+className,style:{...style,width:'100%'},value:val,onChange:ev=>setVal(ev.target.value),onBlur:commit,onKeyDown:ev=>ev.key==='Escape'&&(setVal(value||''),setEditing(false))})
    :el('input',{ref,type:'text',className:'ei '+className,style,value:val,onChange:ev=>setVal(ev.target.value),onBlur:commit,onKeyDown:ev=>{if(ev.key==='Enter')commit();if(ev.key==='Escape'){setVal(value||'');setEditing(false);}}});
  return el('span',{className:'editable '+className,style,onClick:()=>setEditing(true),title:'Click to edit'},val||el('span',{style:{color:'var(--text3)',fontStyle:'italic'}},placeholder));
}
function ESelect({value,options,onChange,style={}}){
  return el('select',{className:'ei',style,value:value||options[0],onChange:ev=>onChange(ev.target.value)},options.map(o=>el('option',{key:o,value:o},o)));
}

/* ── Ring (donut progress) ── */
function Ring({rd,pr,op,size=48}){
  const r=size/2-4,circ=2*Math.PI*r,total=rd+pr+op||1;
  const segs=[{v:rd,c:CAT.rd.col},{v:pr,c:CAT.procurement.col},{v:op,c:CAT.operations.col}];
  let off=0;
  return el('svg',{width:size,height:size,viewBox:`0 0 ${size} ${size}`,style:{transform:'rotate(-90deg)',flexShrink:0}},
    el('circle',{cx:size/2,cy:size/2,r,fill:'none',stroke:'var(--bg3)',strokeWidth:4}),
    segs.map((s,i)=>{const dash=circ*s.v/total,gap=circ-dash,o=off;off+=dash;return s.v>0&&el('circle',{key:i,cx:size/2,cy:size/2,r,fill:'none',stroke:s.c,strokeWidth:4,strokeDasharray:`${dash} ${gap}`,strokeDashoffset:-o,strokeLinecap:'butt'});})
  );
}

  {id:'g4',label:'G4',name:'Marketing',  cat:'marketing',  col:'var(--mk-col)',  bg:'var(--mk-light)'},
];

// Calculate gate status from tasks
const getGateStatus=tasks=>{
  return GATES.map(g=>{
    const catTasks=tasks.filter(t=>t.cat===g.cat);
    if(!catTasks.length) return {...g,status:'empty',done:0,total:0};
    const done=catTasks.filter(t=>t.status==='Done').length;
    const overdue=catTasks.filter(t=>isOverdue(t)).length;
    const status=done===catTasks.length?'cleared':overdue>0?'blocked':'in-progress';
    return {...g,status,done,total:catTasks.length,overdue};
  });
};

// Current gate = first non-cleared gate
const getCurrentGate=gates=>{
  const first=gates.find(g=>g.status!=='cleared'&&g.status!=='empty');
  return first||gates[gates.length-1];
};

// RAG status from gate health
const getRAG=gates=>{
  if(gates.some(g=>g.status==='blocked')) return 'red';
  const cur=getCurrentGate(gates);
  if(cur&&cur.overdue>0) return 'amber';
  return 'green';
};

// T-minus from launch date
const getTMinus=launchDate=>{
  if(!launchDate) return null;
  const launch=new Date(launchDate+'T00:00:00');
  const days=Math.round((launch-TODAY_D)/86400000);
  return days; // negative = overdue, 0 = today, positive = future
};

const fmtTMinus=days=>{
  if(days===null) return null;
  if(days===0) return 'T-0 · Launch Day';
  if(days<0) return 'T+'+(Math.abs(days))+'d post-launch';
  if(days<=14) return 'T-'+days+'d';
  const weeks=Math.round(days/7);
  return 'T-'+weeks+'w';
};

}

/* ── Product Detail ── */
function ProductDetail({prod,onChange,onKbNav}){
  const [sec,setSec]=useState('tasks');
  useEffect(()=>{
    const h=e=>{
      if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.tagName==='SELECT')return;
      if(e.key==='t'||e.key==='T')setSec('tasks');
      else if(e.key==='g'||e.key==='G')setSec('gantt');
      else if(e.key==='s'||e.key==='S')setSec('specs');
      else if(e.key==='ArrowLeft')onKbNav(-1);
      else if(e.key==='ArrowRight')onKbNav(1);
    };
    window.addEventListener('keydown',h);return()=>window.removeEventListener('keydown',h);
  },[onKbNav]);
  const upT=ts=>onChange({...prod,tasks:ts});
  const addT=cat=>upT([...prod.tasks,{id:uid(),name:'New task',owner:'',status:'Not Started',start:'',end:'',notes:'',cat,atRisk:false}]);
  const delT=id=>upT(prod.tasks.filter(t=>t.id!==id));
  const overdue=prod.tasks.filter(t=>isOverdue(t)).length;
  return el('div',{className:'main'},
    el('div',{className:'prod-header'},
      overdue>0&&el('div',{style:{background:'var(--err-bg)',border:'0.5px solid var(--err)',borderRadius:6,padding:'6px 12px',marginBottom:12,fontSize:12,color:'var(--err)',display:'flex',alignItems:'center',gap:8}},
        el('i',{className:'ti ti-alert-triangle',style:{flexShrink:0}}),overdue+' overdue task'+(overdue>1?'s':'')+' — see Tasks tab'
      ),
      el('div',{style:{display:'flex',alignItems:'flex-start',gap:12,flexWrap:'wrap'}},
        el('div',{style:{flex:1,minWidth:0}},
          el('div',{style:{fontSize:11,color:BRAND_COL[prod.brand]||'var(--info)',fontWeight:700,textTransform:'uppercase',letterSpacing:'.08em',marginBottom:5}},
            el(Editable,{value:prod.brand,onChange:v=>onChange({...prod,brand:v}),style:{color:'inherit'}})
          ),
          el(Editable,{value:prod.name,onChange:v=>onChange({...prod,name:v,shortName:v.length>30?v.slice(0,30)+'…':v}),style:{fontSize:16,fontWeight:700,display:'block',marginBottom:8,lineHeight:1.3}}),
          el(TagEditor,{tags:prod.tags||[],onChange:tags=>onChange({...prod,tags})})
        ),
        el('div',{style:{display:'flex',flexDirection:'column',alignItems:'flex-end',gap:6,flexShrink:0}},
          el('label',{style:{fontSize:11,color:'var(--text2)',display:'flex',alignItems:'center',gap:6}},
            'Launch date:',
            el('input',{type:'date',style:{font:'inherit',fontSize:12,background:'var(--bg2)',border:'0.5px solid var(--bdr2)',borderRadius:5,padding:'3px 8px',color:'var(--text)'},value:prod.launchDate||'',onChange:ev=>onChange({...prod,launchDate:ev.target.value})})
          ),
          el('div',{style:{fontSize:11,color:'var(--text3)'}},el('i',{className:'ti ti-keyboard',style:{fontSize:11}}),' T/G/S tabs · ←→ products')
        )
      )
    ),
    el(NotesRow,{notes:prod.notes||{updates:'',blockers:''},onChange:n=>onChange({...prod,notes:n}),launchDate:prod.launchDate,tasks:prod.tasks}),
    el('div',{className:'sectabs'},
      [['tasks','Tasks'],['gantt','Gantt'],['specs','Specs']].map(([id,lbl])=>el('button',{key:id,className:'stab '+(sec===id?'on':''),onClick:()=>setSec(id)},lbl))
    ),
    sec==='tasks'&&el(TasksPanel,{tasks:prod.tasks,onChange:upT,onAdd:addT,onDel:delT}),
    sec==='gantt'&&el(GanttChart,{tasks:prod.tasks,launchDate:prod.launchDate}),
    sec==='specs'&&el(SpecsPanel,{specs:prod.specs,onChange:sp=>onChange({...prod,specs:sp})})
  );
}

const MAP_BOUNDS={w:-84.5,e:-74.0,s:41.4,n:47.5};
const toSVG=(lat,lng,W=460,H=320)=>{
  const x=((lng-MAP_BOUNDS.w)/(MAP_BOUNDS.e-MAP_BOUNDS.w))*W;
  const y=((MAP_BOUNDS.n-lat)/(MAP_BOUNDS.n-MAP_BOUNDS.s))*H;
  return [Math.round(x*10)/10,Math.round(y*10)/10];
};

// Format ISO week → readable label
const fmtWeek=w=>{
  // ISO week to a readable date label (Monday of that week)
  const[y,wn]=w.split('-W');
  const jan4=new Date(parseInt(y),0,4); // Jan 4 is always in week 1
  const monday=new Date(jan4);
  monday.setDate(jan4.getDate()-(jan4.getDay()||7)+1+(parseInt(wn)-1)*7);
  return monday.toLocaleString('en-CA',{month:'short',day:'numeric'});
};

/* ── Velocity Card ── */
function VelocityCard({ocs,weekly}){
  if(!ocs||!weekly)return null;
  const CLS={
    A:{col:'#f0c030',bg:'#fff8ec',tx:'#b87000',label:'Ultra Fast'},
    B:{col:'#4dbb6a',bg:'var(--ok-bg)',tx:'var(--ok)',label:'Fast'},
    C:{col:'#5b9bd5',bg:'var(--info-bg)',tx:'var(--info)',label:'Moderate'},
    D:{col:'#e09b3d',bg:'var(--warn-bg)',tx:'var(--warn)',label:'Slow'},
    E:{col:'#e07878',bg:'var(--err-bg)',tx:'var(--err)',label:'Ultra Slow'},
  };

  const sorted=Object.entries(weekly).sort(([a],[b])=>a.localeCompare(b));
  const n=sorted.length;
  const lw=n>=1?sorted[n-1][1]:0;
  const tw=n>=2?sorted[n-2][1]:0;
  const tr=n>=3?sorted[n-3][1]:0;
  const vel=lw/ONTARIO_STORES;
  const clsKey=vel>=8?'A':vel>=3?'B':vel>=0.8?'C':vel>=0.2?'D':'E';
  const cls=CLS[clsKey];
  const next=nextROS(vel);
  const unitsNeeded=next?Math.max(0,Math.ceil(next.min*ONTARIO_STORES-lw)):0;
  const avg3=Math.round([lw,tw,tr].slice(0,Math.min(3,n)).reduce((a,b)=>a+b,0)/Math.min(3,n));

  const bars=[
    {lbl:n>=3?fmtWeek(sorted[n-3][0]):'—', v:tr},
    {lbl:n>=2?fmtWeek(sorted[n-2][0]):'—', v:tw},
    {lbl:n>=1?fmtWeek(sorted[n-1][0]):'LW', v:lw, hi:true},
  ].filter((_,i)=>i>=3-Math.min(3,n));
  const bMax=Math.max(...bars.map(b=>b.v),1);

  return el('div',{style:{background:'var(--bg)',border:'0.5px solid var(--bdr)',borderRadius:10,padding:'20px',marginBottom:16}},

    el('div',{style:{fontSize:10,fontWeight:700,textTransform:'uppercase',letterSpacing:'.08em',color:'var(--text3)',marginBottom:16}},
      'OCS Velocity  ·  ',
      el('span',{style:{fontWeight:400,color:'var(--text2)'}},'Last Week SO ÷ '+ONTARIO_STORES.toLocaleString()+' stores  ·  '+n+' weeks of data')
    ),

    /* ── Top row: class badge | velocity + bars | next class ── */
    el('div',{style:{display:'flex',gap:16,alignItems:'stretch',marginBottom:16}},

      /* Class badge */
      el('div',{style:{flexShrink:0,width:110,background:cls.bg,border:'2px solid '+cls.col,borderRadius:10,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:'14px 0'}},
        el('div',{style:{fontSize:44,fontWeight:900,color:cls.tx,lineHeight:1}},clsKey),
        el('div',{style:{fontSize:11,color:cls.tx,fontWeight:700,marginTop:5}},cls.label),
        el('div',{style:{fontSize:9,color:cls.tx,opacity:.6,marginTop:3}},'SKU Class')
      ),

      /* Velocity number + 3-week mini bars */
      el('div',{style:{flex:1,display:'flex',flexDirection:'column',justifyContent:'space-between'}},
        /* Velocity number row */
        el('div',{style:{display:'flex',alignItems:'baseline',gap:10,marginBottom:12}},
          el('span',{style:{fontSize:36,fontWeight:900,color:cls.tx,lineHeight:1}},vel.toFixed(4)),
          el('span',{style:{fontSize:12,color:'var(--text2)'}},
            'velocity  ·  LW ',
            el('strong',{style:{color:'var(--text)',fontSize:14}},lw.toLocaleString()),
            ' units ÷ '+ONTARIO_STORES.toLocaleString())
        ),
        /* 3-week bars — anchored at baseline */
        el('div',null,
          el('div',{style:{display:'flex',gap:10,alignItems:'flex-end',borderBottom:'2px solid var(--bdr2)',paddingBottom:0}},
            bars.map((b,i)=>el('div',{key:i,style:{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:3}},
              el('div',{style:{fontSize:11,fontWeight:700,color:b.hi?cls.tx:'var(--text2)'}},b.v.toLocaleString()),

                width:'100%',

  const entries=Object.entries(raw).sort(([a],[b])=>a.localeCompare(b));
  if(!entries.length)return null;

  // Official thresholds — based on current Ontario store count
  const sc=ONTARIO_STORES;
  const ALL_T=mode==='weekly'?[
    {label:'A',units:Math.round(8*sc),   col:'#f0c030'},
    {label:'B',units:Math.round(3*sc),   col:'#4dbb6a'},
    {label:'C',units:Math.round(0.8*sc), col:'#5b9bd5'},
    {label:'D',units:Math.round(0.2*sc), col:'#e09b3d'},
  ]:[];

  const maxV=Math.max(...entries.map(([,v])=>v),1);
  // Only draw lines that fall within 0–2× of actual data (no point showing A at 13k if max is 400)
  const thresholds=ALL_T.filter(t=>t.units<=maxV*2);
  // Scale chart high enough to show the lowest threshold above the data
  const topThresh=thresholds.length?Math.max(...thresholds.map(t=>t.units)):0;
  const chartMax=Math.max(maxV,topThresh)*1.14;

  const BAR_H=108;
  const fmtMo=k=>{const[y,m]=k.split('-');return['','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][parseInt(m)]+"'"+y.slice(2);};
  const lbl=k=>mode==='weekly'?fmtWeek(k):fmtMo(k);

  return el('div',null,
    el('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:12}},
      el('div',{style:{fontSize:12,fontWeight:700,display:'flex',alignItems:'center',gap:6}},
        el('i',{className:'ti ti-chart-bar',style:{color:'var(--info)'}}), 'Weekly Sales & ROS Class'
      ),
      el('div',{style:{display:'flex',gap:4}},
        ['weekly','monthly'].map(m=>el('button',{key:m,onClick:()=>setMode(m),style:{
          background:mode===m?'var(--info-bg)':'var(--bg2)',
          border:'0.5px solid '+(mode===m?'var(--info)':'var(--bdr)'),
          borderRadius:5,cursor:'pointer',padding:'3px 10px',fontSize:11,
          color:mode===m?'var(--info)':'var(--text2)',fontFamily:'inherit'
        }},m.charAt(0).toUpperCase()+m.slice(1)))
      )
    ),
    el('div',{style:{position:'relative',marginBottom:6}},
      /* bars */
      el('div',{style:{display:'flex',alignItems:'flex-end',gap:3,height:BAR_H}},
        entries.map(([k,v])=>{
          const ros=v/ONTARIO_STORES;
          const rc=getROS(ros);
          const h=Math.max(4,Math.round((v/chartMax)*BAR_H));
          return el('div',{key:k,style:{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:2}},
            el('div',{style:{fontSize:9,color:'var(--text2)',fontWeight:600,lineHeight:1}},v),
            el('div',{style:{fontSize:9,fontWeight:800,color:rc.tx,lineHeight:1}},rc.cls),
            el('div',{title:lbl(k)+' | '+v+' units | vel:'+ros.toFixed(4)+' | Class '+rc.cls,style:{
              width:'100%',height:h+'px',background:rc.col,
              borderRadius:'3px 3px 0 0',minHeight:4,opacity:0.88
            }})
          );
        })
      ),
      /* threshold lines — absolutely on top of bars */
      el('div',{style:{position:'absolute',inset:0,pointerEvents:'none',zIndex:10}},
        thresholds.map(t=>{
          const pxFromBottom=Math.round(t.units/chartMax*BAR_H);
          return el('div',{key:t.label,style:{
            position:'absolute',left:0,right:0,
            bottom:pxFromBottom+'px',
            borderTop:'1.5px dashed '+t.col,
          }},
            el('span',{style:{
              position:'absolute',right:2,top:-14,
              fontSize:9,fontWeight:700,color:t.col,
              background:'var(--bg)',padding:'1px 5px',
              borderRadius:3,border:'0.5px solid '+t.col,
              whiteSpace:'nowrap',
            }},t.label+' — '+t.units.toLocaleString()+' units')
          );
        })
      )
    ),
    /* week labels */
    el('div',{style:{display:'flex',gap:3}},
      entries.map(([k])=>el('div',{key:k,style:{flex:1,textAlign:'center',fontSize:9,color:'var(--text3)',whiteSpace:'nowrap',overflow:'hidden'}},lbl(k)))
    ),
    mode==='weekly'&&el('div',{style:{display:'flex',gap:8,marginTop:10,flexWrap:'wrap',alignItems:'center'}},
      ROS_CLASSES.map(r=>el('div',{key:r.cls,style:{display:'flex',alignItems:'center',gap:4,fontSize:10}},
        el('div',{style:{width:10,height:10,borderRadius:2,background:r.col}}),
        el('span',{style:{color:'var(--text2)'}},r.cls+' '+r.label)
      )),
      el('div',{style:{fontSize:9,color:'var(--text3)',marginLeft:'auto'}},'÷ '+ONTARIO_STORES.toLocaleString()+' Ontario stores')
    )
  );
}

/* ── Ontario Map (Leaflet) ── */
function OntarioMap({cityData}){
  const containerRef = React.useRef(null);
  const mapRef       = React.useRef(null);
  const markersRef   = React.useRef([]);

  // Init Leaflet once when the div mounts
  React.useEffect(()=>{
    if(!containerRef.current || mapRef.current) return;
    const L = window.L;
    if(!L){ console.warn('Leaflet not loaded'); return; }

    const map = L.map(containerRef.current,{
      center:[48.5,-84.0], zoom:5,
      zoomControl:true, scrollWheelZoom:false, attributionControl:true,
    });

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
      attribution:'&copy; <a href="https://openstreetmap.org">OpenStreetMap</a>',
      maxZoom:18,
    }).addTo(map);

    mapRef.current = map;
    return ()=>{ map.remove(); mapRef.current=null; };
  },[]);

  // Sync markers whenever cityData changes (after map is ready)
  React.useEffect(()=>{
    const L = window.L;
    const map = mapRef.current;
    if(!L || !map) return;

    markersRef.current.forEach(m=>m.remove());
    markersRef.current = [];

    const entries = Object.entries(cityData)
      .filter(([c])=>CITY_COORDS[c])
      .sort(([,a],[,b])=>a-b);
    if(!entries.length) return;

    const maxU = Math.max(...entries.map(([,v])=>v), 1);
    entries.forEach(([city,units])=>{
      const [lat,lng] = CITY_COORDS[city];
      const r   = Math.max(5, Math.min(26, 5+(units/maxU)*21));
      const pct = units/maxU;
      const col = pct>0.6?'#f0c030':pct>0.3?'#5b9bd5':'#3a7abf';
      const m = L.circleMarker([lat,lng],{
        radius:r, fillColor:col,
        color:'rgba(255,255,255,0.5)', weight:1, fillOpacity:0.85,
      })
      .bindTooltip(
        '<b style="color:'+col+'">'+city+'</b><br>'+units.toLocaleString()+' units',
        {direction:'top', offset:[0,-2]}
      )
      .addTo(map);
      markersRef.current.push(m);
    });
  });   // no dep array — runs after every render, safe because we clear first

  return el('div',null,
    el('div',{
      ref:containerRef,
      style:{height:340,borderRadius:8,overflow:'hidden',border:'0.5px solid var(--bdr)'}
    }),
    el('div',{style:{fontSize:10,color:'var(--text3)',textAlign:'center',marginTop:4}},
      'Hover a city  ·  Bubble size & colour = units sold'
    )
  );
}

/* ── Daily Line Chart ── */
function DailyLineChart({daily,brand,skuClass,launchDate,showCumulative=true}){
  if(!daily||!Object.keys(daily).length)return null;

  const CLS_COL={A:'#f0c030',B:'#4dbb6a',C:'#5b9bd5',D:'#e09b3d',E:'#e07878','New Product':'#a78bfa'};
  const lineCol=CLS_COL[skuClass]||'#5b9bd5';

  // Fill every calendar day between first and last order date with 0 if no orders
  const rawEntries=Object.entries(daily).sort(([a],[b])=>a.localeCompare(b));
  const firstDate=new Date(rawEntries[0][0]+'T00:00:00');
  const lastDate=new Date(rawEntries[rawEntries.length-1][0]+'T00:00:00');
  const dailyMap=Object.fromEntries(rawEntries);
  const allEntries=[];
  const cur=new Date(firstDate);
  while(cur<=lastDate){
    const ds=cur.toISOString().slice(0,10);
    allEntries.push([ds, dailyMap[ds]||0]);
    cur.setDate(cur.getDate()+1);
  }
  const entries=allEntries;
  const vals=entries.map(([,v])=>v);
  const maxV=Math.max(...vals,1);

  // Cumulative units
  let cum=0;
  const cumVals=vals.map(v=>{cum+=v;return cum;});
  const maxCum=Math.max(...cumVals,1);
  const W=880, H=120, PL=44, PR=12, PT=12, PB=28;
  const cW=W-PL-PR, cH=H-PT-PB;
  const n=entries.length;
  const xPos=i=>(i/(n-1||1))*cW;
  const yPos=v=>cH-(v/maxV)*cH;

  // Build SVG polyline points
  const points=entries.map(([,v],i)=>`${PL+xPos(i)},${PT+yPos(v)}`).join(' ');

  // Month labels — show first day of each month
  const monthLabels=[];
  let lastMonth='';
  entries.forEach(([date],i)=>{
    const mo=date.slice(0,7);
    if(mo!==lastMonth){
      lastMonth=mo;
      const[y,m]=mo.split('-');
      const lbl=['','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][parseInt(m)]+"'"+y.slice(2);
      monthLabels.push({lbl,x:PL+xPos(i)});
    }
  });

  // Y-axis labels
  const yTicks=[0,Math.round(maxV*0.5),maxV];

  // Tooltip state
  const [tip,setTip]=React.useState(null);

  // Milestone lines: 15, 30, 60, 90 days from launchDate
  const MILESTONE_NAMES={15:'V0',30:'V1',60:'V2',90:'V3'};
  const milestones=launchDate?[15,30,60,90].map(days=>{
    const d=new Date(launchDate+'T00:00:00');
    d.setDate(d.getDate()+days);
    const ds=d.toISOString().slice(0,10);
    // Find the closest entry index by date
    let mIdx=entries.findIndex(([date])=>date>=ds);
    if(mIdx<0){
      // Past the end of data — place at the end
      mIdx=entries.length-1;
    }
    // Snap to exact position if date matches, else interpolate
    const mx=PL+xPos(mIdx);
    return{days,x:mx,date:ds,past:ds>entries[entries.length-1][0]};
  }).filter(Boolean):[];

  // Weekly separator x positions — every Monday
  const weekSeps=[];
  entries.forEach(([date],i)=>{
    if(i===0)return;
    const d=new Date(date+'T00:00:00');
    if(d.getDay()===1) weekSeps.push(PL+xPos(i));
  });

  // Area fill points (close the polygon)
  const areaPoints=`${PL+xPos(0)},${PT+cH} ${points} ${PL+xPos(n-1)},${PT+cH}`;

  return el('div',{style:{background:'var(--bg)',border:'0.5px solid var(--bdr)',borderRadius:10,padding:'16px',marginTop:16}},
    el('div',{style:{fontSize:12,fontWeight:700,marginBottom:12,display:'flex',alignItems:'center',gap:6}},
      el('i',{className:'ti ti-chart-line',style:{color:lineCol}}),
      'Daily Orders — Full Life of SKU',
      el('span',{style:{fontSize:10,color:'var(--text3)',marginLeft:6,fontWeight:400}},
        entries[0]?.[0]+' → '+entries[entries.length-1]?.[0],
        '  ·  '+n+' order days'
      )
    ),
    el('div',{style:{position:'relative',overflowX:'auto'},
      onMouseLeave:()=>setTip(null)},
      el('svg',{
        viewBox:`0 0 ${W} ${H}`,
        style:{width:'100%',minWidth:500,display:'block'},
        onMouseMove:e=>{
          const rect=e.currentTarget.getBoundingClientRect();
          const svgX=(e.clientX-rect.left)*(W/rect.width);
          const relX=svgX-PL;
          const i=Math.round((relX/cW)*(n-1));
          if(i>=0&&i<n) setTip({i,x:PL+xPos(i),y:PT+yPos(vals[i]),date:entries[i][0],units:vals[i]});
        }
      },
        // Grid lines
        yTicks.map((v,i)=>el('g',{key:i},
          el('line',{x1:PL,y1:PT+yPos(v),x2:PL+cW,y2:PT+yPos(v),stroke:'var(--bdr)',strokeWidth:0.5,strokeDasharray:v===0?'none':'3 4'}),
          el('text',{x:PL-4,y:PT+yPos(v)+4,textAnchor:'end',fontSize:9,fill:'var(--text3)',fontFamily:'inherit'},v)
        )),
        // Area fill
        el('polygon',{points:areaPoints,fill:lineCol,opacity:0.08}),
        // Weekly separators — light vertical lines every Monday
        ...weekSeps.map((x,i)=>el('line',{key:'ws'+i,x1:x,y1:PT,x2:x,y2:PT+cH,stroke:'var(--bdr2)',strokeWidth:0.5,opacity:0.5})),
        // Cumulative units line (secondary axis, right side, lighter)
        showCumulative&&el('polyline',{
          points:entries.map((_,i)=>`${PL+xPos(i)},${PT+cH-(cumVals[i]/maxCum*cH)}`).join(' '),
          fill:'none',stroke:'rgba(255,255,255,0.12)',strokeWidth:1,
          strokeDasharray:'2 3',strokeLinecap:'round'
        }),
        showCumulative&&el('text',{x:PL+cW-2,y:PT+cH-(cumVals[cumVals.length-1]/maxCum*cH)-4,
          fontSize:9,fill:'rgba(255,255,255,0.35)',textAnchor:'end',fontFamily:'inherit'
        },cumVals[cumVals.length-1].toLocaleString()+' total'),
        // Milestone day lines
        ...milestones.map(m=>{
          if(m.past)return null;
          // Each milestone gets a slightly different colour for distinction
          const mcols={15:'#a78bfa',30:'#5b9bd5',60:'#4dbb6a',90:'#f0c030'};
          const mcol=mcols[m.days]||'#f0c030';
          const mbg={15:'#1a0f3c',30:'#0d1f3c',60:'#0d2a14',90:'#2a2200'};
          const flipLabel=m.x>W*0.82; // flip label left if near right edge
          const lx=flipLabel?m.x-34:m.x+3;
          return el('g',{key:m.days},
            el('line',{x1:m.x,y1:PT,x2:m.x,y2:PT+cH,stroke:mcol,strokeWidth:1.5,strokeDasharray:'4 3',opacity:0.85}),
            el('rect',{x:lx,y:PT+2,width:24,height:14,rx:3,fill:mbg[m.days]||'#2a2200',stroke:mcol,strokeWidth:0.5}),
            el('text',{x:lx+5,y:PT+12,fontSize:9,fill:mcol,fontWeight:700,fontFamily:'inherit'},MILESTONE_NAMES[m.days]||m.days+'d')
          );
        }),
        // Line
        el('polyline',{points,fill:'none',stroke:lineCol,strokeWidth:1.5,strokeLinejoin:'round',strokeLinecap:'round'}),
        // Month labels
        monthLabels.map((m,i)=>el('g',{key:i},
          el('line',{x1:m.x,y1:PT+cH,x2:m.x,y2:PT+cH+3,stroke:'var(--text3)',strokeWidth:0.5}),
          el('text',{x:m.x,y:H-4,textAnchor:'middle',fontSize:9,fill:'var(--text3)',fontFamily:'inherit'},m.lbl)
        )),
        // Tooltip dot + line
        tip&&el('g',null,
          el('line',{x1:tip.x,y1:PT,x2:tip.x,y2:PT+cH,stroke:'var(--bdr2)',strokeWidth:1,strokeDasharray:'3 3'}),
          el('circle',{cx:tip.x,cy:tip.y,r:4,fill:lineCol,stroke:'var(--bg)',strokeWidth:1.5}),
          el('rect',{
            x:tip.x+(tip.x>W*0.7?-96:10),y:tip.y-18,
            width:88,height:32,rx:5,
            fill:'var(--bg)',stroke:lineCol,strokeWidth:0.5
          }),
          el('text',{x:tip.x+(tip.x>W*0.7?-92:14),y:tip.y-4,fontSize:10,fontWeight:700,fill:lineCol,fontFamily:'inherit'},tip.units+' units'),
          el('text',{x:tip.x+(tip.x>W*0.7?-92:14),y:tip.y+9,fontSize:9,fill:'var(--text2)',fontFamily:'inherit'},tip.date)
        )
      )
    )
  );
}

/* ── Store Distribution Card ── */
function StoreDistributionCard({storeMetrics,vel,prevVel,clsCol}){
  if(!storeMetrics)return null;
  const wkEntries=Object.entries(storeMetrics.weekMetrics).sort(([a],[b])=>a.localeCompare(b));
  const lw=wkEntries[wkEntries.length-1]?.[1]||{};
  const repeatRate=lw.prevActive>0?Math.round(lw.repeat/lw.prevActive*100):null;
  const distPct=Math.round(storeMetrics.totalStores/ONTARIO_STORES*100);
  const velDelta=prevVel!=null?vel-prevVel:null;
  const velDeltaPct=prevVel>0?((vel-prevVel)/prevVel*100):null;

  return el('div',{style:{background:'var(--bg)',border:'0.5px solid var(--bdr)',borderRadius:10,padding:'16px',marginBottom:16}},
    el('div',{style:{fontSize:10,fontWeight:700,textTransform:'uppercase',letterSpacing:'.07em',color:'var(--text3)',marginBottom:14}},'Store Distribution & Growth'),
    el('div',{style:{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:10,marginBottom:14}},

      /* W/W Velocity Delta */
      el('div',{style:{background:'var(--bg2)',borderRadius:8,padding:'12px 14px'}},
        el('div',{style:{fontSize:10,color:'var(--text3)',marginBottom:6,fontWeight:600}},'W/W Velocity'),
        velDelta!=null?el('div',null,
          el('div',{style:{display:'flex',alignItems:'baseline',gap:6}},
            el('span',{style:{fontSize:22,fontWeight:900,color:velDelta>=0?'var(--ok)':'var(--err)',lineHeight:1}},
              (velDelta>=0?'+':'')+velDelta.toFixed(4)),
            el('i',{className:'ti '+(velDelta>=0?'ti-arrow-up-right':'ti-arrow-down-right'),style:{fontSize:16,color:velDelta>=0?'var(--ok)':'var(--err)'}})
          ),
          velDeltaPct!=null&&el('div',{style:{fontSize:11,color:velDelta>=0?'var(--ok)':'var(--err)',marginTop:3}},
            (velDeltaPct>=0?'+':'')+velDeltaPct.toFixed(1)+'% vs last week')
        ):el('div',{style:{fontSize:13,color:'var(--text3)'}},'No prior week')
      ),

      /* New Stores This Week */
      el('div',{style:{background:'var(--bg2)',borderRadius:8,padding:'12px 14px'}},
        el('div',{style:{fontSize:10,color:'var(--text3)',marginBottom:6,fontWeight:600}},'New Stores LW'),
        el('div',{style:{fontSize:22,fontWeight:900,color:lw.new>0?'var(--ok)':'var(--text3)',lineHeight:1}},lw.new||0),
        el('div',{style:{fontSize:11,color:'var(--text2)',marginTop:3}},'first-ever orders'),

function GitHubSyncPanel({data, setData, onClose, onPushed}){
  const conf = getGHConf();
  const [token,   setToken]   = React.useState(conf.token||GH_TOKEN_DEFAULT||'');
  const [autoRef, setAutoRef] = React.useState(conf.autoRefresh!==false);
  const [status,  setStatus]  = React.useState(null);
  const [busy,    setBusy]    = React.useState(false);
  const shaRef = React.useRef(conf.sha||null);

  const saveConf = (t,ar,sha)=>{
    shaRef.current = sha||shaRef.current;
    saveGHConf({token:t, autoRefresh:ar, sha:shaRef.current});
  };

  const handleTokenChange = val=>{
    setToken(val);
    saveConf(val, autoRef, shaRef.current);
  };

  const handlePull = async()=>{
    if(!token){ setStatus({ok:false,msg:'Paste your GitHub PAT below first.'}); return; }
    setBusy(true); setStatus(null);
    try{
      const result = await ghRead(token);
      if(!result){ setStatus({ok:false,msg:'No data.json found yet — use Push first to create it.'}); }
      else{
        shaRef.current = result.sha;
        saveConf(token, autoRef, result.sha);
        skipDirtyRef.current=true;
        setData(result.data);
        setStatus({ok:true, msg:'Pulled! Dashboard loaded from GitHub.'});
      }
    }catch(e){ setStatus({ok:false,msg:e.message}); }
    finally{ setBusy(false); }
  };

  const handlePush = async()=>{
    if(!token){ setStatus({ok:false,msg:'Paste your GitHub PAT below first.'}); return; }
    setBusy(true); setStatus(null);
    try{
      const latest = await ghRead(token);
      const sha = latest ? latest.sha : shaRef.current;
      const newSha = await ghWrite(token, data, sha);
      shaRef.current = newSha;
      saveConf(token, autoRef, newSha);
      if(onPushed) onPushed();
      setStatus({ok:true, msg:'Saved to GitHub! Auto-refresh re-enabled for viewers.'});
    }catch(e){ setStatus({ok:false,msg:e.message}); }
    finally{ setBusy(false); }

    setAutoRef(val);
    saveConf(token, val, shaRef.current);

/* ══════════════════════════════════════════
   UPDATE SKU SALES DATA — Excel Upload
   Parses .xlsx and refreshes post-launch data
   for the selected product
══════════════════════════════════════════ */

function parseExcelSalesData(buffer, existingProdName){
  const XLSX = window.XLSX;
  if(!XLSX) throw new Error('SheetJS not loaded. Please refresh the page.');

  const wb = XLSX.read(buffer, {type:'array', cellDates:true});
  const ws = wb.Sheets[wb.SheetNames[0]];
  // raw:true → numbers stay numbers, dates stay Date objects
  const rows = XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:''});

  if(rows.length < 2) throw new Error('No data rows found in file.');

  // ── Map columns by header name (exact OCS format) ──
  // Expected: SKU[0] | Item Name[1] | Category[2] | Sub Category[3] | Brand[4] |
  //           Vendor ID[5] | Vendor Name[6] | Store Name[7] | Store Address[8] |
  //           Region[9] | City[10] | Order Date[11] | Order Type[12] | Units Sold[13] | Barcode[14]
  // OCS export format is always fixed — hardcode indices
  // [0]SKU [1]Item Name [2]Category [3]Sub Category [4]Brand [5]Vendor ID
  // [6]Vendor Name [7]Store Name [8]Store Address [9]Region [10]City
  // [11]Order Date [12]Order Type [13]Units Sold [14]Item Barcode
  const hdrs = rows[0].map(h=>String(h||'').trim());
  
  // Verify we have the right format by checking key headers
  const hdrStr = hdrs.join('|');
  if(!hdrStr.includes('Item Name')) throw new Error('Cannot find "Item Name" column. Is this an OCS sales export? Headers: '+hdrs.join(', '));
  if(!hdrStr.includes('Units Sold')) throw new Error('Cannot find "Units Sold" column.');
  if(!hdrStr.includes('Order Date')) throw new Error('Cannot find "Order Date" column.');

  // Always use fixed positions — never guess
  const iName=1, iBrand=4, iStore=7, iRegion=9, iCity=10, iDate=11, iUnits=13;
  
  // Safety: verify the headers actually match at these positions
  console.log('Header check:', {
    iName:  hdrs[iName],    // should be "Item Name"
    iBrand: hdrs[iBrand],   // should be "Brand"
    iStore: hdrs[iStore],   // should be "Store Name"
    iRegion:hdrs[iRegion],  // should be "Region"
    iCity:  hdrs[iCity],    // should be "City"
    iDate:  hdrs[iDate],    // should be "Order Date"
    iUnits: hdrs[iUnits],   // should be "Units Sold"
  });

  // ── Get distinct product names ──
  const productNames=[...new Set(
    rows.slice(1).filter(r=>r[iName]).map(r=>String(r[iName]).trim())
  )];

  // Match to existing product name
  let targetName=existingProdName;
  if(productNames.length===1){
    targetName=productNames[0];
  } else {
    const kw=existingProdName.split(' ').slice(0,3).join(' ').toLowerCase();
    const match=productNames.find(n=>
      n.toLowerCase().includes(kw)||kw.includes(n.split(' ').slice(0,3).join(' ').toLowerCase())
    );
    if(match) targetName=match;
  }

  const dataRows=rows.slice(1).filter(r=>
    r[iName]&&String(r[iName]).trim()===targetName
  );

  if(dataRows.length===0)
    throw new Error('No rows for "'+targetName+'". Products in file: '+productNames.join(', '));

  // ── Aggregate ──
  const cities={}, stores={}, regions={}, weeks={}, months={}, daily={}, storeWeeks={};
  let totalUnits=0, totalOrders=0, brand='';

  dataRows.forEach(row=>{
    // Units Sold — always a small integer (never > 10,000 per order)
    let units=0;
    const rawUnits=row[iUnits];
    if(typeof rawUnits==='number'){
      units=Math.round(rawUnits);
    } else {
      units=parseInt(String(rawUnits||'0').replace(/[^0-9]/g,''))||0;
    }
    // Sanity check — if units looks like a barcode/ID (>50000), skip row
    if(units<=0||units>50000) return;

    const city  = String(row[iCity]  ||'Unknown').trim();
    const store = String(row[iStore] ||'Unknown').trim();
    const reg   = String(row[iRegion]||'').trim();
    if(iBrand>=0&&row[iBrand]) brand=String(row[iBrand]).trim();

    cities[city]  = (cities[city]  ||0)+units;
    stores[store] = (stores[store] ||0)+units;
    if(reg) regions[reg]=(regions[reg]||0)+units;
    totalUnits+=units;
    totalOrders++;

    // ── Date parsing ──
    const raw=row[iDate];
    let d=null;
    if(raw instanceof Date&&!isNaN(raw)){
      d=raw;
    } else if(typeof raw==='number'&&raw>0){
      // Excel serial number
      try{
        const pd=XLSX.SSF.parse_date_code(raw);
        if(pd) d=new Date(pd.y, pd.m-1, pd.d);
      }catch(e){}
    } else if(typeof raw==='string'&&raw.trim()){
      d=new Date(raw);
      if(isNaN(d)) d=null;
    }

    if(d&&!isNaN(d)){
      const yr=d.getFullYear(), mo=d.getMonth(), dy=d.getDate();
      const ds=yr+'-'+String(mo+1).padStart(2,'0')+'-'+String(dy).padStart(2,'0');
      const moStr=ds.slice(0,7);
      // ISO week number
      const utc=new Date(Date.UTC(yr,mo,dy));
      const dow=utc.getUTCDay()||7;
      utc.setUTCDate(utc.getUTCDate()+4-dow);
      const y1=new Date(Date.UTC(utc.getUTCFullYear(),0,1));
      const wkN=Math.ceil((((utc-y1)/86400000)+1)/7);
      const wk=utc.getUTCFullYear()+'-W'+String(wkN).padStart(2,'0');

      daily[ds]  =(daily[ds]  ||0)+units;
      weeks[wk]  =(weeks[wk]  ||0)+units;
      months[moStr]=(months[moStr]||0)+units;
      if(!storeWeeks[store]) storeWeeks[store]=new Set();
      storeWeeks[store].add(wk);
    }
  });

  // ── Store metrics per week ──
  const allWeeks=Object.keys(weeks).sort();
  const storeFirst={};
  Object.entries(storeWeeks).forEach(([s,ws2])=>{
    storeFirst[s]=Array.from(ws2).sort()[0];
  });
  let prev=new Set(); const weekMetrics={};
  allWeeks.forEach(wk=>{
    const active=new Set(
      Object.entries(storeWeeks).filter(([,ws2])=>ws2.has(wk)).map(([s])=>s)
    );
    const newS=new Set([...active].filter(s=>storeFirst[s]===wk));
    const repeat=new Set([...active].filter(s=>prev.has(s)));
    weekMetrics[wk]={active:active.size,new:newS.size,repeat:repeat.size,prevActive:prev.size};
    prev=active;
  });

  console.log('Parsed:', {totalUnits, totalOrders, stores:Object.keys(stores).length, weeks:allWeeks});

  return {
    detectedName: targetName,
    productNames,
    data:{
      brand,
      units: totalUnits,
      orders: totalOrders,
      storeCount: Object.keys(stores).length,
      cities:  Object.fromEntries(Object.entries(cities).sort(([,a],[,b])=>b-a)),
      stores:  Object.fromEntries(Object.entries(stores).sort(([,a],[,b])=>b-a)),
      regions,
      weekly:  Object.fromEntries(Object.entries(weeks).sort()),
      monthly: Object.fromEntries(Object.entries(months).sort()),
      daily:   Object.fromEntries(Object.entries(daily).sort()),
      storeMetrics:{
        weekMetrics,
        totalStores:Object.keys(stores).length,
        opportunity:Math.max(0,ONTARIO_STORES-Object.keys(stores).length)
      },
    }
  };
}

/* ── Bulk Upload Modal ── */
function BulkUploadModal({salesData,onUpdate,onClose}){
  const [results,setResults]=React.useState(null);
  const [busy,setBusy]=React.useState(false);
  const [err,setErr]=React.useState('');
  const fileRef=React.useRef();

  const handleFile=async(file)=>{
    if(!file) return;
    if(!file.name.match(/\.(xlsx|xls)$/i)){setErr('Please upload an Excel file (.xlsx or .xls)');return;}
    setBusy(true); setErr(''); setResults(null);
    try{
      const buf=await file.arrayBuffer();
      const XLSX=window.XLSX;
      const wb=XLSX.read(buf,{type:'array',cellDates:true});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true});
      if(rows.length<2) throw new Error('No data found in file.');
      const hdrs=rows[0].map(h=>String(h||'').trim());
      if(!hdrs.includes('Item Name')) throw new Error('Cannot find "Item Name" column.');
      // Get all distinct products in this file
      const allNames=[...new Set(rows.slice(1).filter(r=>r[1]).map(r=>String(r[1]).trim()))];
      const parsed=[];
      for(const pName of allNames){
        try{
          const result=parseExcelSalesData(buf,pName);
          parsed.push({name:pName,detected:result.detectedName,data:result.data,matched:!!salesData[pName]});
        }catch(e){
          parsed.push({name:pName,err:e.message});
        }
      }
      setResults(parsed);
    }catch(e){ setErr(e.message); }
    setBusy(false);
  };

  const applyAll=()=>{
    if(!results) return;
    const lu={};
    results.filter(r=>!r.err&&r.matched).forEach(r=>{
      const existing=salesData[r.name]||{};
      onUpdate(r.name,{...existing,...r.data,pc:existing.pc,launchDate:existing.launchDate,ocs:existing.ocs},lu);
      lu[r.name]=new Date().toISOString();
    });
    onClose();
  };

  const matched=results?.filter(r=>!r.err&&r.matched)||[];
  const unmatched=results?.filter(r=>!r.err&&!r.matched)||[];
  const errored=results?.filter(r=>r.err)||[];

  return el('div',{style:{position:'fixed',inset:0,background:'rgba(0,0,0,0.4)',zIndex:600,display:'flex',alignItems:'center',justifyContent:'center',padding:20},onClick:e=>e.target===e.currentTarget&&onClose()},
    el('div',{style:{background:'var(--bg)',border:'1px solid var(--bdr2)',borderRadius:'var(--r)',width:'100%',maxWidth:540,maxHeight:'85vh',display:'flex',flexDirection:'column',boxShadow:'0 8px 40px rgba(0,0,0,0.45)'}},
      el('div',{style:{padding:'14px 18px',borderBottom:'0.5px solid var(--bdr)',display:'flex',alignItems:'center',justifyContent:'space-between',flexShrink:0}},
        el('div',{style:{fontSize:15,fontWeight:800,display:'flex',alignItems:'center',gap:8}},
          el('i',{className:'ti ti-table-import',style:{color:'var(--ok)',fontSize:18}}), 'Bulk Upload — All SKUs'
        ),
        el('button',{onClick:onClose,style:{background:'none',border:'none',cursor:'pointer',color:'var(--text3)',fontSize:18}},el('i',{className:'ti ti-x'}))
      ),
      el('div',{style:{flex:1,overflowY:'auto',padding:'20px'}},
        !results&&el('div',null,
          el('div',{style:{background:'var(--ok-bg)',border:'0.5px solid var(--ok)',borderRadius:8,padding:'10px 14px',marginBottom:16,fontSize:12,color:'var(--ok)'}},
            el('i',{className:'ti ti-info-circle',style:{marginRight:6}}),
            'Upload one Excel file with multiple SKUs — the dashboard will detect each product automatically and update all matching SKUs at once.'
          ),
          el('div',{onDragOver:e=>e.preventDefault(),onDrop:e=>{e.preventDefault();handleFile(e.dataTransfer.files[0]);},onClick:()=>fileRef.current.click(),style:{border:'2px dashed var(--ok)',borderRadius:10,padding:'36px 20px',textAlign:'center',cursor:'pointer',background:'var(--ok-bg)',marginBottom:14}},
            el('i',{className:'ti ti-table-import',style:{fontSize:36,color:'var(--ok)',display:'block',marginBottom:10}}),
            el('div',{style:{fontSize:14,fontWeight:600,color:'var(--ok)',marginBottom:4}},'Drop Excel file here'),
            el('div',{style:{fontSize:11,color:'var(--text3)'}},'Multiple SKUs in one file · OCS export format'),
            el('input',{ref:fileRef,type:'file',accept:'.xlsx,.xls',style:{display:'none'},onChange:e=>handleFile(e.target.files[0])})
          ),
          busy&&el('div',{style:{textAlign:'center',color:'var(--text2)',fontSize:12,display:'flex',alignItems:'center',justifyContent:'center',gap:8}},
            el('i',{className:'ti ti-loader-2',style:{animation:'spin 1s linear infinite',fontSize:16}}),' Parsing all SKUs…'
          ),
          err&&el('div',{style:{padding:'10px 14px',borderRadius:8,fontSize:12,background:'var(--err-bg)',color:'var(--err)',display:'flex',alignItems:'flex-start',gap:8}},
            el('i',{className:'ti ti-alert-circle',style:{flexShrink:0}}),err)
        ),
        results&&el('div',null,
          matched.length>0&&el('div',{style:{marginBottom:16}},
            el('div',{style:{fontSize:11,fontWeight:700,color:'var(--ok)',textTransform:'uppercase',letterSpacing:'.06em',marginBottom:8}},
              el('i',{className:'ti ti-check'}),' '+matched.length+' SKUs Ready to Update'
            ),
            matched.map(r=>el('div',{key:r.name,style:{background:'var(--ok-bg)',border:'0.5px solid var(--ok)',borderRadius:7,padding:'8px 12px',marginBottom:6,fontSize:12}},
              el('div',{style:{fontWeight:600,color:'var(--ok)'}},r.name),
              el('div',{style:{color:'var(--text3)',marginTop:2}},
                r.data.units.toLocaleString()+' units · '+r.data.orders+' orders · '+r.data.storeCount+' stores · '+Object.keys(r.data.weekly).length+' weeks'
              )
            ))
          ),
          unmatched.length>0&&el('div',{style:{marginBottom:12}},
            el('div',{style:{fontSize:11,fontWeight:700,color:'var(--warn)',textTransform:'uppercase',letterSpacing:'.06em',marginBottom:8}},
              el('i',{className:'ti ti-alert-triangle'}),' '+unmatched.length+' SKUs Not Found in Dashboard'
            ),
            unmatched.map(r=>el('div',{key:r.name,style:{background:'var(--warn-bg)',border:'0.5px solid var(--warn)',borderRadius:7,padding:'8px 12px',marginBottom:6,fontSize:12,color:'var(--warn)'}},r.name))
          ),
          errored.length>0&&el('div',{style:{marginBottom:12}},
            errored.map(r=>el('div',{key:r.name,style:{background:'var(--err-bg)',border:'0.5px solid var(--err)',borderRadius:7,padding:'8px 12px',marginBottom:6,fontSize:12,color:'var(--err)'}},
              el('div',{style:{fontWeight:600}},r.name),el('div',null,r.err)
            ))
          ),
          matched.length>0&&el('button',{onClick:applyAll,style:{
            width:'100%',background:'var(--ok)',border:'none',borderRadius:8,
            padding:'12px',fontSize:14,fontFamily:'inherit',color:'#fff',fontWeight:700,cursor:'pointer',
            display:'flex',alignItems:'center',justifyContent:'center',gap:8
          }},el('i',{className:'ti ti-check'}),' Apply All ('+matched.length+' SKUs)'),
          matched.length===0&&el('div',{style:{textAlign:'center',color:'var(--warn)',padding:'10px 0',fontSize:12}},'No matching SKUs found. Make sure product names match the dashboard.')
        )
      )
    )
  );
}

/* ── Change Log ── */
const CL_KEY='au_changelog_v1';
const getChangelog=()=>{try{return JSON.parse(localStorage.getItem(CL_KEY))||[];}catch{return [];}};
const addChangelogEntry=(action,product='')=>{
  const log=getChangelog();
  log.unshift({ts:new Date().toISOString(),action,product,user:'You'});
  if(log.length>100) log.splice(100);
  try{localStorage.setItem(CL_KEY,JSON.stringify(log));}catch{}
};

function PostLaunchView({data}){
  // data = launch dashboard data (for reading launchDate from product tasks)
  const [salesData,setSalesData]=React.useState(()=>{
    try{const s=localStorage.getItem('au_pl_data');return s?JSON.parse(s):SALES_DATA_DEFAULT;}
    catch{return SALES_DATA_DEFAULT;}
  });
  const [hidden,setHidden]=React.useState(()=>{
    try{const s=localStorage.getItem('au_pl_hidden');return s?JSON.parse(s):[];}
    catch{return [];}
  });
  const [sel,setSel]=React.useState(Object.keys(SALES_DATA_DEFAULT)[0]||'');
  const [activePC,setActivePC]=React.useState('pc1');
  const [showAddSKU,setShowAddSKU]=React.useState(false);
  const [showUpdateSKU,setShowUpdateSKU]=React.useState(false);
  const [showBulkUpload,setShowBulkUpload]=React.useState(false);
  const [showChangelog,setShowChangelog]=React.useState(false);
  const [lastUpdated,setLastUpdated]=React.useState(()=>{
    try{return JSON.parse(localStorage.getItem('au_pl_lastupdated')||'{}');}catch{return {};}
  });

  const saveHidden=h=>{setHidden(h);try{localStorage.setItem('au_pl_hidden',JSON.stringify(h));}catch{}};
  const removeProduct=name=>saveHidden([...hidden,name]);
  const restoreProduct=name=>saveHidden(hidden.filter(h=>h!==name));

  // PC groupings matching the launch dashboard tabs
  const PC_GROUPS=[
    {id:'pc1',label:'PC#1 2026'},
    {id:'pc2',label:'PC#2 2026'},
    {id:'pc3',label:'PC#3 2026'},
    {id:'other',label:'Other SKUs'},
  ];

  // Resolve launchDate: prefer the launch dashboard product's launchDate, fallback to SALES_DATA
  const getEffectiveLaunchDate=(name,sdProd)=>{
    // 1. Try to find matching product in launch dashboard by name similarity
    for(const pcKey of Object.keys(data)){
      if(!Array.isArray(data[pcKey]))continue;
      const match=data[pcKey].find(p=>
        p.name&&name&&(
          name.toLowerCase().includes(p.shortName?.toLowerCase())||
          p.name.toLowerCase().includes(name.split(' ').slice(0,3).join(' ').toLowerCase())
        )
      );
      if(match&&match.launchDate)return match.launchDate;
    }
    // 2. Fall back to launchDate on the sales data product itself
    if(sdProd?.launchDate)return sdProd.launchDate;
    // 3. Fall back to OCS first receipt date
    if(sdProd?.ocs?.firstReceipt)return sdProd.ocs.firstReceipt;
    return '';
  };

  // Products grouped by PC
  const allNames=Object.keys(salesData).filter(k=>!hidden.includes(k));
  const grouped=PC_GROUPS.map(pc=>({
    ...pc,
    products:allNames.filter(name=>(salesData[name]?.pc||'other')===pc.id)
  })).filter(g=>g.products.length>0||(g.id===activePC));

  // If active PC has no products, auto-select first PC that does
  React.useEffect(()=>{
    const firstWithProducts=grouped.find(g=>g.products.length>0);
    if(firstWithProducts&&!grouped.find(g=>g.id===activePC)?.products?.length){
      setActivePC(firstWithProducts.id);
    }
  },[]);

  const activeGroup=grouped.find(g=>g.id===activePC);
  const visibleProds=activeGroup?.products||[];

  // Auto-select first product in active PC if current sel not in this PC
  React.useEffect(()=>{
    if(visibleProds.length>0&&!visibleProds.includes(sel)){
      setSel(visibleProds[0]);
    }
  },[activePC]);

  const current=salesData[sel];
  // Use SALES_DATA_DEFAULT launchDate (first order date) as priority for milestone markers
  // Falls back to OCS firstReceipt, then dashboard launch date
  const effectiveLaunchDate=current?(
    SALES_DATA_DEFAULT[sel]?.launchDate ||
    current?.launchDate ||
    current?.ocs?.firstReceipt ||
    getEffectiveLaunchDate(sel,current) ||
    ''
  ):'';

  if(Object.keys(salesData).filter(k=>!hidden.includes(k)).length===0)
    return el('div',{style:{padding:40,textAlign:'center',color:'var(--text2)'}},
      el('i',{className:'ti ti-chart-off',style:{fontSize:36,display:'block',marginBottom:12,opacity:.4}}),
      'All products hidden.',el('br',null),
      el('div',{style:{marginTop:16,display:'flex',gap:8,justifyContent:'center',flexWrap:'wrap'}},
        hidden.map(name=>el('button',{key:name,onClick:()=>restoreProduct(name),className:'btn'},el('i',{className:'ti ti-eye'}),' '+name.slice(0,30)))
      )
    );

  return el('div',{style:{padding:'20px'}},
    /* ── PC Tab bar ── */
    el('div',{style:{display:'flex',gap:0,borderBottom:'0.5px solid var(--bdr)',marginBottom:16,overflowX:'auto'}},
      PC_GROUPS.map(pc=>{
        const count=Object.keys(salesData).filter(k=>!hidden.includes(k)&&(salesData[k]?.pc||'other')===pc.id).length;
        if(count===0)return null;
        const isOn=activePC===pc.id;
        return el('button',{key:pc.id,onClick:()=>setActivePC(pc.id),style:{
          background:'transparent',border:'none',
          borderBottom:isOn?'2.5px solid var(--info)':'2.5px solid transparent',
          cursor:'pointer',padding:'8px 18px',fontSize:13,fontFamily:'inherit',
          color:isOn?'var(--info)':'var(--text2)',fontWeight:isOn?700:'normal',
          display:'flex',alignItems:'center',gap:7,whiteSpace:'nowrap',
          marginBottom:-1,
        }},
          pc.label,
          el('span',{style:{fontSize:10,background:isOn?'var(--info-bg)':'var(--bg2)',color:isOn?'var(--info)':'var(--text3)',borderRadius:10,padding:'1px 7px',fontWeight:700}},count)
        );
      })
    ),

    /* ── Product cards for active PC ── */
    el('div',{style:{marginBottom:20}},
      el('div',{style:{display:'flex',gap:10,flexWrap:'wrap',alignItems:'flex-start'}},
        visibleProds.map(name=>{
          const d=salesData[name];const isOn=sel===name;
          return el('div',{key:name,style:{position:'relative',display:'inline-block'}},
            el('div',{onClick:()=>setSel(name),style:{
              background:isOn?'var(--info-bg)':'var(--bg)',
              border:'0.5px solid '+(isOn?'var(--info)':'var(--bdr)'),
              borderRadius:10,padding:'12px 16px',cursor:'pointer',minWidth:190,
              boxShadow:isOn?'0 0 0 1px var(--info)':'none',transition:'all .12s'
            }},
              el('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:4}},
                el('div',{style:{fontSize:10,color:isOn?'var(--info)':'var(--text3)',fontWeight:700,textTransform:'uppercase',letterSpacing:'.07em'}},d.brand),
                (()=>{
                  const sw=Object.entries(d.weekly||{}).sort(([a],[b])=>a.localeCompare(b));
                  const lw=sw.length>=1?sw[sw.length-1][1]:0;
                  const pw=sw.length>=2?sw[sw.length-2][1]:null;
                  if(pw==null) return null;
                  const delta=lw-pw;
                  return el('span',{style:{fontSize:10,fontWeight:700,color:delta>=0?'var(--ok)':'var(--err)'}},
                    el('i',{className:'ti '+(delta>=0?'ti-trending-up':'ti-trending-down'),style:{fontSize:10}}),
                    ' '+(delta>=0?'+':'')+delta
                  );
                })()
              ),
              el('div',{style:{fontSize:13,fontWeight:700,color:isOn?'var(--info)':'var(--text)',marginBottom:6,lineHeight:1.3}},name),
              el('div',{style:{display:'flex',gap:8,fontSize:11,color:isOn?'var(--info)':'var(--text2)',flexWrap:'wrap',alignItems:'center'}},
                el('span',null,d.units.toLocaleString()+' units'),
                el('span',null,d.storeCount+' stores'),
                (()=>{
                  const skuClass=(()=>{const sw=Object.entries(d.weekly||{}).sort(([a],[b])=>a.localeCompare(b));const lw=sw.length?sw[sw.length-1][1]:0;const v=lw/ONTARIO_STORES;return v>=8?'A':v>=3?'B':v>=0.8?'C':v>=0.2?'D':'E';})();
                  const CLS_C={A:'#f0c030',B:'#4dbb6a',C:'#5b9bd5',D:'#e09b3d',E:'#e07878'};
                  return el('span',{style:{fontWeight:800,color:CLS_C[skuClass]||'var(--text3)',fontSize:12}},'Class '+skuClass);
                })()
              ),
              lastUpdated[name]&&el('div',{style:{fontSize:9,color:'var(--text3)',marginTop:4}},
                el('i',{className:'ti ti-refresh',style:{fontSize:9}}),
                ' Updated '+new Date(lastUpdated[name]).toLocaleDateString('en-CA',{month:'short',day:'numeric'})
              )
            ),
            el('button',{onClick:e=>{e.stopPropagation();if(confirm('Remove "'+name+'" from Post Launch?'))removeProduct(name);},
              title:'Remove',className:'rm-btn',
              style:{position:'absolute',top:-6,right:-6,background:'var(--bg2)',border:'0.5px solid var(--bdr2)',borderRadius:'50%',width:20,height:20,cursor:'pointer',display:'none',alignItems:'center',justifyContent:'center',color:'var(--text3)',fontSize:11,padding:0}
            },el('i',{className:'ti ti-x'})),
            isOn&&el('button',{onClick:e=>{e.stopPropagation();setSel(name);setShowUpdateSKU(true);},
              title:'Update sales data',
              style:{position:'absolute',bottom:-6,right:-6,background:'var(--ok)',border:'none',borderRadius:'50%',width:22,height:22,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',color:'#fff',fontSize:11,padding:0,boxShadow:'0 1px 4px rgba(0,0,0,.3)'}
            },el('i',{className:'ti ti-refresh'}))
          );
        }),
        /* Restore hidden products in this PC */
        hidden.filter(name=>(salesData[name]?.pc||'other')===activePC).map(name=>
          el('button',{key:name,onClick:()=>restoreProduct(name),style:{
            background:'var(--bg2)',border:'0.5px dashed var(--bdr2)',borderRadius:8,
            cursor:'pointer',padding:'8px 12px',fontSize:11,color:'var(--text2)',
            fontFamily:'inherit',display:'flex',alignItems:'center',gap:5

        ),
        /* Bulk upload button */
        el('button',{onClick:()=>setShowBulkUpload(true),style:{
          background:'var(--bg)',border:'0.5px dashed var(--ok)',borderRadius:10,
          padding:'12px 16px',cursor:'pointer',minWidth:160,
          display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',
          gap:6,color:'var(--ok)',fontFamily:'inherit',transition:'all .12s'
        }},

          el('span',{style:{fontSize:11,fontWeight:600}},'Bulk Upload')

          padding:'12px 16px',cursor:'pointer',minWidth:160,

          el('span',{style:{fontSize:11,fontWeight:600}},'Add SKU')
