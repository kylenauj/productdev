      err&&el('div',{style:{fontSize:11,color:'var(--err)',marginBottom:10}},

      el('button',{onClick:submit,style:{
        width:'100%',background:'var(--grad-accent)',border:'none',

        fontFamily:'inherit',color:'#fff',fontWeight:700,cursor:'pointer',

}
function WorkloadViewComp({data,setView,setSels,setProdView}){

    const [expandedOwner,setExpandedOwner]=React.useState(null);

    const allProds=[...data.pcTabs.flatMap(tab=>(data[tab.id]||[]).map(p=>({...p,pc:tab.id,pcLabel:tab.label}))), ...(data.in_dev||[]).map(p=>({...p,pc:'in_dev',pcLabel:'In Development'}))];

    // Build per-owner task list with full context
    const ownerMap={};
    allProds.forEach(p=>p.tasks.forEach(t=>{
      const o=t.owner||'Unassigned';
      if(!ownerMap[o]) ownerMap[o]={tasks:[],done:0,overdue:0,inProgress:0,notStarted:0,dueThisWeek:0};
      const d=ownerMap[o];
      d.tasks.push({...t,prodName:p.shortName||p.name,prodId:p.id,pcId:p.pc,pcLabel:p.pcLabel});
      if(t.status==='Done') d.done++;
      else if(isOverdue(t)){d.overdue++;} 
      else if(t.status==='In Progress') d.inProgress++;
      else d.notStarted++;
      // Due this week
      if(t.end&&t.status!=='Done'){
        const diff=Math.round((new Date(t.end+'T00:00:00')-TODAY_D)/86400000);
        if(diff>=0&&diff<=7) d.dueThisWeek++;
      }
    }));

    const owners=Object.entries(ownerMap)
      .sort(([,a],[,b])=>b.overdue-a.overdue||b.dueThisWeek-b.notStarted-(a.dueThisWeek-a.notStarted));

    // Tasks due this week across everyone
    const dueThisWeek=allProds.flatMap(p=>p.tasks
      .filter(t=>t.status!=='Done'&&t.end)
      .map(t=>{
        const diff=Math.round((new Date(t.end+'T00:00:00')-TODAY_D)/86400000);
        return diff>=0&&diff<=7?{...t,prodName:p.shortName||p.name,prodId:p.id,pcId:p.pc,pcLabel:p.pcLabel,daysLeft:diff}:null;
      })
      .filter(Boolean)
    ).sort((a,b)=>a.daysLeft-b.daysLeft);

    // Overdue tasks
    const overdueAll=allProds.flatMap(p=>p.tasks
      .filter(t=>isOverdue(t))
      .map(t=>({...t,prodName:p.shortName||p.name,prodId:p.id,pcId:p.pc,pcLabel:p.pcLabel}))
    ).sort((a,b)=>(a.end||'').localeCompare(b.end||''));

    const jumpTo=(pcId,prodId)=>{
      setView(pcId); setSels(s=>({...s,[pcId]:prodId})); setProdView('detail');
    };

    const TaskRow=({t,showProd=true})=>{
      const od=isOverdue(t);
      const diff=t.end?Math.round((new Date(t.end+'T00:00:00')-TODAY_D)/86400000):null;
      const urgentSoon=diff!=null&&diff>=0&&diff<=7;
      const col=od?'var(--err)':urgentSoon?'var(--warn)':t.status==='In Progress'?'var(--info)':'var(--text3)';
      return el('div',{style:{
        display:'flex',alignItems:'center',gap:10,padding:'7px 14px',
        borderBottom:'1px solid var(--bdr)',
        background:od?'rgba(224,96,96,.03)':urgentSoon?'rgba(224,155,61,.03)':'transparent'
      }},
        el('div',{style:{width:8,height:8,borderRadius:'50%',background:col,flexShrink:0}}),
        el('div',{style:{flex:1,minWidth:0}},
          el('div',{style:{fontSize:12,color:'var(--text)',fontWeight:500,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},t.name),
          showProd&&el('div',{style:{fontSize:10,color:'var(--text3)',marginTop:1}},
            t.pcLabel,' · ',el('span',{style:{color:'var(--info)',cursor:'pointer'},onClick:()=>jumpTo(t.pcId,t.prodId)},t.prodName,' ↗')
          )
        ),
        el('div',{style:{display:'flex',align:'center',gap:8,flexShrink:0}},
          t.end&&el('span',{style:{fontSize:10,fontWeight:600,color:col}},
            od?'Overdue '+(Math.abs(diff))+'d':urgentSoon?'Due in '+diff+'d':new Date(t.end+'T00:00:00').toLocaleDateString('en-CA',{month:'short',day:'numeric'})
          ),
          el('span',{style:{
            fontSize:9,padding:'2px 6px',borderRadius:3,fontWeight:600,
            background:t.status==='Done'?'var(--ok-bg)':t.status==='In Progress'?'var(--info-bg)':'var(--bg3)',
            color:t.status==='Done'?'var(--ok)':t.status==='In Progress'?'var(--info)':'var(--text3)'
          }},t.status)
        )
      );
    };

    return el('div',{style:{padding:'24px'}},
      el('h2',{style:{fontSize:18,fontWeight:700,fontFamily:'var(--font-mono)',marginBottom:6,color:'var(--text)'}},'Team Workload'),
      el('div',{style:{fontSize:12,color:'var(--text3)',marginBottom:20}},new Date().toLocaleDateString('en-CA',{weekday:'long',month:'long',day:'numeric'})),

      el('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16,marginBottom:20}},

        /* ── Overdue tasks ── */
        el('div',{style:{background:'var(--bg)',border:'1px solid var(--err-dim)',borderRadius:'var(--r)',overflow:'hidden'}},
          el('div',{style:{padding:'10px 14px',background:'var(--err-bg)',borderBottom:'1px solid var(--err-dim)',display:'flex',alignItems:'center',justifyContent:'space-between'}},
            el('div',{style:{fontSize:11,fontWeight:700,textTransform:'uppercase',letterSpacing:'.07em',color:'var(--err)',display:'flex',alignItems:'center',gap:6}},
              el('i',{className:'ti ti-alert-triangle'}), 'Overdue Tasks'
            ),
            el('span',{style:{fontSize:18,fontWeight:900,color:'var(--err)'}},overdueAll.length)
          ),
          overdueAll.length===0
            ? el('div',{style:{padding:'16px',fontSize:12,color:'var(--ok)',textAlign:'center',display:'flex',alignItems:'center',justifyContent:'center',gap:6}},
                el('i',{className:'ti ti-circle-check'}),' All clear!'
              )
            : el('div',{style:{maxHeight:280,overflowY:'auto'}},
                overdueAll.map((t,i)=>el(TaskRow,{key:i,t}))
              )
        ),

        /* ── Due this week ── */
        el('div',{style:{background:'var(--bg)',border:'1px solid var(--warn-dim)',borderRadius:'var(--r)',overflow:'hidden'}},

              ),

            ),

            el('div',{style:{height:5,background:'var(--bg3)',display:'flex',borderRadius:'var(--pill)',overflow:'hidden',margin:'0 2px'}},
              el('div',{style:{width:(d.done/Math.max(d.tasks.length,1)*100)+'%',background:RAG==='red'?'var(--grad-err)':RAG==='amber'?'var(--grad-warn)':'var(--grad-ok)',transition:'width .3s'}}),
              el('div',{style:{width:(d.inProgress/Math.max(d.tasks.length,1)*100)+'%',background:'var(--info)',opacity:.4}})
            ),
            /* Expanded task list */
            isExp&&el('div',{style:{borderTop:'1px solid var(--bdr)'}},
              el('div',{style:{padding:'6px 14px',background:'var(--bg2)',display:'flex',gap:16,fontSize:10}},
                el('span',{style:{color:'var(--err)',fontWeight:600}},d.overdue+' overdue'),

                el('span',{style:{color:'var(--text3)'}},d.notStarted+' not started'),
                el('span',{style:{color:'var(--ok)',fontWeight:600}},d.done+' done')
              ),
              active.sort((a,b)=>{
                const aOd=isOverdue(a)?-2:0, bOd=isOverdue(b)?-2:0;
                const aip=a.status==='In Progress'?-1:0, bip=b.status==='In Progress'?-1:0;
                return (aOd+aip)-(bOd+bip);
              }).map((t,i)=>el(TaskRow,{key:i,t})),
              d.done>0&&el('div',{style:{padding:'6px 14px',fontSize:10,color:'var(--text3)',borderTop:'1px solid var(--bdr)',fontStyle:'italic'}},
                d.done+' completed task'+(d.done>1?'s':'')+' hidden'
              )
            )
          );
        })
      )
    );
}

  useEffect(()=>{

          el('i',{className:'ti ti-chart-line'}), 'Post Launch'
        ),
        el('button',{className:'sidebar-item '+(view==='macro'?'active':''),onClick:()=>setView('macro')},
          el('i',{className:'ti ti-layout-kanban'}), 'Macro Timeline'
        ),
        el('button',{className:'sidebar-item '+(view==='workload'?'active':''),onClick:()=>setView('workload')},
          el('i',{className:'ti ti-users'}), 'Team Workload'
        )
      ),

      /* Sidebar footer */
      el('div',{className:'sidebar-footer'},
        el('div',{style:{display:'flex',alignItems:'center',gap:8,padding:'4px 10px',marginBottom:4}},
          el('i',{className:'ti ti-building-store',style:{fontSize:12,color:'var(--text3)'}}),
          el('span',{style:{fontSize:11,color:'var(--text3)'}},'Stores:'),
          el('input',{type:'number',key:'sc-'+storeCountVer,defaultValue:ONTARIO_STORES,min:1,max:99999,
            style:{width:50,background:'transparent',border:'none',outline:'none',fontSize:12,fontWeight:700,color:'var(--accent)',fontFamily:'inherit',textAlign:'center',MozAppearance:'textfield'},
            onChange:ev=>{const v=parseInt(ev.target.value);if(v>0){ONTARIO_STORES=v;saveStoreCount(v);setStoreCountVer(n=>n+1);}}
          })
        ),
        el('button',{className:'sidebar-footer-btn',onClick:()=>{const b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='au_backup_'+new Date().toISOString().slice(0,10)+'.json';a.click();}},
          el('i',{className:'ti ti-download'}), 'Backup'
        ),
        el('button',{className:'sidebar-footer-btn',onClick:()=>importRef.current.click()},
          el('i',{className:'ti ti-upload'}), 'Import'
        ),
        el('button',{className:'sidebar-footer-btn',
          onClick:()=>setShowImport(true)},
          el('i',{className:'ti ti-file-import'}),
          'Import from Excel'
        ),
        el('button',{className:'sidebar-footer-btn',
          onClick:()=>setShowGH(true),
          style:isDirty?{
            color:'#fff',background:'var(--grad-accent)',borderRadius:'var(--pill)',
            fontWeight:700,boxShadow:'0 2px 8px rgba(232,98,42,.35)'
          }:{color:'rgba(255,255,255,.4)'}},
          el('i',{className:'ti ti-brand-github'}),
          isDirty?'GitHub · Push':'GitHub'
        )
      )
    ),

    /* ── Main content ── */
    el('div',{style:{marginLeft:'var(--sidebar-w)',flex:1,minWidth:0,display:'flex',flexDirection:'column',minHeight:'100vh'}},
      /* Top bar */
      el('div',{className:'topbar2'},
        el('span',{className:'topbar2-title'},
          view==='home'?'Home':
          view==='funnel'?'Product Funnel':
          view==='postlaunch'?'Post Launch Analytics':
          view==='macro'?'Macro Timeline':
          view==='workload'?'Team Workload':
          (data.pcTabs.find(t=>t.id===view)?.label||'Dashboard')
        ),
        el('div',{className:'topbar2-sep'}),

        el('span',{className:'topbar2-meta'},'Last saved: ',fmtTs(lastSaved)),
        saved&&el('span',{style:{fontSize:11,color:'var(--ok)',display:'flex',alignItems:'center',gap:4}},el('i',{className:'ti ti-check'}),' Saved'),
        el('div',{className:'topbar2-actions'},
          el('span',{style:{fontSize:10,background:'var(--grad-accent)',color:'#fff',borderRadius:'var(--pill)',padding:'3px 10px',fontWeight:700,boxShadow:'var(--shadow-accent)'}},'v1.54'),
          el('button',{className:'btn',onClick:()=>window.print(),style:{fontSize:11}},el('i',{className:'ti ti-printer'}),' Print'),
          el('button',{className:'btn',onClick:toggleTheme,title:theme==='dark'?'Switch to light mode':'Switch to dark mode',style:{fontSize:11}},
          el('i',{className:'ti '+(theme==='dark'?'ti-sun':'ti-moon')}),
          theme==='dark'?' Light':' Dark'
        ),
        el('button',{className:'btn',onClick:toggleFullscreen,title:isFullscreen?'Exit fullscreen (F)':'Enter fullscreen (F)',style:{fontSize:11}},
          el('i',{className:'ti '+(isFullscreen?'ti-minimize':'ti-maximize')}),
          isFullscreen?' Exit':' Fullscreen'
        )
        )
      ),

      /* Modals */
      showImport&&el(ImportExcelModal,{
        existingData:data,
        onImport:updates=>{
          setData(d=>({...d,...updates}));
          setIsDirty(true);
          dirtyRef.current=true;
        },
        onClose:()=>setShowImport(false)
      }),
      showGH&&el(GitHubSyncPanel,{data,setData,onClose:()=>setShowGH(false),onPushed:()=>{dirtyRef.current=false;setIsDirty(false);},onPulled:d=>{skipDirtyRef.current=true;setData(d);dirtyRef.current=false;setIsDirty(false);}}),
      el('input',{ref:importRef,type:'file',accept:'.json',style:{display:'none'},onChange:e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{try{const d=JSON.parse(ev.target.result);skipDirtyRef.current=true;setData(d);}catch{alert('Invalid backup file.');}};r.readAsText(f);}}),

      /* Content */
      el('div',{style:{flex:1}},
        view==='home'       ? el(HomeView,{data,setData,setView,setSels,setProdView}) :
        view==='funnel'     ? el(FunnelView,{data,setData}) :
        view==='postlaunch' ? el(PostLaunchView,{data,setData,addChangelogEntry}) :
        view==='macro'      ? MacroTimeline :
        view==='workload'   ? el(WorkloadViewComp,{data,setView,setSels,setProdView}) :
        el('div',null,
          el(ProductPanels,{prods,selId:prod?.id||'',setSelId,onAdd:addProd,onRemove:removeProd,allProds:{...data.postLaunch,...prods.reduce((a,p)=>({...a,[p.id]:p}),{})},isDevTab:view==='in_dev'}),
          prodView==='overview'
            ? el(PCOverview,{
                prods,
                pcLabel:data.pcTabs?.find(t=>t.id===view)?.label||(view==='in_dev'?'In Development':''),
                onSelect:id=>{setSelId(id);setProdView('detail');},
                onUpdateProd:(pcKey,id,upd)=>updProd(pcKey,id,upd)
              })
            : prodView==='summary'
            ? el(SummaryView,{prods,isDevTab:view==='in_dev',onSelect:id=>{setSelId(id);setProdView('detail');}})
            : prod
              ? el(ProductDetail,{
                key:prod.id,prod,
                onChange:upd=>updProd(view,prod.id,upd),
                onKbNav:kbNav,
                view,pcTabs:data.pcTabs,
                onMove:(toTab)=>moveProd(prod.id,view,toTab),
                allProds:[
                  ...data.pcTabs.flatMap(t=>(data[t.id]||[]).map(p=>({...p,pcLabel:t.label}))),
                  ...(data.in_dev||[]).map(p=>({...p,pcLabel:'In Development'}))
                ].filter(p=>p.id!==prod.id),
                onCopyDates:updates=>{
                  updates.forEach(({prod:updProd_})=>{
                    // Find which tab this product lives in
                    const allTabs=[...data.pcTabs.map(t=>t.id),'in_dev'];
                    for(const tabId of allTabs){
                      const arr=data[tabId]||[];
                      if(arr.some(p=>p.id===updProd_.id)){
                        updProd(tabId,updProd_.id,updProd_);
                        break;
                      }
                    }
                  });
                }
              })
              : el('div',{style:{padding:'60px',textAlign:'center',color:'var(--text3)'}},
                  el('i',{className:'ti ti-package',style:{fontSize:40,display:'block',marginBottom:14,opacity:.3}}),
                  'No products yet.',el('br'),
                  el('button',{className:'btn btn-primary',style:{marginTop:16},onClick:addProd},el('i',{className:'ti ti-plus'}),' Add First Product')
                )
        )
      )
    )
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(el(App));

</script>
</body>
</html>
