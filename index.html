        isOpen&&el('div',{style:{background:'var(--bg)'}},
          sec.key==='notes'
            ? el('div',{style:{padding:'12px 20px'}},
                el(Editable,{
                  value:specs['Additional Notes']||'',
                  onChange:v=>upd('Additional Notes',v),
                  multiline:true,
                  placeholder:'Add notes, comments, or anything relevant…',
                  style:{
                    width:'100%',fontSize:12,lineHeight:1.6,
                    minHeight:60,color:'var(--fg)'
                  }
                })
              )
            : sec.fields.map((f,fi)=>
                isImg(f)
                  ? el('div',{key:f,style:{
                      display:'grid',gridTemplateColumns:'200px 1fr',
                      borderBottom:'1px solid var(--border-soft)',
                      minHeight:40
                    }},
                      el('div',{style:{
                        padding:'10px 20px',
                        fontFamily:'var(--mono)',fontSize:11,fontWeight:500,
                        color:'var(--muted)',
                        background:'var(--surface-warm)',
                        borderRight:'1px solid var(--border)',
                        display:'flex',alignItems:'flex-start',paddingTop:12,
                        letterSpacing:'.02em'
                      }},f),
                      el('div',{style:{padding:'10px 16px'}},
                        el(ImageField,{value:specs[f]||'',onChange:v=>upd(f,v),label:f})
                      )
                    )
                  : el('div',{key:f,style:{
                      display:'grid',
                      gridTemplateColumns:'200px 1fr',
                      borderBottom:'1px solid var(--border-soft)',
                      minHeight:36,
                      background:fi%2===1?'var(--surface)':'var(--bg)'
                    }},
                      /* Label column */
                      el('div',{style:{
                        padding:'0 20px',
                        fontFamily:'var(--mono)',fontSize:11,fontWeight:500,
                        color:'var(--muted)',
                        background:'var(--surface-warm)',
                        borderRight:'1px solid var(--border)',
                        display:'flex',alignItems:'center',
                        letterSpacing:'.02em',lineHeight:1.4
                      }},f),
                      /* Value column */
                      el('div',{style:{
                        padding:'0 14px',
                        display:'flex',alignItems:isMulti(f)?'flex-start':'center',
                        paddingTop:isMulti(f)?8:0,
                        paddingBottom:isMulti(f)?8:0,
                        minHeight:isMulti(f)?60:36
                      }},
                        el(Editable,{
                          value:specs[f]||'',
                          onChange:v=>upd(f,v),
                          multiline:isMulti(f),
                          placeholder:'—',
                          style:{
                            fontSize:12,fontWeight:500,color:'var(--fg)',
                            width:'100%',lineHeight:1.5
                          }
                        })
                      )
                    )
              )
        )
      );
    })
  );
}


/* ── Product Detail ── */
function MoveProductMenu({view,pcTabs,onMove}){
  const [open,setOpen]=React.useState(false);
  const ref=React.useRef();

  React.useEffect(()=>{
    if(!open) return;
    const h=e=>{ if(ref.current&&!ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown',h);
    return()=>document.removeEventListener('mousedown',h);
  },[open]);

  // Build destination list — all tabs except current
  const tabs=[
    {id:'in_dev',label:'In Development',icon:'ti-flask'},
    ...pcTabs.map(t=>({id:t.id,label:t.label,icon:'ti-package'}))
  ].filter(t=>t.id!==view);

  return el('div',{ref,style:{position:'relative',display:'inline-block'}},
    el('button',{
      onClick:()=>setOpen(o=>!o),
      className:'btn',
      style:{fontSize:11,display:'flex',alignItems:'center',gap:5,
        background:open?'var(--accent-bg)':'var(--bg)',
        borderColor:open?'var(--accent)':'var(--bdr2)',
        color:open?'var(--accent)':'var(--text2)'}
    },
      el('i',{className:'ti ti-transfer'}),
      'Move to…',
      el('i',{className:'ti ti-chevron-'+(open?'up':'down'),style:{fontSize:10}})
    ),
    open&&el('div',{style:{
      position:'absolute',top:'calc(100% + 6px)',right:0,zIndex:400,
      background:'var(--bg)',border:'1px solid var(--bdr2)',borderRadius:'var(--r)',
      boxShadow:'0 8px 24px rgba(0,0,0,.2)',minWidth:200,overflow:'hidden'
    }},
      el('div',{style:{padding:'6px 12px',fontSize:10,fontWeight:700,
        color:'var(--text3)',textTransform:'uppercase',letterSpacing:'.08em',
        borderBottom:'0.5px solid var(--bdr)'}},
        'Move product to…'
      ),
      tabs.map(t=>el('button',{key:t.id,
        onClick:()=>{ onMove(t.id); setOpen(false); },
        style:{
          width:'100%',background:'transparent',border:'none',
          padding:'10px 14px',cursor:'pointer',fontFamily:'inherit',
          display:'flex',alignItems:'center',gap:10,
          textAlign:'left',transition:'background .1s'
        },
        onMouseEnter:e=>e.currentTarget.style.background='var(--bg2)',
        onMouseLeave:e=>e.currentTarget.style.background='transparent'
      },
        el('i',{className:'ti '+t.icon,style:{
          fontSize:14,
          color:t.id==='in_dev'?'var(--info)':'var(--accent)',
          flexShrink:0
        }}),
        el('div',null,
          el('div',{style:{fontSize:12,fontWeight:600,color:'var(--text)'}},t.label),
          t.id==='in_dev'&&el('div',{style:{fontSize:10,color:'var(--text3)'}},
            'Move back to development'
          )
        )
      ))
    )
  );
}


function ProductDetail({prod,onChange,onKbNav,view,pcTabs,onMove,allProds,onCopyDates}){
  const [sec,setSec]=useState('specs');
  const [showCopyDates,setShowCopyDates]=React.useState(false);
  useEffect(()=>{
    const h=e=>{
      if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.tagName==='SELECT')return;
      if(e.key==='t'||e.key==='T')setSec('tasks');
      else if(e.key==='g'||e.key==='G')setSec('gantt');
      else if(e.key==='s'||e.key==='S')setSec('specs');
      else if(e.key==='ArrowLeft')onKbNav(-1);
      else if(e.key==='ArrowRight')onKbNav(1);
    };
    window.addEventListener('keydown',h);return()=>window.removeEventListener('keydown',h);
  },[onKbNav]);
  const upT=ts=>onChange({...prod,tasks:ts});
  const addT=cat=>upT([...prod.tasks,{id:uid(),name:'New task',owner:'',status:'Not Started',start:'',end:'',notes:'',cat,atRisk:false}]);
  const delT=id=>upT(prod.tasks.filter(t=>t.id!==id));
  const overdue=prod.tasks.filter(t=>isOverdue(t)).length;
  return el('div',{className:'main'},
    el('div',{className:'prod-header'},
      overdue>0&&el('div',{style:{background:'var(--err-bg)',border:'0.5px solid var(--err)',borderRadius:6,padding:'6px 12px',marginBottom:12,fontSize:12,color:'var(--err)',display:'flex',alignItems:'center',gap:8}},
        el('i',{className:'ti ti-alert-triangle',style:{flexShrink:0}}),overdue+' overdue task'+(overdue>1?'s':'')+' — see Tasks tab'
      ),
      el('div',{style:{display:'flex',alignItems:'flex-start',gap:12,flexWrap:'wrap'}},
        el('div',{style:{flex:1,minWidth:0}},
          el('div',{style:{display:'flex',alignItems:'center',gap:8,marginBottom:5}},
            el('div',{style:{fontSize:11,color:BRAND_COL[prod.brand]||'var(--info)',fontWeight:700,textTransform:'uppercase',letterSpacing:'.08em'}},
              el(Editable,{value:prod.brand,onChange:v=>onChange({...prod,brand:v}),style:{color:'inherit'}})
            ),
            prod.skuCode
              ? el('span',{style:{fontFamily:'var(--mono)',fontSize:11,fontWeight:700,color:'var(--muted)',marginLeft:2}},prod.skuCode)
              : view==='in_dev'
                ? el('span',{style:{
                    fontFamily:'var(--mono)',fontSize:9,fontWeight:700,
                    background:'rgba(167,139,250,.14)',color:'var(--x-violet)',
                    borderRadius:5,padding:'2px 10px',marginLeft:6,
                    textTransform:'uppercase',letterSpacing:'.08em'
                  }},'R&D — assign on move to PC')
                : null
          ),
          el(Editable,{value:prod.name,onChange:v=>onChange({...prod,name:v,shortName:v.length>30?v.slice(0,30)+'…':v}),style:{fontSize:16,fontWeight:700,display:'block',marginBottom:8,lineHeight:1.3}}),
          el(TagEditor,{tags:prod.tags||[],onChange:tags=>onChange({...prod,tags})})
        ),
        el('div',{style:{display:'flex',flexDirection:'column',alignItems:'flex-end',gap:6,flexShrink:0}},
          el('label',{style:{fontSize:11,color:'var(--text2)',display:'flex',alignItems:'center',gap:6}},
            'Launch date:',
            el('input',{type:'date',style:{font:'inherit',fontSize:12,background:'var(--bg2)',border:'0.5px solid var(--bdr2)',borderRadius:5,padding:'3px 8px',color:'var(--text)'},value:prod.launchDate||'',onChange:ev=>onChange({...prod,launchDate:ev.target.value})})
          ),
          el('div',{style:{fontSize:11,color:'var(--text3)'}},el('i',{className:'ti ti-keyboard',style:{fontSize:11}}),' T/G/S tabs · ←→ products'),
          /* Copy Dates */
          allProds?.length>0&&el('button',{
            onClick:()=>setShowCopyDates(true),
            className:'btn',
            style:{fontSize:11,display:'flex',alignItems:'center',gap:5}
          },el('i',{className:'ti ti-copy'}),' Copy Dates'),
          /* Export PDF */
          el('button',{
            onClick:()=>generateProductPDF(prod, pcTabs?.find(t=>t.id===view)?.label||view),
            className:'btn',
            style:{fontSize:11,display:'flex',alignItems:'center',gap:5,
              background:'var(--grad-accent)',color:'#fff',border:'none',
              boxShadow:'var(--shadow-accent)'}
          },el('i',{className:'ti ti-file-type-pdf'}),' Export PDF'),
          /* Move to… dropdown */
          onMove&&el(MoveProductMenu,{view,pcTabs,onMove})
        )
      )
    ),
    el(NotesRow,{notes:prod.notes||{updates:'',blockers:''},onChange:n=>onChange({...prod,notes:n}),launchDate:prod.launchDate,tasks:prod.tasks}),
    el('div',{className:'sectabs'},
      [['tasks','Tasks'],['gantt','Gantt'],['specs','Specs']].map(([id,lbl])=>el('button',{key:id,className:'stab '+(sec===id?'on':''),onClick:()=>setSec(id)},lbl))
    ),
    sec==='tasks'&&el(TasksPanel,{tasks:prod.tasks,onChange:upT,onAdd:addT,onDel:delT}),
    sec==='gantt'&&el(GanttChart,{tasks:prod.tasks,launchDate:prod.launchDate,onChange:(ut,action)=>{
      if(action==='add'){
        onChange({...prod,tasks:[...prod.tasks,ut]});
      } else {
        onChange({...prod,tasks:prod.tasks.map(t=>t.id===ut.id?ut:t)});
      }
    }}),
    showCopyDates&&el(CopyDatesModal,{
      sourceProd:prod,
      allProds:allProds||[],
      onCopy:updates=>{
        if(onCopyDates) onCopyDates(updates);
      },
      onClose:()=>setShowCopyDates(false)
    }),
    sec==='specs'&&el(SpecsPanel,{specs:{...prod.specs,_skuCode:prod.skuCode||prod.specs?._skuCode||''},onChange:sp=>onChange({...prod,specs:sp}),prod,onProdChange:onChange,isDevTab:view==='in_dev',allProds})
  );
}

const MAP_BOUNDS={w:-84.5,e:-74.0,s:41.4,n:47.5};
const toSVG=(lat,lng,W=460,H=320)=>{
  const x=((lng-MAP_BOUNDS.w)/(MAP_BOUNDS.e-MAP_BOUNDS.w))*W;
  const y=((MAP_BOUNDS.n-lat)/(MAP_BOUNDS.n-MAP_BOUNDS.s))*H;
  return [Math.round(x*10)/10,Math.round(y*10)/10];
};

// Format ISO week → readable label
const fmtWeek=w=>{
  // ISO week to a readable date label (Monday of that week)
  const[y,wn]=w.split('-W');
  const jan4=new Date(parseInt(y),0,4); // Jan 4 is always in week 1
  const monday=new Date(jan4);
  monday.setDate(jan4.getDate()-(jan4.getDay()||7)+1+(parseInt(wn)-1)*7);
  return monday.toLocaleString('en-CA',{month:'short',day:'numeric'});
};

const STORE_COUNT_KEY='au_store_count_v1';
const getStoreCount=()=>{try{const v=localStorage.getItem(STORE_COUNT_KEY);return v?parseInt(v):1695;}catch{return 1695;}};
const saveStoreCount=v=>{try{localStorage.setItem(STORE_COUNT_KEY,String(v));}catch{}};
let ONTARIO_STORES=getStoreCount();

const ROS_CLASSES=[
  {cls:'A',label:'Ultra Fast Seller',  min:8,   max:null, col:'#f0c030',bg:'#fff8ec',   tx:'#b87000'},
  {cls:'B',label:'Fast Seller',        min:3,   max:8,    col:'#4dbb6a',bg:'var(--ok-bg)', tx:'var(--ok)'},
  {cls:'C',label:'Moderate Seller',    min:0.8, max:3,    col:'#5b9bd5',bg:'var(--info-bg)',tx:'var(--info)'},
  {cls:'D',label:'Slow Seller',        min:0.2, max:0.8,  col:'#e09b3d',bg:'var(--warn-bg)',tx:'var(--warn)'},
  {cls:'E',label:'Ultra Slow Seller',  min:0,   max:0.2,  col:'#e07878',bg:'var(--err-bg)', tx:'var(--err)'},
  {cls:'N',label:'New Product',        min:null,max:null,  col:'#a78bfa',bg:'var(--mk-light)',tx:'#7c3aed'},
];
// Official OCS classification — strictly > boundary, New Product <=30 days
const ocsClass=(vel,firstReceipt)=>{
  if(firstReceipt){
    const days=Math.round((TODAY_D-new Date(firstReceipt+'T00:00:00'))/86400000);
    if(!isNaN(days)&&days<=30) return 'N';
  }
  if(vel>8)   return 'A';
  if(vel>3)   return 'B';
  if(vel>0.8) return 'C';
  if(vel>0.2) return 'D';
  return 'E';
};
const getROS=v=>ROS_CLASSES.find(r=>v>=r.min&&(r.max===null||v<r.max))||ROS_CLASSES[4];
const nextROS=v=>{
  // Use only A-E for next class calc (exclude N)
  const classes=ROS_CLASSES.filter(r=>r.cls!=='N');
  const i=classes.findIndex(r=>v>r.min&&(r.max===null||v<=r.max));
  if(i<=0)return null;
  return classes[i-1];
};

/* ── Velocity Card ── */
function VelocityCard({ocs,weekly}){
  if(!ocs||!weekly)return null;
  const CLS={
    A:{col:'#f0c030',bg:'#fff8ec',      tx:'#b87000',    label:'Ultra Fast Seller',  grad:'linear-gradient(135deg,#fde68a,#f0c030)'},
    B:{col:'#4dbb6a',bg:'var(--ok-bg)', tx:'var(--ok)',  label:'Fast Seller',        grad:'var(--grad-ok)'},
    C:{col:'#5b9bd5',bg:'var(--info-bg)',tx:'var(--info)',label:'Moderate Seller',   grad:'var(--grad-info)'},
    D:{col:'#e09b3d',bg:'var(--warn-bg)',tx:'var(--warn)',label:'Slow Seller',       grad:'var(--grad-warn)'},
    E:{col:'#e07878',bg:'var(--err-bg)', tx:'var(--err)', label:'Ultra Slow Seller', grad:'var(--grad-err)'},
    N:{col:'#a78bfa',bg:'var(--mk-light)',tx:'#7c3aed',  label:'New Product',        grad:'linear-gradient(135deg,#c4b5fd,#a78bfa)'},
  };

  const sorted=Object.entries(weekly).sort(([a],[b])=>a.localeCompare(b));
  const n=sorted.length;
  const lw=n>=1?sorted[n-1][1]:0;          // last week units
  const tw=n>=2?sorted[n-2][1]:0;          // 2 weeks ago
  const tr=n>=3?sorted[n-3][1]:0;          // 3 weeks ago
  const fw=n>=4?sorted[n-4][1]:0;          // 4 weeks ago

  // LW velocity (for display)
  const vel=lw/ONTARIO_STORES;

  // L4W average velocity (for classification — more stable, matches OCS methodology)
  const l4wWeeks=Math.min(4,n);
  const l4wUnits=[lw,tw,tr,fw].slice(0,l4wWeeks).reduce((a,b)=>a+b,0);
  const velL4W=l4wWeeks>0?(l4wUnits/l4wWeeks)/ONTARIO_STORES:0;

  // Classify using official OCS method — strictly > thresholds, L4W avg velocity
  // New Product flag comes from ocs.firstReceipt date
  const clsKey=ocsClass(velL4W, ocs?.firstReceipt||null);
  const cls=CLS[clsKey];

  // Units needed to reach next class (based on LW — what you need this week)
  const next=nextROS(vel);
  const unitsNeeded=next?Math.max(0,Math.ceil(next.min*ONTARIO_STORES-lw)):0;

  // 3-week average for display
  const avg3=Math.round([lw,tw,tr].slice(0,Math.min(3,n)).reduce((a,b)=>a+b,0)/Math.min(3,n));

  const bars=[
    {lbl:n>=3?fmtWeek(sorted[n-3][0]):'—', v:tr},
    {lbl:n>=2?fmtWeek(sorted[n-2][0]):'—', v:tw},
    {lbl:n>=1?fmtWeek(sorted[n-1][0]):'LW', v:lw, hi:true},
  ].filter((_,i)=>i>=3-Math.min(3,n));
  const bMax=Math.max(...bars.map(b=>b.v),1);

  return el('div',{style:{background:'var(--bg)',border:'0.5px solid var(--bdr)',borderRadius:10,padding:'20px',marginBottom:16}},
    /* ── Header ── */
    el('div',{style:{fontSize:10,fontWeight:700,textTransform:'uppercase',letterSpacing:'.1em',color:'var(--muted)',fontFamily:'var(--font-mono)',marginBottom:16}},
      'OCS Velocity  ·  ',
      el('span',{style:{fontWeight:400,color:'var(--text2)'}},'Last Week SO ÷ '+ONTARIO_STORES.toLocaleString()+' stores  ·  '+n+' weeks of data')
    ),

    /* ── Top row: class badge | velocity + bars | next class ── */
    el('div',{style:{display:'flex',gap:16,alignItems:'stretch',marginBottom:16}},

      /* Class badge */
      el('div',{style:{flexShrink:0,width:110,background:cls.grad,border:'none',borderRadius:'var(--r)',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:'14px 0',boxShadow:'0 4px 16px '+cls.col+'40'}},
        el('div',{style:{fontSize:44,fontWeight:700,fontFamily:'var(--font-mono)',color:'#fff',lineHeight:1,textShadow:'0 2px 8px rgba(0,0,0,.15)'}},clsKey),
        el('div',{style:{fontSize:11,color:'#fff',fontWeight:700,marginTop:5}},cls.label),
        el('div',{style:{fontSize:9,color:'rgba(255,255,255,.8)',marginTop:3}},'SKU Class')
      ),

      /* Velocity number + 3-week mini bars */
      el('div',{style:{flex:1,display:'flex',flexDirection:'column',justifyContent:'space-between'}},
        /* Velocity number row */
        el('div',{style:{display:'flex',alignItems:'baseline',gap:10,marginBottom:12}},
          el('span',{style:{fontSize:36,fontWeight:900,color:cls.tx,lineHeight:1}},vel.toFixed(4)),
          el('span',{style:{fontSize:12,color:'var(--text2)'}},
            'LW velocity'),
          el('span',{style:{fontSize:10,color:'var(--text3)',marginTop:3}},
            'LW: ',el('strong',{style:{color:'var(--text)'}},lw.toLocaleString()),' units · ',
            'L4W avg: ',el('strong',{style:{color:cls.tx}},velL4W.toFixed(4)),' · ',
            'Class from L4W avg')
        ),
        /* 3-week bars — anchored at baseline */
        el('div',null,
          el('div',{style:{display:'flex',gap:10,alignItems:'flex-end',borderBottom:'2px solid var(--bdr2)',paddingBottom:0}},
            bars.map((b,i)=>el('div',{key:i,style:{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:3}},
              el('div',{style:{fontSize:11,fontWeight:700,color:b.hi?cls.tx:'var(--text2)'}},b.v.toLocaleString()),
              el('div',{style:{
                width:'100%',
                height:Math.max(6,Math.round(b.v/bMax*64))+'px',

/* ── Weekly Bar Chart (ROS-aware) ── */
function WeeklyChart({weekly,monthly}){
  const [mode,setMode]=React.useState('weekly');
  const raw=mode==='weekly'?weekly:monthly;
  const entries=Object.entries(raw).sort(([a],[b])=>a.localeCompare(b));
  if(!entries.length)return null;

  // Official thresholds — based on current Ontario store count
  const sc=ONTARIO_STORES;
  const ALL_T=mode==='weekly'?[
    {label:'A',units:Math.round(8*sc),   col:'#f0c030'},
    {label:'B',units:Math.round(3*sc),   col:'#4dbb6a'},
    {label:'C',units:Math.round(0.8*sc), col:'#5b9bd5'},
    {label:'D',units:Math.round(0.2*sc), col:'#e09b3d'},
  ]:[];

  const maxV=Math.max(...entries.map(([,v])=>v),1);
  // Only draw lines that fall within 0–2× of actual data (no point showing A at 13k if max is 400)
  const thresholds=ALL_T.filter(t=>t.units<=maxV*2);
  // Scale chart high enough to show the lowest threshold above the data
  const topThresh=thresholds.length?Math.max(...thresholds.map(t=>t.units)):0;
  const chartMax=Math.max(maxV,topThresh)*1.14;

  const BAR_H=108;
  const fmtMo=k=>{const[y,m]=k.split('-');return['','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][parseInt(m)]+"'"+y.slice(2);};
  const lbl=k=>mode==='weekly'?fmtWeek(k):fmtMo(k);

  return el('div',null,
    el('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:12}},
      el('div',{style:{fontSize:12,fontWeight:700,display:'flex',alignItems:'center',gap:6}},
        el('i',{className:'ti ti-chart-bar',style:{color:'var(--info)'}}), 'Weekly Sales & ROS Class'

/* ── Ontario Map (Leaflet) ── */
function OntarioMap({cityData}){
  const containerRef = React.useRef(null);
  const mapRef       = React.useRef(null);
  const markersRef   = React.useRef([]);

  // Init Leaflet once when the div mounts
  React.useEffect(()=>{
    if(!containerRef.current || mapRef.current) return;
    const L = window.L;
    if(!L){ console.warn('Leaflet not loaded'); return; }

    const map = L.map(containerRef.current,{
      center:[48.5,-84.0], zoom:5,
      zoomControl:true, scrollWheelZoom:false, attributionControl:true,
    });
    setTimeout(()=>map.invalidateSize(),100); // force fill after render

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
      attribution:'&copy; <a href="https://openstreetmap.org">OpenStreetMap</a>',
      maxZoom:18,
    }).addTo(map);

    mapRef.current = map;
    return ()=>{ map.remove(); mapRef.current=null; };
  },[]);

  // Sync markers whenever cityData changes (after map is ready)
  React.useEffect(()=>{
    const L = window.L;
    const map = mapRef.current;
    if(!L || !map) return;

    markersRef.current.forEach(m=>m.remove());
    markersRef.current = [];

    const entries = Object.entries(cityData)
      .filter(([c])=>CITY_COORDS[c])
      .sort(([,a],[,b])=>a-b);
    if(!entries.length) return;

    const maxU = Math.max(...entries.map(([,v])=>v), 1);
    entries.forEach(([city,units])=>{
      const [lat,lng] = CITY_COORDS[city];
      const r   = Math.max(6, Math.min(28, 6+(units/maxU)*22));
      const region = CITY_REGION[city] || 'Central';
      const col  = REGION_COLOURS[region] || '#5b9bd5';
      const m = L.circleMarker([lat,lng],{
        radius:r, fillColor:col,
        color:'rgba(255,255,255,0.7)', weight:1.5, fillOpacity:0.85,
      })
      .bindTooltip(
        '<b style="color:'+col+'">'+city+'</b><br>'+
        '<span style="color:#aaa;font-size:11px">'+region+'</span><br>'+
        '<b>'+units.toLocaleString()+'</b> units',
        {direction:'top', offset:[0,-4]}
      )
      .addTo(map);
      markersRef.current.push(m);
    });
  });   // no dep array — runs after every render, safe because we clear first

  return el('div',{style:{display:'flex',flexDirection:'column',height:'100%',minHeight:360}},
    el('div',{
      ref:containerRef,
      style:{flex:1,minHeight:320,borderRadius:6,overflow:'hidden',border:'1px solid var(--bdr)'}
    }),
    el('div',{style:{display:'flex',flexWrap:'wrap',gap:8,marginTop:8,justifyContent:'center'}},
      Object.entries(REGION_COLOURS).map(([region,col])=>
        el('div',{key:region,style:{display:'flex',alignItems:'center',gap:4,fontSize:10,color:'var(--text3)'}},
          el('div',{style:{width:9,height:9,borderRadius:'50%',background:col,flexShrink:0}}),
          region
        )
      )
    ),
    el('div',{style:{fontSize:9,color:'var(--text4)',textAlign:'center',marginTop:4}},
      'Bubble size = units sold · Colour = region'
    )
  );
}

/* ── Daily Line Chart ── */
function DailyLineChart({daily,brand,skuClass,launchDate,showCumulative=true,globalMax=null}){
  if(!daily||!Object.keys(daily).length)return null;

  const CLS_COL={A:'#f0c030',B:'#4dbb6a',C:'#5b9bd5',D:'#e09b3d',E:'#e07878','New Product':'#a78bfa'};
  const lineCol=CLS_COL[skuClass]||'#5b9bd5';

  // Fill every calendar day between first and last order date with 0 if no orders
  const rawEntries=Object.entries(daily).sort(([a],[b])=>a.localeCompare(b));
  const firstDate=new Date(rawEntries[0][0]+'T00:00:00');
  const lastDate=new Date(rawEntries[rawEntries.length-1][0]+'T00:00:00');
  const dailyMap=Object.fromEntries(rawEntries);
  const allEntries=[];
  const cur=new Date(firstDate);
  while(cur<=lastDate){
    const ds=cur.toISOString().slice(0,10);
    allEntries.push([ds, dailyMap[ds]||0]);
    cur.setDate(cur.getDate()+1);
  }
  const entries=allEntries;
  const vals=entries.map(([,v])=>v);
  const maxV=globalMax&&globalMax>0?globalMax:Math.max(...vals,1);

  // Cumulative units
  let cum=0;
  const cumVals=vals.map(v=>{cum+=v;return cum;});
  const maxCum=Math.max(...cumVals,1);
  const W=880, H=120, PL=44, PR=12, PT=12, PB=28;
  const cW=W-PL-PR, cH=H-PT-PB;
  const n=entries.length;
  const xPos=i=>(i/(n-1||1))*cW;
  const yPos=v=>cH-(v/maxV)*cH;

  // Build SVG polyline points
  const points=entries.map(([,v],i)=>`${PL+xPos(i)},${PT+yPos(v)}`).join(' ');

  // Month labels — show first day of each month
  const monthLabels=[];
  let lastMonth='';
  entries.forEach(([date],i)=>{
    const mo=date.slice(0,7);
    if(mo!==lastMonth){
      lastMonth=mo;
      const[y,m]=mo.split('-');
      const lbl=['','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][parseInt(m)]+"'"+y.slice(2);
      monthLabels.push({lbl,x:PL+xPos(i)});
    }
  });

  // Y-axis labels
  const yTicks=[0,Math.round(maxV*0.5),maxV];

  // Tooltip state
  const [tip,setTip]=React.useState(null);

  // Milestone lines: 15, 30, 60, 90 days from launchDate
    const milestones=launchDate?[15,30,60,90].map(days=>{
    const d=new Date(launchDate+'T00:00:00');
    d.setDate(d.getDate()+days);
    const ds=d.toISOString().slice(0,10);
    // Find the closest entry index by date
    let mIdx=entries.findIndex(([date])=>date>=ds);
    if(mIdx<0){
      // Past the end of data — place at the end
      mIdx=entries.length-1;
    }
    // Snap to exact position if date matches, else interpolate
    const mx=PL+xPos(mIdx);
    return{days,x:mx,date:ds,past:ds>entries[entries.length-1][0]};
  }).filter(Boolean):[];

  // Weekly separator x positions — every Monday
  const weekSeps=[];
  entries.forEach(([date],i)=>{
    if(i===0)return;
    const d=new Date(date+'T00:00:00');
    if(d.getDay()===1) weekSeps.push(PL+xPos(i));
  });

  // Area fill points (close the polygon)
  const areaPoints=`${PL+xPos(0)},${PT+cH} ${points} ${PL+xPos(n-1)},${PT+cH}`;

  return el('div',{style:{background:'var(--bg)',border:'0.5px solid var(--bdr)',borderRadius:10,padding:'16px',marginTop:16}},
    el('div',{style:{fontSize:12,fontWeight:700,marginBottom:12,display:'flex',alignItems:'center',gap:6}},
      el('i',{className:'ti ti-chart-line',style:{color:lineCol}}),
      'Daily Orders — Full Life of SKU',
      el('span',{style:{fontSize:10,color:'var(--text3)',marginLeft:6,fontWeight:400}},
        entries[0]?.[0]+' → '+entries[entries.length-1]?.[0],
        '  ·  '+n+' order days'
      )
    ),
    el('div',{style:{position:'relative',overflowX:'auto'},
      onMouseLeave:()=>setTip(null)},
      el('svg',{
        viewBox:`0 0 ${W} ${H}`,
        style:{width:'100%',minWidth:500,display:'block'},
        onMouseMove:e=>{
          const rect=e.currentTarget.getBoundingClientRect();
          const svgX=(e.clientX-rect.left)*(W/rect.width);
          const relX=svgX-PL;
          const i=Math.round((relX/cW)*(n-1));
          if(i>=0&&i<n) setTip({i,x:PL+xPos(i),y:PT+yPos(vals[i]),date:entries[i][0],units:vals[i]});
        }
      },
        // Grid lines
        yTicks.map((v,i)=>el('g',{key:i},
          el('line',{x1:PL,y1:PT+yPos(v),x2:PL+cW,y2:PT+yPos(v),stroke:'var(--bdr)',strokeWidth:0.5,strokeDasharray:v===0?'none':'3 4'}),
          el('text',{x:PL-4,y:PT+yPos(v)+4,textAnchor:'end',fontSize:9,fill:'var(--text3)',fontFamily:'inherit'},v)
        )),
        // Area fill
        el('defs',null,
          el('linearGradient',{id:'dailyAreaGrad',x1:'0',y1:'0',x2:'0',y2:'1'},
            el('stop',{offset:'0%',stopColor:lineCol,stopOpacity:0.22}),
            el('stop',{offset:'100%',stopColor:lineCol,stopOpacity:0.02})
          )
        ),
        el('polygon',{points:areaPoints,fill:'url(#dailyAreaGrad)'}),
        // Weekly separators — light vertical lines every Monday
        ...weekSeps.map((x,i)=>el('line',{key:'ws'+i,x1:x,y1:PT,x2:x,y2:PT+cH,stroke:'var(--bdr2)',strokeWidth:0.5,opacity:0.5})),
        // Cumulative units line (secondary axis, right side, lighter)
        showCumulative&&el('polyline',{
          points:entries.map((_,i)=>`${PL+xPos(i)},${PT+cH-(cumVals[i]/maxCum*cH)}`).join(' '),
          fill:'none',stroke:'rgba(255,255,255,0.12)',strokeWidth:1,
          strokeDasharray:'2 3',strokeLinecap:'round'
        }),
        showCumulative&&el('text',{x:PL+cW-2,y:PT+cH-(cumVals[cumVals.length-1]/maxCum*cH)-4,
          fontSize:9,fill:'rgba(255,255,255,0.35)',textAnchor:'end',fontFamily:'inherit'
        },cumVals[cumVals.length-1].toLocaleString()+' total'),
        // Milestone day lines
        ...milestones.map(m=>{
          if(m.past)return null;
          // Each milestone gets a slightly different colour for distinction
          const mcols={15:'#a78bfa',30:'#5b9bd5',60:'#4dbb6a',90:'#f0c030'};
          const mcol=mcols[m.days]||'#f0c030';
          const mbg={15:'#1a0f3c',30:'#0d1f3c',60:'#0d2a14',90:'#2a2200'};
          const flipLabel=m.x>W*0.82; // flip label left if near right edge
          const lx=flipLabel?m.x-34:m.x+3;
          return el('g',{key:m.days},
            el('line',{x1:m.x,y1:PT,x2:m.x,y2:PT+cH,stroke:mcol,strokeWidth:1.5,strokeDasharray:'4 3',opacity:0.85}),
            el('rect',{x:lx,y:PT+2,width:30,height:14,rx:3,fill:mbg[m.days]||'#2a2200',stroke:mcol,strokeWidth:0.5}),
            el('text',{x:lx+5,y:PT+12,fontSize:9,fill:mcol,fontWeight:700,fontFamily:'inherit'},m.days+'d')
          );
        }),
        // Line
        el('polyline',{points,fill:'none',stroke:lineCol,strokeWidth:2,strokeLinejoin:'round',strokeLinecap:'round',style:{filter:'drop-shadow(0 1px 2px '+lineCol+'66)'}}),
        // Month labels
        monthLabels.map((m,i)=>el('g',{key:i},
          el('line',{x1:m.x,y1:PT+cH,x2:m.x,y2:PT+cH+3,stroke:'var(--text3)',strokeWidth:0.5}),
          el('text',{x:m.x,y:H-4,textAnchor:'middle',fontSize:9,fill:'var(--text3)',fontFamily:'inherit'},m.lbl)
        )),
        // Tooltip dot + line
        tip&&el('g',null,
          el('line',{x1:tip.x,y1:PT,x2:tip.x,y2:PT+cH,stroke:'var(--bdr2)',strokeWidth:1,strokeDasharray:'3 3'}),
          el('circle',{cx:tip.x,cy:tip.y,r:4,fill:lineCol,stroke:'var(--bg)',strokeWidth:1.5}),
          el('rect',{
            x:tip.x+(tip.x>W*0.7?-96:10),y:tip.y-18,
            width:88,height:32,rx:5,
            fill:'var(--bg)',stroke:lineCol,strokeWidth:0.5
          }),
          el('text',{x:tip.x+(tip.x>W*0.7?-92:14),y:tip.y-4,fontSize:10,fontWeight:700,fill:lineCol,fontFamily:'inherit'},tip.units+' units'),
          el('text',{x:tip.x+(tip.x>W*0.7?-92:14),y:tip.y+9,fontSize:9,fill:'var(--text2)',fontFamily:'inherit'},tip.date)
        )
      )
    )
  );
}


/* ── Store Distribution Card ── */
function StoreDistributionCard({storeMetrics,vel,prevVel,clsCol}){
  if(!storeMetrics)return null;
  const wkEntries=Object.entries(storeMetrics.weekMetrics).sort(([a],[b])=>a.localeCompare(b));
  const lw=wkEntries[wkEntries.length-1]?.[1]||{};
  const repeatRate=lw.prevActive>0?Math.round(lw.repeat/lw.prevActive*100):null;
  const distPct=Math.round(storeMetrics.totalStores/ONTARIO_STORES*100);
  const velDelta=prevVel!=null?vel-prevVel:null;
  const velDeltaPct=prevVel>0?((vel-prevVel)/prevVel*100):null;

  return el('div',{style:{background:'var(--bg)',border:'0.5px solid var(--bdr)',borderRadius:10,padding:'16px',marginBottom:16}},
    el('div',{style:{fontSize:10,fontWeight:700,textTransform:'uppercase',letterSpacing:'.1em',color:'var(--muted)',fontFamily:'var(--font-mono)',marginBottom:14}},'Store Distribution & Growth'),
    el('div',{style:{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:10,marginBottom:14}},

      /* W/W Velocity Delta */
      el('div',{style:{background:'var(--bg2)',borderRadius:8,padding:'12px 14px'}},
        el('div',{style:{fontSize:10,color:'var(--text3)',marginBottom:6,fontWeight:600}},'W/W Velocity'),
        velDelta!=null?el('div',null,
          el('div',{style:{display:'flex',alignItems:'baseline',gap:6}},
            el('span',{style:{fontSize:22,fontWeight:900,color:velDelta>=0?'var(--ok)':'var(--err)',lineHeight:1}},
              (velDelta>=0?'+':'')+velDelta.toFixed(4)),
            el('i',{className:'ti '+(velDelta>=0?'ti-arrow-up-right':'ti-arrow-down-right'),style:{fontSize:16,color:velDelta>=0?'var(--ok)':'var(--err)'}})
          ),
          velDeltaPct!=null&&el('div',{style:{fontSize:11,color:velDelta>=0?'var(--ok)':'var(--err)',marginTop:3}},
            (velDeltaPct>=0?'+':'')+velDeltaPct.toFixed(1)+'% vs last week')
        ):el('div',{style:{fontSize:13,color:'var(--text3)'}},'No prior week')
      ),

      /* New Stores This Week */

function GitHubSyncPanel({data, setData, onClose, onPushed, onPulled}){
  const conf = getGHConf();
  const [token,   setToken]   = React.useState(conf.token||GH_TOKEN_DEFAULT||'');
  const [autoRef, setAutoRef] = React.useState(conf.autoRefresh!==false);
  const [status,  setStatus]  = React.useState(null);
  const [busy,    setBusy]    = React.useState(false);
  const shaRef = React.useRef(conf.sha||null);

  const saveConf = (t,ar,sha)=>{
    shaRef.current = sha||shaRef.current;
    saveGHConf({token:t, autoRefresh:ar, sha:shaRef.current});
  };

  const handleTokenChange = val=>{
    setToken(val);
    saveConf(val, autoRef, shaRef.current);
  };

  const handlePull = async()=>{
    if(!token){ setStatus({ok:false,msg:'Paste your GitHub PAT below first.'}); return; }
    setBusy(true); setStatus(null);
    try{
      const result = await ghRead(token);
      if(!result){ setStatus({ok:false,msg:'No data.json found yet — use Push first to create it.'}); }
      else{
        shaRef.current = result.sha;
        saveConf(token, autoRef, result.sha);
        if(onPulled) onPulled(result.data);
        else setData(result.data);
        setStatus({ok:true, msg:'Pulled! Dashboard loaded from GitHub.'});
      }
    }catch(e){ setStatus({ok:false,msg:e.message}); }
    finally{ setBusy(false); }
  };

  const handlePush = async()=>{
    if(!token){ setStatus({ok:false,msg:'Paste your GitHub PAT below first.'}); return; }
    setBusy(true); setStatus(null);
    try{
      const latest = await ghRead(token);
      const sha = latest ? latest.sha : shaRef.current;
      const newSha = await ghWrite(token, data, sha);
      shaRef.current = newSha;
      saveConf(token, autoRef, newSha);
      if(onPushed) onPushed();
      setStatus({ok:true, msg:'Saved to GitHub! Auto-refresh re-enabled for viewers.'});
    }catch(e){ setStatus({ok:false,msg:e.message}); }
    finally{ setBusy(false); }
  };

  const handleAutoRefresh = val=>{
    setAutoRef(val);
    saveConf(token, val, shaRef.current);
  };

  const hasToken = token && token.length > 10;

/* ── Detect & parse OCS Replenishment Report format ── */
function isReplenishmentFormat(rows){
  if(!rows||!rows[0]) return false;
  const hdrs=rows[0].map(h=>String(h||'').trim());
  return hdrs.includes('Velocity') && hdrs.includes('SKU Class') && hdrs.includes('Last Week Sales Order Units');
}

function parseReplenishmentData(buffer){
  const XLSX=window.XLSX;
  if(!XLSX) throw new Error('SheetJS not loaded.');
  const wb=XLSX.read(buffer,{type:'array',cellDates:true});
  const ws=wb.Sheets[wb.SheetNames[0]];
  const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true});
  if(!isReplenishmentFormat(rows)) return null;

  const hdrs=rows[0].map(h=>String(h||'').trim());
  const col=name=>hdrs.findIndex(h=>h.toLowerCase()===name.toLowerCase());

  const iSKU      =col('SKU');
  const iBrand    =col('Brand');
  const iSupplier =col('Supplier');
  const iVel      =col('Velocity');
  const iClass    =col('SKU Class');
  const iLW       =col('Last Week Sales Order Units');
  const i2W       =col('Two Weeks Ago Sales Order Units');
  const i3W       =col('Three Weeks Ago Sales Order Units');
  const iAvg3     =col('Avg Sales Order Units (Last 3 Weeks)');
  const iWkFcst   =col('Weekly Forecast');
  const iWoS      =col('Weeks of Supply');
  const iOH       =col('Last Friday On Hand (OH)');
  const iOO       =col('Units On Order (OO)');
  const iStoresLW =col('No. of Stores Ordered Last week');
  const iStores4W =col('No. of Stores Ordered Last 4 weeks');
  const iPen4W    =col('Store Penetration - 4 Weeks');
  const iPen8W    =col('Store Penetration - 8 Weeks');
  const iPen12W   =col('Store Penetration - 12 Weeks');
  const iFirstRx  =col('First Receipt Date');
  const iLifeSku  =col('Life of SKU(Days)');
  const iFillRate =col('Fill Rate');
  const iOTFR     =col('On-Time Fill Rate');

  const products=[];
  rows.slice(1).forEach(row=>{
    if(!row[iSKU]&&!row[iBrand]) return;
    const brand  =String(row[iBrand]||'').trim();
    const supplier=String(row[iSupplier]||'').trim().toUpperCase();
    const skuId  =String(row[iSKU]||'').trim();
    const vel    =typeof row[iVel]==='number'?row[iVel]:parseFloat(row[iVel])||0;
    const lwU    =typeof row[iLW]==='number'?Math.round(row[iLW]):parseInt(row[iLW])||0;
    const twoWkU =typeof row[i2W]==='number'?Math.round(row[i2W]):parseInt(row[i2W])||0;
    const threeWkU=typeof row[i3W]==='number'?Math.round(row[i3W]):parseInt(row[i3W])||0;
    const avg3   =typeof row[iAvg3]==='number'?Math.round(row[iAvg3]):parseInt(row[iAvg3])||0;

    let firstRx='';
    const rawRx=row[iFirstRx];
    if(rawRx instanceof Date&&!isNaN(rawRx)){
      firstRx=rawRx.getFullYear()+'-'+String(rawRx.getMonth()+1).padStart(2,'0')+'-'+String(rawRx.getDate()).padStart(2,'0');
    } else if(typeof rawRx==='string') firstRx=rawRx.slice(0,10);

    products.push({
      skuId, brand, supplier,
      isMera: supplier.includes('MERA'),
      ocs:{
        velocity: vel,
        skuClass: String(row[iClass]||'').trim()||ocsClass(vel,firstRx),
        lwUnits:  lwU,
        twoWkUnits: twoWkU,
        threeWkUnits: threeWkU,
        avgLast3: avg3,
        weeklyForecast: typeof row[iWkFcst]==='number'?Math.round(row[iWkFcst]):null,
        weeksOfSupply: typeof row[iWoS]==='number'?parseFloat(row[iWoS].toFixed(1)):null,
        onHand: typeof row[iOH]==='number'?Math.round(row[iOH]):null,
        onOrder: typeof row[iOO]==='number'?Math.round(row[iOO]):null,
        storesLW: typeof row[iStoresLW]==='number'?Math.round(row[iStoresLW]):null,
        storesL4W: typeof row[iStores4W]==='number'?Math.round(row[iStores4W]):null,
        penPct4W: typeof row[iPen4W]==='number'?parseFloat((row[iPen4W]*100).toFixed(2)):null,
        penPct8W: typeof row[iPen8W]==='number'?parseFloat((row[iPen8W]*100).toFixed(2)):null,
        penPct12W: typeof row[iPen12W]==='number'?parseFloat((row[iPen12W]*100).toFixed(2)):null,
        fillRate: typeof row[iFillRate]==='number'?parseFloat((row[iFillRate]*100).toFixed(1)):null,
        onTimeFillRate: typeof row[iOTFR]==='number'?parseFloat((row[iOTFR]*100).toFixed(1)):null,
        firstReceipt: firstRx,
        lifeOfSku: typeof row[iLifeSku]==='number'?Math.round(row[iLifeSku]):null,
      }
    });
  });
  return products;
}

function parseExcelSalesData(buffer, existingProdName){
  const XLSX = window.XLSX;
  if(!XLSX) throw new Error('SheetJS not loaded. Please refresh the page.');

  const wb = XLSX.read(buffer, {type:'array', cellDates:true});
  const ws = wb.Sheets[wb.SheetNames[0]];
  // raw:true → numbers stay numbers, dates stay Date objects
  const rows = XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:''});

  if(rows.length < 2) throw new Error('No data rows found in file.');

  // ── Map columns by header name (exact OCS format) ──
  // Expected: SKU[0] | Item Name[1] | Category[2] | Sub Category[3] | Brand[4] |
  //           Vendor ID[5] | Vendor Name[6] | Store Name[7] | Store Address[8] |
  //           Region[9] | City[10] | Order Date[11] | Order Type[12] | Units Sold[13] | Barcode[14]
  // OCS export format is always fixed — hardcode indices
  // [0]SKU [1]Item Name [2]Category [3]Sub Category [4]Brand [5]Vendor ID
  // [6]Vendor Name [7]Store Name [8]Store Address [9]Region [10]City
  // [11]Order Date [12]Order Type [13]Units Sold [14]Item Barcode
  const hdrs = rows[0].map(h=>String(h||'').trim());
  
  // Verify we have the right format by checking key headers
  const hdrStr = hdrs.join('|');
  if(!hdrStr.includes('Item Name')) throw new Error('Cannot find "Item Name" column. Is this an OCS sales export? Headers: '+hdrs.join(', '));
  if(!hdrStr.includes('Units Sold')) throw new Error('Cannot find "Units Sold" column.');
  if(!hdrStr.includes('Order Date')) throw new Error('Cannot find "Order Date" column.');

  // Always use fixed positions — never guess
  const iName=1, iBrand=4, iStore=7, iRegion=9, iCity=10, iDate=11, iUnits=13;
  
  // Safety: verify the headers actually match at these positions
  console.log('Header check:', {
    iName:  hdrs[iName],    // should be "Item Name"
    iBrand: hdrs[iBrand],   // should be "Brand"
    iStore: hdrs[iStore],   // should be "Store Name"
    iRegion:hdrs[iRegion],  // should be "Region"
    iCity:  hdrs[iCity],    // should be "City"
    iDate:  hdrs[iDate],    // should be "Order Date"
    iUnits: hdrs[iUnits],   // should be "Units Sold"
  });

  // ── Get distinct product names ──
  const productNames=[...new Set(
    rows.slice(1).filter(r=>r[iName]).map(r=>String(r[iName]).trim())
  )];

  // Helper: do two product names share enough significant words to be
  // considered "the same product" (allowing for minor naming differences)?
  const sharesSignificantWords=(a,b)=>{
    const wordsA=a.toLowerCase().split(/\s+/).filter(w=>w.length>2);
    const wordsB=b.toLowerCase().split(/\s+/).filter(w=>w.length>2);
    if(!wordsA.length||!wordsB.length) return false;
    const overlap=wordsA.filter(w=>wordsB.includes(w));
    // Require at least half of the shorter name's significant words to overlap
    const minLen=Math.min(wordsA.length,wordsB.length);
    return overlap.length/minLen>=0.5;
  };

  // Match to existing product name
  let targetName=existingProdName;
  if(productNames.length===1){
    // Only one product in the file — but verify it's actually a plausible
    // match for the SKU being updated. If it shares no real similarity
    // (e.g. completely different product/strain), reject rather than
    // silently applying the wrong product's data.
    if(!sharesSignificantWords(existingProdName,productNames[0])){
      throw new Error(
        'This file appears to be for "'+productNames[0]+'", which does not match '+
        '"'+existingProdName+'". Please upload the correct sales export for this SKU.'
      );
    }
    targetName=productNames[0];
  } else {
    const existingLower=existingProdName.toLowerCase().trim();
    // 1. Exact match (case-insensitive) — always preferred
    let match=productNames.find(n=>n.toLowerCase().trim()===existingLower);
    // 2. Otherwise, require ALL significant words (>2 chars) from existingProdName
    //    to appear in the candidate — prevents "...Blunt" matching "...Pre-Roll"
    //    when both share a long common prefix like "Northern Lights 60+ Diamonds & Shatter Infused"
    if(!match){
      const sigWords=existingLower.split(/\s+/).filter(w=>w.length>2);
      const candidates=productNames.filter(n=>{
        const nLower=n.toLowerCase();
        return sigWords.every(w=>nLower.includes(w));
      });
      if(candidates.length===1) match=candidates[0];
      else if(candidates.length>1){
        // Multiple candidates still match all words (e.g. true near-duplicates) —
        // pick the one with the closest word count / length as a tiebreaker
        match=candidates.reduce((best,c)=>
          Math.abs(c.length-existingProdName.length)<Math.abs(best.length-existingProdName.length)?c:best
        );
      }
    }
    // 3. Last resort — old loose prefix match, only if nothing else matched
    if(!match){
      const kw=existingProdName.split(' ').slice(0,3).join(' ').toLowerCase();
      match=productNames.find(n=>
        n.toLowerCase().includes(kw)||kw.includes(n.split(' ').slice(0,3).join(' ').toLowerCase())
      );
    }
    // Final sanity check — if we found "a" match but it's not actually
    // similar to the SKU we're updating, don't silently apply it
    if(match&&!sharesSignificantWords(existingProdName,match)) match=null;

    if(match){
      targetName=match;
    } else if(productNames.length>0){
      // Nothing in the file resembles this SKU at all
      throw new Error(
        'No data for "'+existingProdName+'" was found in this file. '+
        'Products in file: '+productNames.join(', ')
      );
    }
  }

  const dataRows=rows.slice(1).filter(r=>
    r[iName]&&String(r[iName]).trim()===targetName
  );

  if(dataRows.length===0)
    throw new Error('No rows for "'+targetName+'". Products in file: '+productNames.join(', '));

  // ── Aggregate ──
  const cities={}, stores={}, regions={}, weeks={}, months={}, daily={}, storeWeeks={}, storeRegions={};
  let totalUnits=0, totalOrders=0, brand='';

  dataRows.forEach(row=>{
    // Units Sold — always a small integer (never > 10,000 per order)
    let units=0;
    const rawUnits=row[iUnits];
    if(typeof rawUnits==='number'){
      units=Math.round(rawUnits);
    } else {
      units=parseInt(String(rawUnits||'0').replace(/[^0-9]/g,''))||0;
    }
    // Sanity check — if units looks like a barcode/ID (>50000), skip row
    if(units<=0||units>50000) return;

    const city  = String(row[iCity]  ||'Unknown').trim();
    const store = String(row[iStore] ||'Unknown').trim();
    const reg   = String(row[iRegion]||'').trim();
    if(iBrand>=0&&row[iBrand]) brand=String(row[iBrand]).trim();

    cities[city]  = (cities[city]  ||0)+units;
    stores[store] = (stores[store] ||0)+units;
    if(reg) regions[reg]=(regions[reg]||0)+units;
    if(reg&&!storeRegions[store]) storeRegions[store]=reg;
    totalUnits+=units;
    totalOrders++;

    // ── Date parsing ──
    const raw=row[iDate];
    let d=null;
    if(raw instanceof Date&&!isNaN(raw)){
      d=raw;
    } else if(typeof raw==='number'&&raw>0){
      // Excel serial number
      try{
        const pd=XLSX.SSF.parse_date_code(raw);
        if(pd) d=new Date(pd.y, pd.m-1, pd.d);
      }catch(e){}
    } else if(typeof raw==='string'&&raw.trim()){
      d=new Date(raw);
      if(isNaN(d)) d=null;
    }

    if(d&&!isNaN(d)){
      const yr=d.getFullYear(), mo=d.getMonth(), dy=d.getDate();
      const ds=yr+'-'+String(mo+1).padStart(2,'0')+'-'+String(dy).padStart(2,'0');
      const moStr=ds.slice(0,7);
      // ISO week number
      const utc=new Date(Date.UTC(yr,mo,dy));
      const dow=utc.getUTCDay()||7;
      utc.setUTCDate(utc.getUTCDate()+4-dow);
      const y1=new Date(Date.UTC(utc.getUTCFullYear(),0,1));
      const wkN=Math.ceil((((utc-y1)/86400000)+1)/7);
      const wk=utc.getUTCFullYear()+'-W'+String(wkN).padStart(2,'0');

      daily[ds]  =(daily[ds]  ||0)+units;
      weeks[wk]  =(weeks[wk]  ||0)+units;
      months[moStr]=(months[moStr]||0)+units;
      if(!storeWeeks[store]) storeWeeks[store]=new Set();
      storeWeeks[store].add(wk);
    }
  });

  // ── Store metrics per week ──
  const allWeeks=Object.keys(weeks).sort();
  const storeFirst={};
  Object.entries(storeWeeks).forEach(([s,ws2])=>{
    storeFirst[s]=Array.from(ws2).sort()[0];
  });
  let prev=new Set(); const weekMetrics={};
  allWeeks.forEach(wk=>{
    const active=new Set(
      Object.entries(storeWeeks).filter(([,ws2])=>ws2.has(wk)).map(([s])=>s)
    );
    const newS=new Set([...active].filter(s=>storeFirst[s]===wk));
    const repeat=new Set([...active].filter(s=>prev.has(s)));
    weekMetrics[wk]={active:active.size,new:newS.size,repeat:repeat.size,prevActive:prev.size};
    prev=active;
  });

  console.log('Parsed:', {totalUnits, totalOrders, stores:Object.keys(stores).length, weeks:allWeeks});

  return {
    detectedName: targetName,
    productNames,
    data:{
      brand,
      units: totalUnits,
      orders: totalOrders,
      storeCount: Object.keys(stores).length,
      cities:  Object.fromEntries(Object.entries(cities).sort(([,a],[,b])=>b-a)),
      stores:  Object.fromEntries(Object.entries(stores).sort(([,a],[,b])=>b-a)),
        storeRegions,
      regions,
      weekly:  Object.fromEntries(Object.entries(weeks).sort()),
      monthly: Object.fromEntries(Object.entries(months).sort()),
      daily:   Object.fromEntries(Object.entries(daily).sort()),
      storeMetrics:{
        weekMetrics,
        totalStores:Object.keys(stores).length,
        opportunity:Math.max(0,ONTARIO_STORES-Object.keys(stores).length)
      },
    }
  };
}

                  el('span',{style:{fontSize:11,color:'var(--text2)'}},p.skuId)

                p.isMera&&el('span',{style:{fontSize:9,background:'var(--ok-bg)',color:'var(--ok)',border:'1px solid var(--ok-dim)',borderRadius:3,padding:'1px 6px',fontWeight:700}},'MERA')
              ),
              el('div',{style:{display:'flex',gap:16,fontSize:11,color:'var(--text3)',flexWrap:'wrap'}},
                el('span',null,'Vel: ',el('strong',{style:{color:'var(--text)'}},p.ocs.velocity.toFixed(4))),
                el('span',null,'LW: ',el('strong',{style:{color:'var(--text)'}},p.ocs.lwUnits,' units')),
                el('span',null,'Stores 4W: ',el('strong',{style:{color:'var(--text)'}},p.ocs.storesL4W||'—')),
                el('span',null,'Pen 4W: ',el('strong',{style:{color:'var(--text)'}},p.ocs.penPct4W!=null?(p.ocs.penPct4W.toFixed(1)+'%'):'—'))
              )

        ),
        /* ── Step: Done ── */
        step==='done'&&el('div',{style:{textAlign:'center',padding:'20px 0'}},
          el('i',{className:'ti ti-circle-check',style:{fontSize:48,color:'var(--ok)',display:'block',marginBottom:12}}),
          el('div',{style:{fontSize:16,fontWeight:700,color:'var(--ok)'}},'Data Updated!'),

        )

  );

      if(rows.length<2) throw new Error('No data found in file.');
      const hdrs=rows[0].map(h=>String(h||'').trim());
      if(!hdrs.includes('Item Name')) throw new Error('Cannot find "Item Name" column.');
      // Get all distinct products in this file

      const parsed=[];
      for(const pName of allNames){
        try{

          // Try exact match first, then case-insensitive match
          const matchedKey=Object.keys(salesData).find(k=>
            k===pName||k.toLowerCase()===pName.toLowerCase()||
            k.toLowerCase().includes(pName.toLowerCase().split(' ').slice(0,2).join(' '))||
            pName.toLowerCase().includes(k.toLowerCase().split(' ').slice(0,2).join(' '))
          );
          parsed.push({name:matchedKey||pName,detected:result.detectedName,data:result.data,matched:!!matchedKey});
        }catch(e){
          parsed.push({name:pName,err:e.message});
        }
      }
      setResults(parsed);
    }catch(e){ setErr(e.message); }
    setBusy(false);
  };

  const applyAll=()=>{
    if(!results) return;
    const now=new Date().toISOString();
    results.filter(r=>!r.err&&r.matched).forEach(r=>{

      const updated={...existing,...r.data,pc:existing.pc,launchDate:existing.launchDate,ocs:existing.ocs};
      onUpdate(r.name, updated, {[r.name]:now});

    onClose();

  const unmatched=results?.filter(r=>!r.err&&!r.matched)||[];

// Static SKU code lookup for known products (fallback when saved data lacks skuCode)
const KNOWN_SKU_CODES={
  'Berry Blaze Liquid Diamonds All-in-One':'VA077',
  'Cherry Chonk Liquid Diamonds All-in-One':'VA078',
  'Northern Lights 60+ Diamonds & Shatter Infused Pre-Roll':'PR084',
  'Northern Lights 60+ Diamonds & Shatter Infused Blunt':'PR086',
  'Granddaddy Purple 60+ Diamonds & Shatter Infused Pre-Roll':'PR087',
  'Black Cherry Punch Live Rosin':'CN053',
  "Purple Haze & Strawberry OG Mix'd Pre-Roll":'PR085',
  '10th Planet Pre-Rolls':'PR085',
  'Watermelon Whammy Liquid Diamonds 510 Vape Cart':'VA079',
  'Golden Pineapple Live Resin & Liquid Diamonds All-in-One':'VA080',
  'Black Cherry Punch Bubble Hash Infused Pre-Roll':'PR088',
  'Cranberry Ginger Fizz 70+ Diamond Coated & Infused Pre-Roll':'PR089',
  'Ginger Fizz Live Resin & Liquid Diamonds All-in-One':'VA081',
  'Granddaddy Purple 60+ Diamonds & Shatter Infused Blunt':'PR090',
  "Pushn' Peach Liquid Diamonds All-in-One":'VA082',
  'Shatter Diamonds & Kief Triple Infused Pre-Roll Taster Pack':'PR091',
  'Grape Diamonds Pre-Roll':'PR083',
};
const getSkuCode=(name,prod)=>{
  if(prod?.skuCode) return prod.skuCode;
  if(KNOWN_SKU_CODES[name]) return KNOWN_SKU_CODES[name];
  // Fuzzy: find a known key where significant words overlap
  const nl=name.toLowerCase();
  const match=Object.keys(KNOWN_SKU_CODES).find(k=>{
    const kl=k.toLowerCase();
    const words=kl.split(' ').filter(w=>w.length>3);
    return words.length>0&&words.filter(w=>nl.includes(w)).length>=Math.ceil(words.length*0.6);
  });
  return match?KNOWN_SKU_CODES[match]:'';
};

// SKU prefix map per category
const SKU_PREFIXES={
  'Pre-Roll':'PR','Infused Pre-Roll':'PR','Vape':'VA','Concentrate':'CN','Other':'OT'
};
const fmtSkuCode=(prefix,n)=>prefix+String(n).padStart(3,'0');
const nextSkuCode=(cat,allProds)=>{
  const prefix=SKU_PREFIXES[cat]||'OT';
  if(prefix==='OT') return '';
  // Scan all existing products (tracker + post-launch + known codes) for highest number
  const existing=[
    ...Object.values(allProds||{}),
    ...Object.values(KNOWN_SKU_CODES)
  ].map(v=>{
    const code=typeof v==='string'?v:(v?.skuCode||v?.specs?._skuCode||'');
    const match=code.match(new RegExp('^'+prefix+'(\\d+)$','i'));
    return match?parseInt(match[1],10):0;
  });
  const max=existing.length?Math.max(...existing):0;
  return fmtSkuCode(prefix,max+1);
};

            (wowDelta>=0?'+':'')+wowDelta.toFixed(4)
          ),
          el('div',{style:{fontSize:16,color:wowDelta>=0?'var(--ok)':'var(--err)',marginTop:6}},
            el('i',{className:'ti '+(wowDelta>=0?'ti-arrow-up-right':'ti-arrow-down-right')}),
            ' '+(wowPct>=0?'+':'')+wowPct.toFixed(1)+'%'
          )
        ):el('div',{style:{fontSize:20,color:'var(--text3)',marginTop:16}},'—')
      ),
      // Next Class
      el('div',{style:{background:nextCol+'18',border:'1.5px dashed '+nextCol,borderRadius:16,padding:'28px 20px',textAlign:'center'}},
        el('div',{style:{fontSize:14,color:nextCol,fontWeight:700,marginBottom:8,textTransform:'uppercase',letterSpacing:'.07em'}},'Next: Class '+nextCls),
        el('div',{style:{fontSize:52,fontWeight:900,color:nextCol,lineHeight:1}},
          unitsToNext>0?'+'+unitsToNext.toLocaleString():'🏆'
        ),
        el('div',{style:{fontSize:14,color:nextCol,opacity:.7,marginTop:6}},
          unitsToNext>0?'units/week needed':'Top class achieved!'
        )
      )
    ),
    el('div',{style:{marginTop:32,fontSize:12,color:'var(--text3)'}},'Press M or Esc to exit meeting mode')
  );
}

const HOME_KEY='au_home_v1'; // kept for legacy migration
const getHomeData=(data)=>data?.home||{actions:[],notes:''};

function HomeView({data,setData,setView,setSels,setProdView}){
  const [home,setHome]=React.useState(()=>getHomeData(data));
  const [newAction,setNewAction]=React.useState('');

  const [newDue,setNewDue]=React.useState('');
  const [editNotes,setEditNotes]=React.useState(false);
  const inputRef=React.useRef();

  const save=d=>{
    setHome(d);
    setData(prev=>({...prev,home:d}));
  };
  const addAction=()=>{
    if(!newAction.trim())return;
    const item={id:Date.now(),text:newAction.trim(),owner:newOwner.trim(),due:newDue,done:false,createdAt:new Date().toISOString()};
    save({...home,actions:[...home.actions,item]});
    setNewAction('');setNewOwner('');setNewDue('');
    inputRef.current?.focus();
  };
  const toggleDone=id=>save({...home,actions:home.actions.map(a=>a.id===id?{...a,done:!a.done}:a)});
  const removeAction=id=>save({...home,actions:home.actions.filter(a=>a.id!==id)});

  const allProds=data.pcTabs.flatMap(t=>(data[t.id]||[]).map(p=>({...p,pc:t.id,pcLabel:t.label})));
  const allTasks=allProds.flatMap(p=>p.tasks);

  // Launching within 60 days
  const launching=allProds
    .filter(p=>{const d=getTMinus(p.launchDate);return d!==null&&d>=-7&&d<=60;})

  // Overdue by owner
  const overdueByOwner={};
  allTasks.filter(t=>isOverdue(t)).forEach(t=>{

/* ── SKU Comparator — overlay multiple products' performance ── */
function SKUComparator({salesData,hidden,activePC,onClose}){
  const pcProducts=Object.entries(salesData)
    .filter(([name,p])=>!hidden.includes(name)&&(p?.pc||'other')===activePC)
    .map(([name])=>name);

  const [selected,setSelected]=React.useState(()=>pcProducts.slice(0,Math.min(4,pcProducts.length)));
  const [metric,setMetric]=React.useState('cumulative'); // cumulative | daily | velocity
  const [alignBy,setAlignBy]=React.useState('launch'); // launch | calendar

  const COLORS=['#e8622a','#4a9edd','#3dba8a','#a78bfa','#e09b3d','#e06060','#5b9bd5','#f0c030'];

  const toggle=name=>setSelected(s=>s.includes(name)?s.filter(n=>n!==name):[...s,name]);

  // Build series data for each selected product
  const series=selected.map((name,i)=>{
    const prod=salesData[name];
    const daily=prod?.daily||{};
    const entries=Object.entries(daily).sort(([a],[b])=>a.localeCompare(b));
    if(!entries.length) return null;

    const launchDate=SALES_DATA_DEFAULT[name]?.launchDate || prod?.launchDate || entries[0][0];

    // Fill gaps with 0
    const firstDate=new Date(entries[0][0]+'T00:00:00');
    const lastDate=new Date(entries[entries.length-1][0]+'T00:00:00');
    const dailyMap=Object.fromEntries(entries);
    const filled=[];
    const cur=new Date(firstDate);
    while(cur<=lastDate){
      const ds=cur.toISOString().slice(0,10);
      filled.push([ds,dailyMap[ds]||0]);
      cur.setDate(cur.getDate()+1);
    }

    let cum=0;
    const points=filled.map(([date,units],idx)=>{
      cum+=units;
      // Days since launch (for "launch" alignment)
      const daysSince=Math.round((new Date(date+'T00:00:00')-new Date(launchDate+'T00:00:00'))/86400000);
      return {date,units,cum,daysSince,idx};
    });

    // Last week velocity
    const weekly=prod?.weekly||{};
    const wkEntries=Object.entries(weekly).sort(([a],[b])=>a.localeCompare(b));
    const lwUnits=wkEntries.length?wkEntries[wkEntries.length-1][1]:0;
    const vel=lwUnits/ONTARIO_STORES;

    return {
      name,
      shortName:prod?.shortName||name,
      brand:prod?.brand||'',
      color:COLORS[i%COLORS.length],
      points,
      totalUnits:cum,
      lwUnits,
      vel,
      skuClass:prod?.ocs?.skuClass||ocsClass(vel,prod?.ocs?.firstReceipt),
      launchDate,
    };
  }).filter(Boolean);

  // Determine x-axis range
  let maxDays=0, maxDate=null, minDate=null;
  series.forEach(s=>{
    s.points.forEach(p=>{
      if(alignBy==='launch') maxDays=Math.max(maxDays,p.daysSince);
      else{
        const d=new Date(p.date+'T00:00:00');
        if(!maxDate||d>maxDate) maxDate=d;
        if(!minDate||d<minDate) minDate=d;
      }
    });
  });

  const W=860,H=320,PL=50,PR=20,PT=20,PB=40;
  const cW=W-PL-PR, cH=H-PT-PB;

  const xPos=(s,p)=>{
    if(alignBy==='launch') return maxDays>0?(p.daysSince/maxDays)*cW:0;
    const range=maxDate-minDate||1;
    return ((new Date(p.date+'T00:00:00')-minDate)/range)*cW;
  };

  const getY=(s,p)=>{
    if(metric==='cumulative') return p.cum;
    if(metric==='daily') return p.units;
    return p.units; // velocity doesn't apply per-point
  };

  const maxY=Math.max(1,...series.flatMap(s=>s.points.map(p=>getY(s,p))));

  const yPos=v=>cH-(v/maxY)*cH;

  // Sort series by performance for ranking display
  const ranked=[...series].sort((a,b)=>{
    if(metric==='cumulative') return b.totalUnits-a.totalUnits;
    return b.vel-a.vel;
  });

  return el('div',{style:{
    background:'var(--bg)',border:'1px solid var(--bdr)',borderRadius:'var(--r)',
    padding:'18px',marginBottom:16
  }},
    /* Header */
    el('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:14,flexWrap:'wrap',gap:10}},
      el('div',{style:{fontSize:13,fontWeight:700,color:'var(--text)',display:'flex',alignItems:'center',gap:6}},
        el('i',{className:'ti ti-chart-line',style:{color:'var(--accent)'}}),
        'SKU Comparator'
      ),
      el('div',{style:{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}},
        /* Metric toggle */
        el('div',{style:{display:'flex',border:'1px solid var(--bdr)',borderRadius:'var(--pill)',overflow:'hidden'}},
          [['cumulative','Cumulative'],['daily','Daily']].map(([val,label])=>
            el('button',{key:val,onClick:()=>setMetric(val),style:{
              padding:'6px 14px',fontSize:11,fontFamily:'inherit',border:'none',cursor:'pointer',
              background:metric===val?'var(--grad-accent)':'transparent',
              color:metric===val?'#fff':'var(--text2)',fontWeight:metric===val?700:400
            }},label)
          )
        ),
        /* Align toggle */
        el('div',{style:{display:'flex',border:'1px solid var(--bdr)',borderRadius:'var(--pill)',overflow:'hidden'}},
          [['launch','Days Since Launch'],['calendar','Calendar']].map(([val,label])=>
            el('button',{key:val,onClick:()=>setAlignBy(val),style:{
              padding:'6px 14px',fontSize:11,fontFamily:'inherit',border:'none',cursor:'pointer',
              background:alignBy===val?'var(--grad-accent)':'transparent',
              color:alignBy===val?'#fff':'var(--text2)',fontWeight:alignBy===val?700:400
            }},label)
          )
        ),

/* ── 30-Day Launch Snapshot ── */
function Launch30Snapshot({current,launchDate}){
  if(!launchDate||!current?.daily) return null;

  const ld=new Date(launchDate+'T00:00:00');
  const d30=new Date(ld); d30.setDate(d30.getDate()+30);
  const today=TODAY_D;
  const isComplete=today>=d30;
  const windowEnd=isComplete?d30:today;
  const daysElapsed=Math.min(30,Math.max(0,Math.round((today-ld)/86400000)+1));

  // Daily entries within the 30-day window
  const dailyEntries=Object.entries(current.daily||{})
    .filter(([date])=>{
      const d=new Date(date+'T00:00:00');
      return d>=ld&&d<d30;
    })
    .sort(([a],[b])=>a.localeCompare(b));

  const units30=dailyEntries.reduce((s,[,v])=>s+v,0);
  const totalUnits=current.units||0;
  const pctOfTotal=totalUnits>0?Math.round(units30/totalUnits*100):0;
  const avgDailyVel30=daysElapsed>0?(units30/daysElapsed)/ONTARIO_STORES:0;

  // Build a full 0-29 day array (fill gaps with 0)
  const dayMap=Object.fromEntries(dailyEntries.map(([date,v])=>{
    const dnum=Math.round((new Date(date+'T00:00:00')-ld)/86400000);
    return [dnum,v];
  }));
  const days=Array.from({length:30},(_,i)=>({day:i,units:dayMap[i]||0}));
  const maxDayUnits=Math.max(1,...days.map(d=>d.units));

  // 30-day projected OCS class (based on avg daily velocity over the window)
  const projClass=ocsClass(avgDailyVel30,launchDate);
  const CLS_G={A:'linear-gradient(135deg,#fde68a,#f0c030)',B:'var(--grad-ok)',C:'var(--grad-info)',D:'var(--grad-warn)',E:'var(--grad-err)',N:'var(--grad-accent)'};
  const clsInfo=ROS_CLASSES.find(r=>r.cls===projClass);

  // Distribution ramp — weekly store counts within the 30-day window
  const wkEntries=Object.entries(current.storeMetrics?.weekMetrics||{}).sort(([a],[b])=>a.localeCompare(b));
  const ld30Weeks=wkEntries.filter(([wk])=>{
    // Approximate: parse ISO week, compare against launch + 30
    const [y,w]=wk.split('-W');
    const jan1=new Date(parseInt(y),0,1);
    const wkStart=new Date(jan1); wkStart.setDate(jan1.getDate()+(parseInt(w)-1)*7);
    return wkStart<d30 && wkStart>=new Date(ld.getFullYear(),ld.getMonth(),ld.getDate()-7);
  }).slice(0,5);

  let cumStores=0;
  const distRamp=ld30Weeks.map(([wk,m])=>{
    cumStores=Math.max(cumStores,m.active); // approximate cumulative reach using peak active
    return {wk,active:m.active,new:m.new};
  });
  const storesReached30=current.storeCount||0;
  const distPct30=Math.round(storesReached30/ONTARIO_STORES*100);

  // Cumulative line for sparkline
  let cum=0;
  const cumPoints=days.map(d=>{cum+=d.units;return cum;});
  const maxCum=Math.max(1,...cumPoints);

  const W=820,H=110,PL=4,PR=4,PT=8,PB=4;
  const cW=W-PL-PR,cH=H-PT-PB;
  const barW=cW/30;

  return el('div',{style:{
    background:'var(--bg)',border:'1px solid var(--bdr)',borderRadius:'var(--r)',
    padding:'18px',marginTop:16,marginBottom:16,position:'relative',overflow:'hidden'
  }},
    el('div',{style:{position:'absolute',left:0,top:0,right:0,height:3,background:'var(--grad-accent)'}}),

    /* Header */
    el('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:14,flexWrap:'wrap',gap:8}},
      el('div',{style:{fontSize:13,fontWeight:700,color:'var(--text)',display:'flex',alignItems:'center',gap:6}},
        el('i',{className:'ti ti-rocket',style:{color:'var(--accent)'}}),
        '30-Day Launch Snapshot'
      ),
      el('div',{style:{fontSize:11,color:'var(--text3)'}},
        isComplete
          ? fmtD(launchDate)+' → '+fmtD(d30.toISOString().slice(0,10))+'  ·  complete'
          : 'Day '+daysElapsed+' of 30  ·  launched '+fmtD(launchDate)
      )
    ),

    /* Key metric tiles */
    el('div',{style:{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:10,marginBottom:16}},
      el('div',{style:{background:'var(--bg2)',borderRadius:'var(--rs)',padding:'12px 14px'}},
        el('div',{style:{fontSize:10,color:'var(--text3)',fontWeight:600,marginBottom:4}},'Units (first 30d)'),
        el('div',{style:{fontSize:24,fontWeight:700,fontFamily:'var(--font-mono)',color:'var(--text)',lineHeight:1}},units30.toLocaleString()),
        el('div',{style:{fontSize:10,color:'var(--text3)',marginTop:3}},pctOfTotal+'% of all-time units')
      ),
      el('div',{style:{background:'var(--bg2)',borderRadius:'var(--rs)',padding:'12px 14px'}},
        el('div',{style:{fontSize:10,color:'var(--text3)',fontWeight:600,marginBottom:4}},'Avg Daily Velocity'),
        el('div',{style:{fontSize:24,fontWeight:700,fontFamily:'var(--font-mono)',color:'var(--text)',lineHeight:1}},avgDailyVel30.toFixed(4)),
        el('div',{style:{fontSize:10,color:'var(--text3)',marginTop:3}},'units/store/day')
      ),
      el('div',{style:{background:'var(--bg2)',borderRadius:'var(--rs)',padding:'12px 14px'}},
        el('div',{style:{fontSize:10,color:'var(--text3)',fontWeight:600,marginBottom:4}},'Stores Reached'),
        el('div',{style:{fontSize:24,fontWeight:700,fontFamily:'var(--font-mono)',color:'var(--info)',lineHeight:1}},storesReached30),
        el('div',{style:{fontSize:10,color:'var(--text3)',marginTop:3}},distPct30+'% of '+ONTARIO_STORES.toLocaleString()+' stores')
      ),
      el('div',{style:{background:CLS_G[projClass]||'var(--bg2)',borderRadius:'var(--rs)',padding:'12px 14px',display:'flex',flexDirection:'column',justifyContent:'center'}},
        el('div',{style:{fontSize:10,color:'rgba(255,255,255,.85)',fontWeight:600,marginBottom:4}},isComplete?'30-Day Class':'Projected Class'),
        el('div',{style:{fontSize:24,fontWeight:900,color:'#fff',lineHeight:1}},projClass),
        el('div',{style:{fontSize:10,color:'rgba(255,255,255,.85)',marginTop:3}},clsInfo?.label||'')
      )
    ),

    /* Daily units bar chart with cumulative overlay */
    el('div',{style:{marginBottom:distRamp.length?16:0}},
      el('div',{style:{fontSize:10,fontWeight:700,textTransform:'uppercase',letterSpacing:'.1em',color:'var(--muted)',fontFamily:'var(--font-mono)',marginBottom:8}},
        'Daily Units — Day 0 to Day 29'
      ),
      el('svg',{viewBox:`0 0 ${W} ${H}`,style:{width:'100%',height:'auto',display:'block'}},
        el('defs',null,
          el('linearGradient',{id:'l30grad',x1:'0',y1:'0',x2:'0',y2:'1'},
            el('stop',{offset:'0%',stopColor:'var(--accent)',stopOpacity:0.9}),
            el('stop',{offset:'100%',stopColor:'var(--accent)',stopOpacity:0.35})
          )
        ),
        // Bars
        days.map((d,i)=>{
          const h=Math.max(1,(d.units/maxDayUnits)*(cH-18));
          const isToday=!isComplete&&i===daysElapsed-1;
          return el('rect',{
            key:i,
            x:PL+i*barW+1, y:PT+(cH-18)-h,
            width:Math.max(1,barW-2), height:h,
            fill:isToday?'var(--accent)':'url(#l30grad)',
            rx:1.5,
            opacity:i<daysElapsed||isComplete?1:0.15
          });
        }),
        // Cumulative line
        el('polyline',{
          points:cumPoints.map((c,i)=>`${PL+i*barW+barW/2},${PT+cH-(c/maxCum)*(cH-18)}`).join(' '),
          fill:'none',stroke:'var(--info)',strokeWidth:1.5,strokeDasharray:'3 2',opacity:0.7
        }),
        // Day markers every 5 days
        [0,5,10,15,20,25,29].map(i=>el('text',{
          key:i,x:PL+i*barW+barW/2,y:H-2,fontSize:8,fill:'var(--text3)',textAnchor:'middle',fontFamily:'inherit'
        },'D'+i)),
        // Today marker
        !isComplete&&daysElapsed<=30&&el('line',{
          x1:PL+(daysElapsed-1)*barW+barW,y1:PT,x2:PL+(daysElapsed-1)*barW+barW,y2:PT+cH-18,
          stroke:'var(--err)',strokeWidth:1,strokeDasharray:'2 2'
        })
      ),
      el('div',{style:{display:'flex',gap:14,marginTop:6,fontSize:9,color:'var(--text3)'}},
        el('span',null,el('span',{style:{display:'inline-block',width:8,height:8,background:'var(--accent)',borderRadius:2,marginRight:4,verticalAlign:'middle'}}),'Daily units'),
        el('span',null,el('span',{style:{display:'inline-block',width:12,height:0,borderTop:'1.5px dashed var(--info)',marginRight:4,verticalAlign:'middle'}}),'Cumulative'),
        !isComplete&&el('span',null,el('span',{style:{display:'inline-block',width:8,height:8,background:'var(--err)',borderRadius:1,marginRight:4,verticalAlign:'middle',opacity:.6}}),'Today (Day '+(daysElapsed-1)+')')
      )
    ),

    /* Distribution ramp */
    distRamp.length>0&&el('div',null,
      el('div',{style:{fontSize:10,fontWeight:700,textTransform:'uppercase',letterSpacing:'.1em',color:'var(--muted)',fontFamily:'var(--font-mono)',marginBottom:8}},
        'Store Distribution Ramp (weekly)'
      ),
      el('div',{style:{display:'flex',gap:8,flexWrap:'wrap'}},
        distRamp.map(({wk,active,new:n},i)=>el('div',{key:wk,style:{
          flex:1,minWidth:90,background:'var(--bg2)',borderRadius:'var(--rs)',padding:'8px 10px',position:'relative',overflow:'hidden'
        }},
          el('div',{style:{position:'absolute',left:0,top:0,bottom:0,width:3,background:'var(--grad-info)'}}),
          el('div',{style:{fontSize:9,color:'var(--text3)',marginLeft:6}},fmtWeek(wk)),
          el('div',{style:{fontSize:18,fontWeight:700,fontFamily:'var(--font-mono)',color:'var(--text)',marginLeft:6}},active),
          n>0&&el('div',{style:{fontSize:9,color:'var(--ok)',fontWeight:600,marginLeft:6}},'+'+n+' new')
        ))
      )
    )
  );
}


function PostLaunchView({data,setData,addChangelogEntry}){
  // data = main dashboard data — post launch lives in data.postLaunch
  // Merge: default SALES_DATA first, then override with any saved data
  const [salesData,setSalesData]=React.useState(()=>{
    const saved=data.postLaunch||{};
    return Object.keys(saved).length>0?saved:SALES_DATA_DEFAULT;
  });
  const [hidden,setHidden]=React.useState(()=>data.postLaunchHidden||[]);
  const [sel,setSel]=React.useState(()=>{
    const saved=data.postLaunch||{};
    const src=Object.keys(saved).length>0?saved:SALES_DATA_DEFAULT;
    return Object.keys(src)[0]||'';
  });
  const [activePC,setActivePC]=React.useState('pc1');
  const [showAddSKU,setShowAddSKU]=React.useState(false);
  const [showUpdateSKU,setShowUpdateSKU]=React.useState(false);
  const [showBulkUpload,setShowBulkUpload]=React.useState(false);
  const [showChangelog,setShowChangelog]=React.useState(false);
  const [showComparator,setShowComparator]=React.useState(false);
  const [lastUpdated,setLastUpdated]=React.useState(()=>data.postLaunchLastUpdated||{});

  const saveHidden=h=>{
    setHidden(h);
    setData(d=>({...d,postLaunchHidden:h}));
  };
  const removeProduct=name=>saveHidden([...hidden,name]);
  const restoreProduct=name=>saveHidden(hidden.filter(h=>h!==name));

  // PC groupings matching the launch dashboard tabs
  const PC_GROUPS=[
    ...(data.pcTabs||[{id:'pc1',label:'PC#1 2026'},{id:'pc2',label:'PC#2 2026'},{id:'pc3',label:'PC#3 2026'}]),
    {id:'other',label:'Other SKUs'},
  ];

  // Resolve launchDate: prefer the launch dashboard product's launchDate, fallback to SALES_DATA
  const getEffectiveLaunchDate=(name,sdProd)=>{
    // 1. Try to find matching product in launch dashboard by name similarity
    for(const pcKey of Object.keys(data)){
      if(!Array.isArray(data[pcKey]))continue;
      const match=data[pcKey].find(p=>
        p.name&&name&&(
          name.toLowerCase().includes(p.shortName?.toLowerCase())||
          p.name.toLowerCase().includes(name.split(' ').slice(0,3).join(' ').toLowerCase())
        )
      );
      if(match&&match.launchDate)return match.launchDate;
    }
    // 2. Fall back to launchDate on the sales data product itself
    if(sdProd?.launchDate)return sdProd.launchDate;
    // 3. Fall back to OCS first receipt date
    if(sdProd?.ocs?.firstReceipt)return sdProd.ocs.firstReceipt;
    return '';
  };

  // Products grouped by PC
  const allNames=Object.keys(salesData).filter(k=>!hidden.includes(k));
  const grouped=PC_GROUPS.map(pc=>({
    ...pc,
    products:allNames.filter(name=>(salesData[name]?.pc||'other')===pc.id)
  })).filter(g=>g.products.length>0||(g.id===activePC));

  // If active PC has no products, auto-select first PC that does
  React.useEffect(()=>{
    const firstWithProducts=grouped.find(g=>g.products.length>0);
    if(firstWithProducts&&!grouped.find(g=>g.id===activePC)?.products?.length){
      setActivePC(firstWithProducts.id);
    }
  },[]);

  const activeGroup=grouped.find(g=>g.id===activePC);
  const visibleProds=activeGroup?.products||[];

  // Auto-select first product in active PC if current sel not in this PC
  React.useEffect(()=>{
    if(visibleProds.length>0&&!visibleProds.includes(sel)){
      setSel(visibleProds[0]);
    }
  },[activePC]);

  const current=salesData[sel];

  // Global Y-axis max for Daily Orders chart — consistent scale across all products
  // Computed from products in the current PC group so comparisons are meaningful
  const globalDailyMax=React.useMemo(()=>{
    let max=1;
    Object.entries(salesData).forEach(([name,prod])=>{
      if(hidden.includes(name)) return;
      if((prod?.pc||'other')!==activePC) return;
      if(!prod?.daily) return;
      const vals=Object.values(prod.daily);
      if(vals.length) max=Math.max(max,...vals);
    });
    return max;
  },[salesData,hidden,activePC]);
  // Use SALES_DATA_DEFAULT launchDate (first order date) as priority for milestone markers
  // Falls back to OCS firstReceipt, then dashboard launch date
  const effectiveLaunchDate=current?(
    current?.launchDate ||
    SALES_DATA_DEFAULT[sel]?.launchDate ||
    current?.ocs?.firstReceipt ||
    getEffectiveLaunchDate(sel,current) ||
    ''
  ):'';

  if(Object.keys(salesData).filter(k=>!hidden.includes(k)).length===0)
    return el('div',{style:{padding:40,textAlign:'center',color:'var(--text2)'}},
      el('i',{className:'ti ti-chart-off',style:{fontSize:36,display:'block',marginBottom:12,opacity:.4}}),
      'All products hidden.',el('br',null),
      el('div',{style:{marginTop:16,display:'flex',gap:8,justifyContent:'center',flexWrap:'wrap'}},
        hidden.map(name=>el('button',{key:name,onClick:()=>restoreProduct(name),className:'btn'},el('i',{className:'ti ti-eye'}),' '+name.slice(0,30)))
      )
    );

  return el('div',{style:{padding:'20px'}},
    /* ── PC Tab bar ── */
    el('div',{style:{display:'flex',gap:0,borderBottom:'0.5px solid var(--bdr)',marginBottom:16,overflowX:'auto'}},
      PC_GROUPS.map(pc=>{
        const count=Object.keys(salesData).filter(k=>!hidden.includes(k)&&(salesData[k]?.pc||'other')===pc.id).length;
        if(count===0)return null;
        const isOn=activePC===pc.id;
        return el('button',{key:pc.id,onClick:()=>setActivePC(pc.id),style:{
          background:'transparent',border:'none',
          borderBottom:isOn?'2.5px solid var(--info)':'2.5px solid transparent',
          cursor:'pointer',padding:'8px 18px',fontSize:13,fontFamily:'inherit',
          color:isOn?'var(--info)':'var(--text2)',fontWeight:isOn?700:'normal',
          display:'flex',alignItems:'center',gap:7,whiteSpace:'nowrap',
          marginBottom:-1,
        }},
          pc.label,
          el('span',{style:{fontSize:10,background:isOn?'var(--info-bg)':'var(--bg2)',color:isOn?'var(--info)':'var(--text3)',borderRadius:10,padding:'1px 7px',fontWeight:700}},count)
        );
      }),
      el('button',{
        onClick:()=>setShowComparator(s=>!s),
        style:{
          marginLeft:'auto',padding:'6px 14px',fontSize:12,fontFamily:'inherit',
          border:'1px solid '+(showComparator?'var(--accent)':'var(--bdr)'),
          borderRadius:'var(--rs)',cursor:'pointer',
          background:showComparator?'var(--accent-bg)':'var(--bg)',
          color:showComparator?'var(--accent)':'var(--text2)',
          fontWeight:showComparator?700:400,
          display:'flex',alignItems:'center',gap:6,whiteSpace:'nowrap',marginBottom:-1
        }
      },el('i',{className:'ti ti-chart-dots'}),' Compare SKUs')
    ),

  showComparator&&el(SKUComparator,{salesData,hidden,activePC,onClose:()=>setShowComparator(false)}),

    /* ── Product cards for active PC ── */
    el('div',{style:{marginBottom:20}},
      el('div',{style:{display:'flex',gap:10,flexWrap:'wrap',alignItems:'flex-start'}},
        visibleProds.map(name=>{
          const d=salesData[name];const isOn=sel===name;
          return el('div',{key:name,style:{position:'relative',display:'inline-block'}},
            el('div',{onClick:()=>setSel(name),style:{
              background:isOn?'var(--info-bg)':'var(--bg)',
              border:'0.5px solid '+(isOn?'var(--info)':'var(--bdr)'),
              borderRadius:10,padding:'12px 16px',cursor:'pointer',minWidth:190,
              boxShadow:isOn?'0 0 0 1px var(--info)':'none',transition:'all .12s'
            }},
              el('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:4}},
                el('div',{style:{display:'flex',alignItems:'center',gap:5}},
                  el('div',{style:{fontSize:10,color:isOn?'var(--info)':'var(--text3)',fontWeight:700,textTransform:'uppercase',letterSpacing:'.07em'}},d.brand),
                  getSkuCode(name,d)&&el('span',{style:{
                    fontSize:9,fontWeight:800,
                    background:isOn?'var(--info)':'var(--bg3)',
                    color:isOn?'#fff':'var(--text3)',
                    borderRadius:'var(--pill)',padding:'1px 6px',letterSpacing:'.04em'
                  }},getSkuCode(name,d))
                ),

const APP_PASSWORD='Mera2026!';
const AUTH_KEY='au_auth_v1';

function LoginScreen({onAuth}){
  const [pw,setPw]   = React.useState('');
  const [err,setErr] = React.useState(false);
  const pwRef = React.useRef();
  React.useEffect(()=>{ pwRef.current?.focus(); },[]);

  const submit=()=>{
    if(pw===APP_PASSWORD){ setAuthed(); onAuth(null); }
    else{ setErr(true); setPw(''); setTimeout(()=>pwRef.current?.focus(),50); }
  };

  return el('div',{style:{
    minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',
    background:'var(--bg2)',padding:20
  }},
    el('div',{style:{

      ),
      el('h1',{style:{fontSize:20,fontWeight:800,color:'var(--text)',marginBottom:28}},
        'Product Launch Dashboard'
      ),
      el('input',{
        ref:pwRef,type:'password',className:'ei',
        placeholder:'Enter password',value:pw,
        onChange:e=>{setPw(e.target.value);setErr(false);},
